      -webkit-touch-callout: none;

    #controlsBox .flagChip,

<script>
(() => {
  const poster = document.getElementById('titlePoster');
  const titleLines = poster?.querySelectorAll('.posterTitlePrimary, .posterTitleSecondary');
  if (!poster || !titleLines?.length) return;

  const fitPosterTitle = () => {
    const targetLength = poster.getBoundingClientRect().width * .88;
    if (!(targetLength > 0)) return;
    const svgLength = targetLength.toFixed(2);
    titleLines.forEach(line => line.setAttribute('textLength', svgLength));
  };

  fitPosterTitle();
  if ('ResizeObserver' in window) {
    const posterTitleObserver = new ResizeObserver(fitPosterTitle);
    posterTitleObserver.observe(poster);
  } else {
    window.addEventListener('resize', fitPosterTitle, { passive:true });
  }
})();
</script>

function graphicsTier(){return runtimePerf.gfxTier;}

function setGraphicsTier(tier,reason='runtime') {
if(!['low','high'].includes(tier)||runtimePerf.gfxOverride&&tier!==runtimePerf.gfxOverride)return false;
if(runtimePerf.gfxTier===tier){runtimePerf.gfxReason=reason;return false;}

state.sceneDirty=true;threeView.lastRender=0;
syncThreeShadowMapSize();
invalidateOverlayLayout();invalidateHud();
return true;
}

function recordGraphicsFrame(ms) {
if(runtimePerf.gfxOverride||runtimePerf.gfxTier!=='high'||runtimePerf.frameSampleComplete||!threeView.renderer||!state.started||state.modalOpen||!Number.isFinite(ms)||ms<4||ms>250)return false;
runtimePerf.frameSamples.push(ms);
if(runtimePerf.frameSamples.length<30)return false;
const values=runtimePerf.frameSamples.slice(0,30),sorted=[...values].sort((a,b)=>a-b);
const mean=values.reduce((sum,value)=>sum+value,0)/values.length,p90=sorted[Math.min(sorted.length-1,Math.ceil(sorted.length*.9)-1)];
runtimePerf.frameStats={count:30,mean:Number(mean.toFixed(2)),p90:Number(p90.toFixed(2))};
runtimePerf.frameSampleComplete=true;
if(mean>22||p90>28)setGraphicsTier('low','auto-frame-time');
return true;
}

}

function normalizePatrolProgress(raw={}) {
return {
runs:Math.max(0,Math.floor(Number(raw?.runs)||0)),
gold:Math.max(0,Math.floor(Number(raw?.gold)||0)),
silver:Math.max(0,Math.floor(Number(raw?.silver)||0)),
bronze:Math.max(0,Math.floor(Number(raw?.bronze)||0)),
history:Array.isArray(raw?.history)?raw.history.slice(-30).filter(item=>item&&typeof item==='object').map(item=>({
mission:String(item.mission||''),
grade:['gold','silver','bronze'].includes(item.grade)?item.grade:'bronze',
seconds:Math.max(0,Number(item.seconds)||0),
completedAt:Math.max(0,Number(item.completedAt)||0)
})):[]
};
}

function normalizeZoomHints(raw) {
if (raw && typeof raw==='object' && !Array.isArray(raw)) {
return Object.fromEntries(Object.entries(raw).map(([key,value])=>[key,!!value]));
}
return {paintedFolds:!!raw,patrol:!!raw};
}

function deriveV7Tools(guidedCompleted,rawTools=null) {
const tools={elev:true,gradF:true,contour:false,dual:false,angle:false};
if (rawTools && typeof rawTools==='object') {
for (const key of Object.keys(tools)) if (rawTools[key]===true) tools[key]=true;
}
GUIDED_LEVEL_IDS.forEach((id,index)=>{
if (!guidedCompleted[id]) return;
for (const key of TRAIL_TOOLKEYS[index]) tools[key]=true;
});
return tools;
}

function normalizeProgressV7(raw={}) {
const guidedCompleted=blankGuidedCompleted();
for (const id of GUIDED_LEVEL_IDS) guidedCompleted[id]=!!raw?.guidedCompleted?.[id];
const guidedRuns=blankGuidedRuns();
for (const id of GUIDED_LEVEL_IDS) {
const run=raw?.guidedRuns?.[id];
guidedRuns[id]=run&&typeof run==='object'&&!Array.isArray(run)?Object.assign({},run):null;
}
return {
version:7,
guidedCompleted,
guidedRuns,
tools:deriveV7Tools(guidedCompleted,raw?.tools),
patrol:normalizePatrolProgress(raw?.patrol),
zoomHintSeen:normalizeZoomHints(raw?.zoomHintSeen)
};
}

function migrateLegacyProgress(raw={}) {
const guidedCompleted=blankGuidedCompleted();
const legacyCompleted=raw?.['story'+'Completed'];
const legacyRatings=raw?.['story'+'Stars'];
const oldCompleted=legacyCompleted&&typeof legacyCompleted==='object'?legacyCompleted:{};
const legacyRatingsMap=legacyRatings&&typeof legacyRatings==='object'?Object.assign({},legacyRatings):{};
for (const [key,value] of Object.entries(raw||{})) {
if (/^\d+$/.test(key)&&Number.isFinite(Number(value))) legacyRatingsMap[key]=Math.max(Number(legacyRatingsMap[key])||0,Number(value));
}
GUIDED_LEVEL_IDS.forEach((id,index)=>{
guidedCompleted[id]=!!oldCompleted[index]||Number(legacyRatingsMap[index]||0)>0||!!raw?.guidedCompleted?.[id];
});
return {
version:7,
guidedCompleted,
guidedRuns:blankGuidedRuns(),
tools:deriveV7Tools(guidedCompleted),
patrol:normalizePatrolProgress(raw?.patrol),
zoomHintSeen:normalizeZoomHints(raw?.zoomHintSeen)
};
}

function loadProgress() {
let raw=null,sourceKey=null;
try {
const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
if (parsed&&typeof parsed==='object') {raw=parsed;sourceKey=STORAGE_KEY;}
} catch {}
if (!raw) {
for (const key of PREVIOUS_STORAGE_KEYS) {
try {
const parsed=JSON.parse(localStorage.getItem(key)||'null');
if (parsed&&typeof parsed==='object') {raw=parsed;sourceKey=key;break;}
} catch {}
}
}
if (!raw) {
try {
const parsed=JSON.parse(localStorage.getItem('lnp-stars')||'null');
if (parsed&&typeof parsed==='object') {raw=parsed;sourceKey='lnp-stars';}
} catch {}
}
progressMigrationPending=!!sourceKey&&sourceKey!==STORAGE_KEY;
return Number(raw?.version)===7&&sourceKey===STORAGE_KEY
?normalizeProgressV7(raw)
:migrateLegacyProgress(raw||{});
}

function saveProgress() {
const clean=normalizeProgressV7(state.progress);
try {
localStorage.setItem(STORAGE_KEY,JSON.stringify(clean));
state.progress=clean;
if (progressMigrationPending) {
for (const key of PREVIOUS_STORAGE_KEYS) localStorage.removeItem(key);
localStorage.removeItem('lnp-stars');
progressMigrationPending=false;
}
return true;
} catch {
return false;
}
}

function encodeVisitedBits(visited=[]) {
const bytes=new Uint8Array(Math.ceil(visited.length/8));
for (let index=0;index<visited.length;index++) {
if (visited[index]) bytes[index>>3]|=1<<(index&7);
}
let binary='';
for (let offset=0;offset<bytes.length;offset+=8192) {
binary+=String.fromCharCode(...bytes.subarray(offset,offset+8192));
}
return btoa(binary);
}

function decodeVisitedBits(encoded,length) {
const size=Math.max(0,Math.floor(Number(length)||0));
if (typeof encoded!=='string') throw new TypeError('visitedBits must be a base64 string');
let binary;
try { binary=atob(encoded); } catch { throw new TypeError('visitedBits is not valid base64'); }
const expectedBytes=Math.ceil(size/8);
if (binary.length!==expectedBytes) throw new RangeError(`visitedBits length ${binary.length} does not match ${expectedBytes}`);
const visited=new Array(size).fill(false);
for (let index=0;index<size;index++) visited[index]=!!(binary.charCodeAt(index>>3)&(1<<(index&7)));
return visited;
}

function guidedSnapshotVisitedCount(snapshot) {
if(typeof snapshot?.visitedBits!=='string')return 0;
try{
const binary=atob(snapshot.visitedBits);
let count=0;
for(let index=0;index<binary.length;index++){
let byte=binary.charCodeAt(index);
while(byte){count+=byte&1;byte>>=1;}
}
return count;
}catch{return 0;}
}

function guidedSnapshotHasProgress(snapshot) {
if(!snapshot||typeof snapshot!=='object')return false;
if(snapshot.started===true)return true;
if(snapshot.started===false)return false;
const initialPos=Math.round(Math.max(1,state.samples?.length||1600)*.08);
return Math.round(Number(snapshot.pos)||0)!==initialPos
||guidedSnapshotVisitedCount(snapshot)>29
||(Array.isArray(snapshot.stakes)&&snapshot.stakes.length>0)
||snapshot.pendingCandidateKey!=null
||snapshot.selectedMark!=null
||(Array.isArray(snapshot.evaluatedMarkPairs)&&snapshot.evaluatedMarkPairs.length>0)
||snapshot.phase==='rank'
||!!snapshot.marksCorrect
||Number(snapshot.missCount)>0
||Number(snapshot.typeMissCount)>0
||Number(snapshot.reportCount)>0
||Number(snapshot.hintStage)>0
||!!snapshot.hintUsed
||snapshot.hintShadeCandidateKey!=null;
}

function guidedCandidateByKey(candidateKey,candidates=state.candidates) {

function snapshotCandidateForStake(stake) {
if (stake?.candidateKey) return guidedCandidateByKey(stake.candidateKey);
if (!stake||!Number.isFinite(stake.idx)) return null;
return state.candidates.find(candidate=>trailArcDistanceFrac(stake.idx,candidate.i)<=STAKE_EPS_FRAC)||null;
}

function createGuidedSnapshot(level=state.level) {
if (state.runType!=='story'||!level||!GUIDED_LEVEL_IDS.includes(level.id)) return null;
const stakes=state.stakes
.slice().sort((a,b)=>a.slot-b.slot)
.map(stake=>({stake,candidate:snapshotCandidateForStake(stake)}))
.filter(({stake,candidate})=>candidate&&(stake.verdict==='confirmed'||stake.verdict==='pending'||candidate.claimedBy!=null||candidate.key===state.pendingCandidateKey))
.map(({stake,candidate})=>({
slot:Math.max(1,Math.floor(Number(stake.slot)||1)),
candidateKey:candidate.key,
claimType:stake.claimType||null,
mark:stake.mark||null
}));
const hintedCandidate=state.candidates[state.hintShadeCandidate]||guidedCandidateByKey(state.hintShadeCandidateKey);
return {
levelId:level.id,
progressRevision:Number(level.progressRevision)||1,
candidateSignature:level.candidateSignature||state.candidateSignature||'',
savedAt:Date.now(),
started:!!state.started,
pos:mod(Math.round(Number(state.pos)||0),Math.max(1,state.samples.length)),
lastDir:Number(state.lastDir)<0?-1:1,
phase:state.phase||'locate',
stakes,
pendingCandidateKey:state.pendingCandidateKey||null,
selectedMark:state.selectedMark||null,
evaluatedMarkPairs:Array.isArray(state.evaluatedMarkPairs)?state.evaluatedMarkPairs.slice():[],
marksCorrect:!!state.marksCorrect,
missCount:Math.max(0,Math.floor(Number(state.missCount)||0)),
typeMissCount:Math.max(0,Math.floor(Number(state.typeMissCount)||0)),
reportCount:Math.max(0,Math.floor(Number(state.reportCount)||0)),
hintStage:Math.max(0,Math.floor(Number(state.hintStage)||0)),
hintUsed:!!state.hintUsed,
hintShadeCandidateKey:hintedCandidate?.key||null,
visitedBits:encodeVisitedBits(state.visited)
};
}

function validateGuidedSnapshot(level,snapshot,candidates=state.candidates) {
if (!level||!snapshot||typeof snapshot!=='object') return {valid:false,reason:'missing'};
if (snapshot.levelId!==level.id) return {valid:false,reason:'level'};
if (Number(snapshot.progressRevision)!==Number(level.progressRevision||1)) return {valid:false,reason:'revision'};
const signature=level.candidateSignature||candidates.map(candidate=>candidate.key).sort().join('|');
if (snapshot.candidateSignature!==signature) return {valid:false,reason:'signature'};
const keys=new Set(candidates.map(candidate=>candidate.key));
if (!Array.isArray(snapshot.stakes)||snapshot.stakes.some(stake=>!stake||!keys.has(stake.candidateKey))) return {valid:false,reason:'stakes'};
const savedKeys=snapshot.stakes.map(stake=>stake.candidateKey);
const savedSlots=snapshot.stakes.map(stake=>Number(stake.slot));
if(new Set(savedKeys).size!==savedKeys.length||new Set(savedSlots).size!==savedSlots.length)return {valid:false,reason:'duplicate'};
if (snapshot.pendingCandidateKey!=null&&!keys.has(snapshot.pendingCandidateKey)) return {valid:false,reason:'pending'};
if(snapshot.pendingCandidateKey!=null&&savedKeys.filter(key=>key===snapshot.pendingCandidateKey).length!==1)return {valid:false,reason:'pending'};
if (snapshot.hintShadeCandidateKey!=null&&!keys.has(snapshot.hintShadeCandidateKey)) return {valid:false,reason:'hint'};
try { decodeVisitedBits(snapshot.visitedBits,state.samples.length); }
catch { return {valid:false,reason:'visited'}; }
return {valid:true,reason:null};
}

function rebuildSnapshotStake(savedStake) {
const candidate=guidedCandidateByKey(savedStake.candidateKey);
if (!candidate) return null;
const sample=state.samples[candidate.i];
const slot=Math.max(1,Math.floor(Number(savedStake.slot)||1));
const pending=savedStake.candidateKey===state.pendingCandidateKey;
const stake={
id:slot,slot,color:STAKE_COLORS[(slot-1)%STAKE_COLORS.length],
idx:candidate.i,x:sample.x,y:sample.y,z:sample.z,
candidateKey:candidate.key,
claimType:savedStake.claimType||null,
mark:savedStake.mark||null,
verdict:pending?'pending':'confirmed',
alignmentDeg:alignmentAngleDegrees(sample),
alignmentResidualDeg:alignmentResidualDegrees(sample)
};
if (!pending) candidate.claimedBy=stake.id;
return stake;
}

function restoreGuidedSnapshot(level,snapshot) {
const validation=validateGuidedSnapshot(level,snapshot);
if (!validation.valid) return validation;
state.pos=mod(Math.round(Number(snapshot.pos)||0),state.samples.length);
state.lastDir=Number(snapshot.lastDir)<0?-1:1;
state.phase=snapshot.phase==='rank'?'rank':'locate';
state.pendingCandidateKey=snapshot.pendingCandidateKey||null;
state.selectedMark=['high','low'].includes(snapshot.selectedMark)?snapshot.selectedMark:null;
state.evaluatedMarkPairs=Array.isArray(snapshot.evaluatedMarkPairs)?snapshot.evaluatedMarkPairs.filter(value=>typeof value==='string'):[];
state.marksCorrect=!!snapshot.marksCorrect;
state.missCount=Math.max(0,Math.floor(Number(snapshot.missCount)||0));
state.typeMissCount=Math.max(0,Math.floor(Number(snapshot.typeMissCount)||0));
state.reportCount=Math.max(0,Math.floor(Number(snapshot.reportCount)||0));
state.hintStage=Math.max(0,Math.floor(Number(snapshot.hintStage)||0));
state.hintUsed=!!snapshot.hintUsed;
state.hintShadeCandidate=state.candidates.findIndex(candidate=>candidate.key===snapshot.hintShadeCandidateKey);
if (state.hintShadeCandidate<0) state.hintShadeCandidate=null;
state.visited=decodeVisitedBits(snapshot.visitedBits,state.samples.length);
for (const candidate of state.candidates) candidate.claimedBy=null;
state.stakes=snapshot.stakes.map(rebuildSnapshotStake).filter(Boolean);
state.nextStakeId=Math.max(1,...state.stakes.map(stake=>stake.id+1));
state.restoredState=true;
state.restoreInvalidLevelId=null;
markVisited();
updateHud();
if (state.ledgerOpen) renderGlobalLedger();
return {valid:true,reason:null,snapshot};
}

function writeGuidedSnapshot() {
guidedSnapshotSaveTimer=null;
if(state.done||!state.level||(!state.started&&!state.progress.guidedRuns?.[state.level.id]))return false;
const snapshot=createGuidedSnapshot();
if (!snapshot) return false;
state.progress.guidedRuns[snapshot.levelId]=snapshot;
return saveProgress();
}

function flushGuidedSnapshot() {
if (guidedSnapshotSaveTimer!==null) {
clearTimeout(guidedSnapshotSaveTimer);
guidedSnapshotSaveTimer=null;
}
return writeGuidedSnapshot();
}

function saveGuidedSnapshot(options={}) {
if (state.runType!=='story'||!state.level||state.done||!GUIDED_LEVEL_IDS.includes(state.level.id)) return false;
const immediate=!!options.immediate;
if (options.movement) {
const now=performance.now();
const position=mod(Math.round(Number(state.pos)||0),Math.max(1,state.samples.length));
const sameLevel=lastMovementSnapshotLevelId===state.level.id;
const moved=!sameLevel||lastMovementSnapshotPos===null||distIndex(position,lastMovementSnapshotPos,state.samples.length)>=8;
const firstMovement=lastMovementSnapshotPos===null;
if (!moved||sameLevel&&!firstMovement&&now-lastMovementSnapshotAt<750) return false;
lastMovementSnapshotAt=now;
lastMovementSnapshotPos=position;
lastMovementSnapshotLevelId=state.level.id;
}
if (immediate) return flushGuidedSnapshot();
if (guidedSnapshotSaveTimer!==null) clearTimeout(guidedSnapshotSaveTimer);
guidedSnapshotSaveTimer=setTimeout(writeGuidedSnapshot,180);
return true;
}

function guidedSnapshotThrottleState() {
return {
lastAt:lastMovementSnapshotAt,
lastPos:lastMovementSnapshotPos,
levelId:lastMovementSnapshotLevelId,
writerPending:guidedSnapshotSaveTimer!==null

function continueGuidedTrail(levelId,{notify=true}={}) {
const level=guidedLevelById(levelId);
const snapshot=state.progress.guidedRuns[levelId];

if(guidedSnapshotSaveTimer!==null){clearTimeout(guidedSnapshotSaveTimer);guidedSnapshotSaveTimer=null;}
lastMovementSnapshotAt=0;lastMovementSnapshotPos=null;lastMovementSnapshotLevelId=levelId;
const levelIndex=storyLevels.indexOf(level);
initializeLevel(level,{runType:'story',levelIndex,levelKey:`story-${level.id}`});

function gaussianTerm(x, y, cx, cy, amp, s) {
const dx = x - cx, dy = y - cy;
const e = Math.exp(-(dx*dx + dy*dy) / (s*s));
const z = amp * e;
return { z, gx: z * (-2 * dx / (s*s)), gy: z * (-2 * dy / (s*s)) };
}

function makeLonePeak({cx, cy, amp, s, tx=0, ty=0, base=0}) {
return {
formula: String.raw`f(x,y)=h e^{-((x-a)^2+(y-b)^2)/s^2}+\text{small tilt}`,
f(x, y) { const g = gaussianTerm(x, y, cx, cy, amp, s); return base + g.z + tx*x + ty*y; },
grad(x, y) { const g = gaussianTerm(x, y, cx, cy, amp, s); return {x:g.gx+tx, y:g.gy+ty}; }
};
}

function makeTwinSisters() {
return {
formula: String.raw`f(x,y)=A_1 e^{-r_1^2/s_1^2}+A_2 e^{-r_2^2/s_2^2}+\text{tilt}`,
f(x, y) {
const a = gaussianTerm(x, y, -1.15, 0.55, 92, 0.88);
const b = gaussianTerm(x, y, 1.05, -0.42, 76, 0.82);
const c = gaussianTerm(x, y, 0.05, 0.05, -19, 1.25);
return a.z + b.z + c.z + 2.8*x - 1.2*y + 12;
},
grad(x, y) {
const a = gaussianTerm(x, y, -1.15, 0.55, 92, 0.88);
const b = gaussianTerm(x, y, 1.05, -0.42, 76, 0.82);
const c = gaussianTerm(x, y, 0.05, 0.05, -19, 1.25);
return {x:a.gx+b.gx+c.gx+2.8, y:a.gy+b.gy+c.gy-1.2};
}
};
}

function makeCraterLake() {
return {
formula: String.raw`f(x,y)=A e^{-(r-r_0)^2/s^2}-D e^{-r^2/c^2}+\text{tilt}`,
f(x, y) {
const dx = x + 0.1, dy = y - 0.05;
const r = Math.hypot(dx, dy) + 1e-9;
const ring = 72 * Math.exp(-((r - 1.35) ** 2) / (0.60 ** 2));
const bowl = -28 * Math.exp(-(r*r) / (0.72 ** 2));
return ring + bowl + 2.4*x + 0.8*y + 18;
},
grad(x, y) {
const dx = x + 0.1, dy = y - 0.05;
const r = Math.hypot(dx, dy) + 1e-9;
const ring = 72 * Math.exp(-((r - 1.35) ** 2) / (0.60 ** 2));
const bowl = -28 * Math.exp(-(r*r) / (0.72 ** 2));
const dr = ring * (-2*(r-1.35)/(0.60**2)) + bowl * (-2*r/(0.72**2));
return {x: dr * dx / r + 2.4, y: dr * dy / r + 0.8};
}
};
}

function makeGaussianField({terms, tx=0, ty=0, base=0, formula=String.raw`f(x,y)=\sum_i A_i e^{-r_i^2/s_i^2}+\text{tilt}`}) {
return {
formula,
f(x, y) {
let z = base + tx*x + ty*y;
for (const term of terms) z += gaussianTerm(x, y, term.cx, term.cy, term.amp, term.s).z;
return z;
},
grad(x, y) {
let gx = tx, gy = ty;
for (const term of terms) {
const g = gaussianTerm(x, y, term.cx, term.cy, term.amp, term.s);
gx += g.gx; gy += g.gy;
}
return {x:gx, y:gy};
}
};
}

function makePatrolRidge(params={}) {
const theta = params.theta ?? -0.67, c = Math.cos(theta), s = Math.sin(theta);
const ax = params.ax ?? 1.85, by = params.by ?? 0.42, amp = params.amp ?? 84;
const cx = params.cx ?? .25, cy = params.cy ?? -.1, tx = params.tx ?? 3.4, ty = params.ty ?? -2.2, base = params.base ?? 10;

function makePatrolBasin(params={}) {

const ax=params.ax ?? 1.15, by=params.by ?? .52, cx=params.cx ?? -.2, cy=params.cy ?? .1;
const ripple=params.ripple ?? 8, tx=params.tx ?? 0, ty=params.ty ?? 3.5, base=params.base ?? 28;

grad(x,y) { const dx=x-cx,dy=y-cy,X=c*dx+s*dy,Y=-s*dx+c*dy; const basin=amp*Math.exp(-(X*X/ax+Y*Y/by)); const dX=basin*(-2*X/ax),dY=basin*(-2*Y/by); return {x:dX*c+dY*(-s)+ripple*1.2*Math.cos(1.2*x)*Math.cos(.8*y)+tx, y:dX*s+dY*c-ripple*.8*Math.sin(1.2*x)*Math.sin(.8*y)+ty}; }

function rotatePoint(X, Y, theta) {
const c = Math.cos(theta), s = Math.sin(theta);
return {x:c*X - s*Y, y:s*X + c*Y};
}

function ellipseTrail({cx, cy, a, b, theta=0, start=0, dir=1}) {
const c = Math.cos(theta), s = Math.sin(theta);
return {
closed: true,
label: String.raw`g(x,y)=X^2/a^2+Y^2/b^2-1=0`,
point(u) { const t = start + dir*TAU*u; const p = rotatePoint(a*Math.cos(t), b*Math.sin(t), theta); return {x:cx+p.x, y:cy+p.y}; },
tangent(u) { const t = start + dir*TAU*u; return rotatePoint(-dir*a*Math.sin(t), dir*b*Math.cos(t), theta); },
gradG(x, y) {
const dx = x-cx, dy = y-cy;
const X = c*dx + s*dy, Y = -s*dx + c*dy;
const gx = 2*X/(a*a), gy = 2*Y/(b*b);
return {x:gx*c + gy*(-s), y:gx*s + gy*c};
}
};
}

function resizeCanvas(canvas) {
const dpr = Math.min(window.devicePixelRatio || 1, DPR_MAX);
const rect = canvas.getBoundingClientRect();
const w = Math.max(1, Math.round(rect.width * dpr));
const h = Math.max(1, Math.round(rect.height * dpr));
if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
const ctx = canvas.getContext('2d');
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
return {ctx, w:rect.width, h:rect.height, dpr};
}

function buildSamples(level) {
const N = 1600;
const samples = [];
let zMin = Infinity, zMax = -Infinity, maxAbsSlope = 0, maxGrad = 0;
for (let i = 0; i < N; i++) {
const u = i / N;
const p = level.trail.point(u);
const t = normalize(level.trail.tangent(u));
const gF = level.terrain.grad(p.x, p.y);
const gG = level.trail.gradG(p.x, p.y, u);
const z = level.terrain.f(p.x, p.y);
const slopeForward = dot(gF, t);
const lambda = dot(gF, gG) / Math.max(1e-10, dot(gG, gG));
const alignDenom = Math.max(1e-10, norm(gF) * norm(gG));
const align = Math.abs(cross(gF, gG)) / alignDenom;
zMin = Math.min(zMin, z); zMax = Math.max(zMax, z);
maxAbsSlope = Math.max(maxAbsSlope, Math.abs(slopeForward));
maxGrad = Math.max(maxGrad, norm(gF));
samples.push({u, x:p.x, y:p.y, z, t, gF, gG, slopeForward, lambda, align, dist:0});
}
let totalDist = 0;
for (let i = 1; i < N; i++) {
totalDist += Math.hypot(samples[i].x - samples[i-1].x, samples[i].y - samples[i-1].y);
samples[i].dist = totalDist;
}
totalDist += Math.hypot(samples[0].x - samples[N-1].x, samples[0].y - samples[N-1].y);
samples.totalDist = totalDist;

let maxIdx = 0, minIdx = 0, minGradIdx = 0;
for (let i = 1; i < N; i++) {
if (samples[i].z > samples[maxIdx].z) maxIdx = i;
if (samples[i].z < samples[minIdx].z) minIdx = i;
if (norm(samples[i].gF) < norm(samples[minGradIdx].gF)) minGradIdx = i;
}

const roots = [];
const addRoot = idx => {
const window = [];
for (let k = -4; k <= 4; k++) window.push(mod(idx + k, N));
const best = window.reduce((a,b) => Math.abs(samples[a].slopeForward) <= Math.abs(samples[b].slopeForward) ? a : b);
roots.push(best);
};
for (let i = 0; i < N; i++) {
const a = samples[i].slopeForward, b = samples[mod(i+1,N)].slopeForward;
if (a === 0 || (a < 0 && b > 0) || (a > 0 && b < 0)) addRoot(i);
}
if (Number.isFinite(level.candidateFlatTolerance)) {
const tol = level.candidateFlatTolerance;
for (let i = 0; i < N; i++) {
const a = Math.abs(samples[mod(i-1,N)].slopeForward), b = Math.abs(samples[i].slopeForward), c = Math.abs(samples[mod(i+1,N)].slopeForward);
if (b <= a && b <= c && b <= tol) roots.push(i);
}
}
roots.sort((a,b) => a-b);
const minGap = Math.round(N * .012);
const clustered = [];
for (const idx of roots) {
const near = clustered.findIndex(c => distIndex(c, idx, N) <= minGap);
if (near < 0) clustered.push(idx);
else if (Math.abs(samples[idx].slopeForward) < Math.abs(samples[clustered[near]].slopeForward)) clustered[near] = idx;
}
clustered.sort((a,b) => a-b);
if (clustered.length > 1 && distIndex(clustered[0], clustered[clustered.length-1], N) <= minGap) {
const a = clustered[0], b = clustered.pop();
clustered[0] = Math.abs(samples[a].slopeForward) <= Math.abs(samples[b].slopeForward) ? a : b;
}
const candidates = clustered.map((i, id) => {
const span = 8;
const z = samples[i].z, zl = samples[mod(i-span,N)].z, zr = samples[mod(i+span,N)].z;
const kind = z >= zl && z >= zr ? 'high' : z <= zl && z <= zr ? 'low' : 'stationary';
const u=samples[i].u;
return {
id,i,u,z,kind,
key:`${kind}:${u.toFixed(5)}`,
claimedBy:null,
globalHigh:distIndex(i,maxIdx,N) <= Math.round(N*.014),
globalLow:distIndex(i,minIdx,N) <= Math.round(N*.014)
};
});
const candidateSignature=candidates.map(candidate=>candidate.key).sort().join('|');
level.candidateSignature=candidateSignature;
return {samples, zMin, zMax, maxIdx, minIdx, minGradIdx, candidates, candidateSignature, totalDist, maxAbsSlope, maxGrad};
}

function buildContourLod(values,N,d,zMin,zMax,interval,baseInterval) {
const contours=[];
const k0=Math.ceil(zMin/interval)-1;
const k1=Math.floor(zMax/interval)+1;
const majorInterval=baseInterval*5;
for(let k=k0;k<=k1;k++){
const z=k*interval;
const segments=marchingSegments(values,N,d,z);
if(!segments.length)continue;
const nearestMajor=Math.round(z/majorInterval)*majorInterval;
const major=Math.abs(z-nearestMajor)<=Math.max(1e-7,interval*1e-5);
const rgb=viridisRgb((z-zMin)/Math.max(1e-9,zMax-zMin));
contours.push({z,k,major,color:`rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`,labelColor:`rgb(${darkenRgb(rgb,.28).join(', ')})`,segments,labels:chooseContourLabels(segments,d)});
}
return {interval,contours};
}

function buildMapAssets(level, zMin, zMax) {
const N=MAP_GRID_N;
const d=level.domain;
const values=new Float32Array(N*N);
let min=Infinity,max=-Infinity;
for(let j=0;j<N;j++){
const y=lerp(d.ymax,d.ymin,j/(N-1));
for(let i=0;i<N;i++){
const x=lerp(d.xmin,d.xmax,i/(N-1));
const z=level.terrain.f(x,y);
values[j*N+i]=z;
min=Math.min(min,z);max=Math.max(max,z);
}
}
const interval=Math.max(1,(zMax-zMin)/22);
const base=buildContourLod(values,N,d,zMin,zMax,interval,interval);
const terrainCanvas=buildTerrainRaster(level,values,N,min,max);
const baseKey=interval.toFixed(8);
return {
N,values,min,max,zMin,zMax,interval,contours:base.contours,terrainCanvas,
contourLods:{[baseKey]:base},dynamicContourKey:'',dynamicContourTarget:null,dynamicSegments:[]
};
}

function contourZoomDivisor(zoom) {
if(zoom<1.6)return 1;
if(zoom<3)return 2;
return 4;
}

function contourDensitySetting() {
return CONTOUR_DENSITIES.find(item=>item.key===state.contourDensity)||CONTOUR_DENSITIES[1];
}

function ensureContourLod(intervalOrKey) {
const assets=state.mapAssets;
if(!assets)return null;
let interval;
if(typeof intervalOrKey==='string'){
const divisor=intervalOrKey==='base'?1:intervalOrKey==='half'?2:intervalOrKey==='quarter'?4:Number(intervalOrKey);
interval=assets.interval/Math.max(.5,Number.isFinite(divisor)?divisor:1);
}else interval=Number(intervalOrKey);
interval=clamp(Number.isFinite(interval)?interval:assets.interval,assets.interval/6,assets.interval*2);
const key=interval.toFixed(8);
if(assets.contourLods[key])return assets.contourLods[key];
assets.contourLods[key]=buildContourLod(assets.values,assets.N,state.level.domain,assets.zMin,assets.zMax,interval,assets.interval);
return assets.contourLods[key];
}

function contourLodForRect(rect) {
const inset=!!rect?.inset;
const zoom=inset?1:(state.mapView?.zoom||1);
const densityMultiplier=inset?1:contourDensitySetting().multiplier;
const effectiveInterval=Math.max(state.mapAssets.interval/6,state.mapAssets.interval*densityMultiplier/contourZoomDivisor(zoom));
return ensureContourLod(effectiveInterval);
}

function marchingSegments(values, N, d, target) {
const segments = [];
function xy(i, j) {
return {x: lerp(d.xmin, d.xmax, i / (N - 1)), y: lerp(d.ymax, d.ymin, j / (N - 1))};
}
function interp(p, q, vp, vq) {
const t = Math.abs(vq - vp) < 1e-9 ? 0.5 : clamp((target - vp) / (vq - vp), 0, 1);
return {x: lerp(p.x, q.x, t), y: lerp(p.y, q.y, t)};
}
for (let j = 0; j < N - 1; j++) {
for (let i = 0; i < N - 1; i++) {
const v0 = values[j*N+i], v1 = values[j*N+i+1], v2 = values[(j+1)*N+i+1], v3 = values[(j+1)*N+i];
const mn = Math.min(v0, v1, v2, v3), mx = Math.max(v0, v1, v2, v3);
if (target < mn || target > mx || mx - mn < 1e-9) continue;
const p0 = xy(i,j), p1 = xy(i+1,j), p2 = xy(i+1,j+1), p3 = xy(i,j+1);
const pts = [];
if ((v0 <= target && v1 >= target) || (v1 <= target && v0 >= target)) pts.push(interp(p0,p1,v0,v1));
if ((v1 <= target && v2 >= target) || (v2 <= target && v1 >= target)) pts.push(interp(p1,p2,v1,v2));
if ((v2 <= target && v3 >= target) || (v3 <= target && v2 >= target)) pts.push(interp(p2,p3,v2,v3));
if ((v3 <= target && v0 >= target) || (v0 <= target && v3 >= target)) pts.push(interp(p3,p0,v3,v0));
if (pts.length === 2) segments.push([pts[0], pts[1]]);
else if (pts.length === 4) { segments.push([pts[0], pts[1]]); segments.push([pts[2], pts[3]]); }
}
}
return segments;
}

function chooseContourLabels(segments, d) {
const candidates = segments
.map(seg => {
const mx = (seg[0].x + seg[1].x) / 2, my = (seg[0].y + seg[1].y) / 2;
return {seg, mx, my, ang:Math.atan2(seg[1].y - seg[0].y, seg[1].x - seg[0].x)};
})
.filter(o => o.mx > d.xmin + .28 && o.mx < d.xmax - .28 && o.my > d.ymin + .28 && o.my < d.ymax - .28)
.sort((a,b) => (a.mx - b.mx) || (a.my - b.my));
const chosen = [];
const minSep = Math.max(.62, (d.xmax - d.xmin) / 8.5);
for (const c of candidates) {
if (chosen.every(p => Math.hypot(c.mx - p.mx, c.my - p.my) > minSep)) chosen.push(c);
if (chosen.length >= 18) break;
}
return chosen.map(o => o.seg);
}

function buildTerrainRaster(level, values, N, min, max) {
const canvas = document.createElement('canvas');
canvas.width = canvas.height = N;
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(N, N);
for (let j = 0; j < N; j++) {
for (let i = 0; i < N; i++) {
const idx = j*N+i;
const z = values[idx];
const x = lerp(level.domain.xmin, level.domain.xmax, i/(N-1));
const y = lerp(level.domain.ymax, level.domain.ymin, j/(N-1));
const gr = level.terrain.grad(x, y);
const gm = Math.hypot(gr.x, gr.y);
const base = biomeColor(level, (z - min) / Math.max(1e-9, max - min), gm, .62, x, y);
const nx = -gr.x / Math.max(1, gm), ny = -gr.y / Math.max(1, gm), nz = .82;
const shade = clamp(.86 + .23 * (nx * -.42 + ny * -.61 + nz * .76), .58, 1.18);
const p = idx*4;
img.data[p] = clamp(base[0]*shade, 0, 255);
img.data[p+1] = clamp(base[1]*shade, 0, 255);
img.data[p+2] = clamp(base[2]*shade, 0, 255);
img.data[p+3] = 255;
}
}
ctx.putImageData(img, 0, 0);
return canvas;
}

function biomeColor(level, t, slope=0, sunDot=1, x=0, y=0) {
t = clamp(t, 0, 1);
sunDot = clamp(sunDot, -1, 1);
const biome = level.biome;
const shadow = clamp((.42 - sunDot) / .78, 0, 1);
let c;
if (biome === 'badlands') {
const bands = [[221,181,132],[117,82,83],[235,211,169],[153,92,74],[205,151,116],[129,105,126],[238,218,181],[179,111,76]];
const widths = [.16,.03,.14,.04,.18,.03,.20,.22];
const jitter = (hash2(x * 2.0 + t * 7.1, y * 2.6, level.seed) - .5) * .030;
const q = clamp(t + jitter, 0, .999);
let acc = 0, idx = bands.length - 1;
for (let k = 0; k < widths.length; k++) { acc += widths[k]; if (q < acc) { idx = k; break; } }
c = bands[idx];
c = mixColor(c, [122,98,122], shadow * .38);
} else if (biome === 'cinder') {
if (t < .30) c = mixColor([35,43,45], [64,68,66], t/.30);
else if (t < .68) c = mixColor([64,68,66], [104,61,45], (t-.30)/.38);
else c = mixColor([104,61,45], [177,116,79], (t-.68)/.32);
const oxide = smoothstep(.42, .92, t) * (.25 + .30 * hash2(Math.atan2(y, x) * 3.1, t * 4.7, level.seed));
c = mixColor(c, [128,65,48], oxide * .32);
} else if (biome === 'snowline') {
const edge = .55 + (hash2(x * 1.8 + y * .33, y * 1.55, level.seed) - .5) * .09;
if (t < edge) {
c = mixColor([136,144,150], [214,216,214], clamp(t / Math.max(.01, edge), 0, 1));
c = mixColor(c, [106,122,140], shadow * .18);
} else {
const u = smoothstep(edge, edge + .08, t);
c = mixColor([214,222,232], [248,250,253], u);
const wind = (hash2(x * 9.0 + y * 2.0, y * .50, level.seed) - .5) * 8 * u; // ±4 brightness wind-scour bands
c = c.map(v => clamp(v + wind, 0, 255));
c = mixColor(c, [218,230,248], shadow * (.25 + .55 * u));
}
} else if (biome === 'mojave' || biome === 'desert') {
if (t < .38) c = mixColor([177,125,77], [218,159,94], t/.38);
else if (t < .72) c = mixColor([218,159,94], [231,196,138], (t-.38)/.34);
else c = mixColor([231,196,138], [246,228,188], (t-.72)/.28);
const washCenter = .34 * Math.sin(x * 1.10 + level.seed * .002) - .11 * Math.cos(x * .45 + 1.7);
const washJitter = (hash2(x * 3.0, y * 2.0, level.seed) - .5) * .055;
const wash = (t < .42) ? (1 - smoothstep(.045, .145, Math.abs(y - washCenter + washJitter))) : 0;
c = mixColor(c, [234,214,178], clamp(wash,0,1) * .72);
} else if (biome === 'tundra') {
if (t < .34) c = mixColor([103,143,88], [163,177,107], t/.34);
else if (t < .70) c = mixColor([163,177,107], [171,166,132], (t-.34)/.36);
else c = mixColor([171,166,132], [238,241,238], smoothstep(.70, 1, t));
} else if (biome === 'volcanic') {
if (t < .26) c = mixColor([65,127,151], [74,152,160], t/.26);
else if (t < .56) c = mixColor([89,128,94], [143,116,88], (t-.26)/.30);
else c = mixColor([143,116,88], [225,207,174], (t-.56)/.44);
} else if (biome === 'alpine') {
if (t < .30) c = mixColor([75,132,92], [128,165,106], t/.30);
else if (t < .62) c = mixColor([128,165,106], [178,164,117], (t-.30)/.32);
else if (t < .84) c = mixColor([178,164,117], [160,157,150], (t-.62)/.22);
else c = mixColor([160,157,150], [240,238,224], (t-.84)/.16);
} else if (biome === 'forest') {
if (t < .32) c = mixColor([55,105,67], [84,135,76], t/.32);
else if (t < .68) c = mixColor([84,135,76], [157,156,92], (t-.32)/.36);
else c = mixColor([157,156,92], [218,205,168], (t-.68)/.32);
} else {
if (t < .28) c = mixColor([74,132,77], [126,172,90], t/.28);
else if (t < .62) c = mixColor([126,172,90], [196,177,106], (t-.28)/.34);
else if (t < .86) c = mixColor([196,177,106], [190,166,134], (t-.62)/.24);
else c = mixColor([190,166,134], [242,239,220], (t-.86)/.14);
}
const rock = biome === 'badlands' ? [124,102,101] : biome === 'cinder' ? [58,55,54] : biome === 'snowline' ? [82,88,96] : [130,130,124];
const rockMix = clamp(slope / 72, 0, biome === 'snowline' ? .30 : .55);
return mixColor(c, rock, rockMix);
}

function decorationScale(kind, rng) {
if (kind === 'conifer') return lerp(1.15, 2.35, rng());
if (kind === 'deciduous') return lerp(.90, 1.65, rng());
if (kind === 'aspen') return lerp(.80, 1.45, rng());
if (kind === 'snag') return lerp(.90, 1.85, rng());
if (kind === 'darkrock') return lerp(.95, 1.65, rng());
if (kind === 'saguaro') return lerp(.85, 1.55, rng());
if (kind === 'rock') return lerp(.55, 1.25, rng());
if (kind === 'scree') return lerp(.24, .68, rng());
if (kind === 'flower') return lerp(.24, .48, rng());
if (kind === 'grass') return lerp(.34, .82, rng());
if (kind === 'shrub') return lerp(.48, 1.05, rng());
if (kind === 'snow') return lerp(.60, 1.35, rng());
if (kind === 'juniper') return lerp(.65, 1.05, rng());
if (kind === 'hoodoo') return lerp(.75, 1.25, rng());
if (kind === 'steam') return lerp(.65, 1.15, rng());
if (kind === 'cairn') return lerp(.55, .95, rng());
if (kind === 'joshua') return lerp(.70, 1.20, rng());
if (kind === 'ocotillo') return lerp(.55, 1.05, rng());
if (kind === 'cholla') return lerp(.35, .80, rng());
return lerp(.50, 1.24, rng());
}

function chooseDecorationKind(level, t, slope, rng) {
const steep = slope > 58;
const biome = level.biome;
if (biome === 'tundra') {
if (t > .82) return rng() < .45 ? 'snow' : (rng() < .70 ? 'rock' : 'shrub');
if (steep && rng() < .45) return 'scree';
return rng() < .42 ? 'grass' : (rng() < .72 ? 'flower' : (rng() < .88 ? 'shrub' : 'rock'));
}
if (biome === 'badlands') {
if (steep && rng() < .55) return 'scree';
const r = rng();
if (r < .10) return 'juniper';
if (r < .18) return 'hoodoo';
return r < .64 ? 'rock' : 'scree';
}
if (biome === 'cinder') {
const r = rng();
if (r < .035 && t > .42) return 'steam';
if (r < .12 && t > .48) return 'snag';
return steep || t > .56 ? (rng() < .78 ? 'scree' : 'rock') : (rng() < .70 ? 'rock' : 'scree');
}
if (biome === 'snowline') {
if (t > .55) return rng() < .66 ? 'snow' : (rng() < .80 ? 'cairn' : 'rock');
return steep ? 'scree' : (rng() < .62 ? 'rock' : 'cairn');
}
if (biome === 'mojave') {
if (steep && rng() < .58) return 'scree';
const r = rng();
if (t < .58 && r < .17) return 'joshua';
if (r < .30) return 'ocotillo';
if (r < .44) return 'cholla';
return r < .72 ? 'rock' : 'shrub';
}
if (biome === 'desert') {
if (steep && rng() < .58) return 'scree';
return rng() < .42 ? 'rock' : (rng() < .63 ? 'shrub' : 'saguaro');
}
if (biome === 'volcanic') {
if (steep || t > .66) return rng() < .70 ? 'scree' : 'snag';
return rng() < .62 ? 'rock' : 'shrub';
}
if (biome === 'forest') {
if (t > .78) return rng() < .45 ? 'snag' : 'rock';
if (steep && rng() < .42) return 'scree';
if (t > .55) return rng() < .58 ? 'conifer' : (rng() < .65 ? 'snag' : 'rock');
return rng() < .50 ? 'conifer' : (rng() < .58 ? 'deciduous' : 'aspen');
}
if (biome === 'alpine') {
if (t > .82) return rng() < .58 ? 'snow' : 'scree';
if (t > .62) return rng() < .45 ? 'scree' : 'snag';
return rng() < .35 ? 'conifer' : (rng() < .62 ? 'aspen' : 'grass');
}
// meadow fallback
if (t > .82) return rng() < .38 ? 'snow' : 'rock';
if (t > .58) return rng() < .30 ? 'conifer' : (rng() < .62 ? 'aspen' : 'grass');
return rng() < .34 ? 'grass' : (rng() < .62 ? 'flower' : (rng() < .76 ? 'deciduous' : 'aspen'));
}

function decorationHeightWorld(kind, scale) {
if (['grass','flower','scree','snow','cholla','cairn'].includes(kind)) return .5 * scale;
if (['rock','darkrock','shrub'].includes(kind)) return .7 * scale;
if (['juniper','snag','saguaro','ocotillo','joshua'].includes(kind)) return 1.45 * scale;
if (kind === 'hoodoo') return 2.25 * scale;
if (['conifer','deciduous','aspen'].includes(kind)) return 3.0 * scale;
if (kind === 'steam') return 1.8 * scale;
return 1.0 * scale;
}

function decorationBudgetFor(level) {
if (level.biome === 'badlands') return {juniper:20, hoodoo:14};
if (level.biome === 'cinder') return {snag:10, steam:4};
if (level.biome === 'mojave') return {joshua:35, ocotillo:26};
if (level.biome === 'tundra') return {shrub:90};
return {};
}

function createDecorations(level, count=720) {
const rng = seededRand(level.seed || 7);
const items = [];
const d = level.domain;
const budgets = decorationBudgetFor(level);
const counts = Object.fromEntries(Object.keys(budgets).map(k => [k, 0]));
const sparseCount = level.biome === 'snowline' ? Math.min(count, 420)
: level.biome === 'badlands' ? Math.min(count, 540)
: level.biome === 'cinder' ? Math.min(count, 470)
: level.biome === 'tundra' ? Math.min(count, 760)
: level.biome === 'mojave' ? Math.min(count, 620)
: count;
let attempts = 0;
while (items.length < sparseCount && attempts++ < sparseCount * 14) {
const x = lerp(d.xmin, d.xmax, rng());
const y = lerp(d.ymin, d.ymax, rng());
let trailDist = Infinity;
for (let k = 0; k < state.samples.length; k += 16) {
const s = state.samples[k];
const dd = Math.hypot(s.x - x, s.y - y);
if (dd < trailDist) trailDist = dd;
}
if (trailDist < .12) continue;
const z = level.terrain.f(x, y);
const g = level.terrain.grad(x, y);
const t = (z - state.zMin) / Math.max(1e-9, state.zMax - state.zMin);
const slope = Math.hypot(g.x, g.y);
let kind = chooseDecorationKind(level, t, slope, rng);
let scale = decorationScale(kind, rng);
let h = decorationHeightWorld(kind, scale);
if (trailDist < .55 && h > .50) {
kind = (level.biome === 'badlands' || level.biome === 'cinder' || level.biome === 'snowline') ? 'scree' : (rng() < .5 ? 'grass' : 'flower');
scale = decorationScale(kind, rng);
h = decorationHeightWorld(kind, scale);
}
if (trailDist < .90 && h > 1.10) {
kind = (level.biome === 'mojave') ? (rng() < .5 ? 'cholla' : 'rock') : (rng() < .65 ? 'rock' : 'shrub');
scale = decorationScale(kind, rng);
h = decorationHeightWorld(kind, scale);
}
if (budgets[kind] !== undefined) {
if ((counts[kind] || 0) >= budgets[kind]) continue;
counts[kind] = (counts[kind] || 0) + 1;
}
items.push({x, y, z, kind, t, slope, scale, phase:rng()*TAU, colorSeed:rng(), trailDist});
}

if (level.biome === 'tundra') {
const clusters = 7;
for (let c = 0; c < clusters; c++) {
const s0 = state.samples[Math.floor(rng() * state.samples.length)];
const n0 = {x:-s0.t.y, y:s0.t.x};
const cx = s0.x + n0.x * lerp(.38, .80, rng()) * (rng() < .5 ? -1 : 1);
const cy = s0.y + n0.y * lerp(.38, .80, rng()) * (rng() < .5 ? -1 : 1);
for (let i = 0; i < 42; i++) {
const a = rng()*TAU, r = Math.sqrt(rng()) * .27;
const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
if (x < d.xmin || x > d.xmax || y < d.ymin || y > d.ymax) continue;
const z = level.terrain.f(x, y);
items.push({x, y, z, kind:'flower', t:.35, slope:0, scale:decorationScale('flower', rng), phase:rng()*TAU, colorSeed:rng()});
}
}
}

if (level.biome === 'tundra' || level.biome === 'snowline') {
let added = 0, tries = 0;
const target = level.biome === 'snowline' ? 12 : 7;
while (added < target && tries++ < 300) {
const x = lerp(d.xmin, d.xmax, rng()), y = lerp(d.ymin, d.ymax, rng());
const z = level.terrain.f(x, y);
const t = (z - state.zMin) / Math.max(1e-9, state.zMax - state.zMin);
if (t < (level.biome === 'snowline' ? .56 : .80)) continue;
items.push({x, y, z, kind:'snow', t, slope:0, scale:decorationScale('snow', rng), phase:rng()*TAU, colorSeed:rng()});
added++;
}
}
if (level.biome === 'snowline') {
for (let cluster = 0; cluster < 4; cluster++) {
const anchor = state.samples[Math.floor(rng() * state.samples.length)];
const n0 = {x:-anchor.t.y, y:anchor.t.x};
const cx = anchor.x + n0.x * lerp(.80, 1.35, rng()) * (rng() < .5 ? -1 : 1);
const cy = anchor.y + n0.y * lerp(.80, 1.35, rng()) * (rng() < .5 ? -1 : 1);
for (let k = 0; k < 7; k++) {
const a = rng()*TAU, r = Math.sqrt(rng()) * .28;
const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
if (x < d.xmin || x > d.xmax || y < d.ymin || y > d.ymax) continue;
const z = level.terrain.f(x, y);
const t = (z - state.zMin) / Math.max(1e-9, state.zMax - state.zMin);
if (t < .55) continue;
items.push({x, y, z, kind:rng()<.65?'rock':'scree', t, slope:75, scale:lerp(.75,1.55,rng()), phase:rng()*TAU, colorSeed:rng(), trailDist:1.1});
}
}
}


if (level.biome === 'snowline') {
let clusters = 0, tries = 0;
while (clusters < 4 && tries++ < 500) {
const cx = lerp(d.xmin, d.xmax, rng()), cy = lerp(d.ymin, d.ymax, rng());
const cz = level.terrain.f(cx, cy);
const ct = (cz - state.zMin) / Math.max(1e-9, state.zMax - state.zMin);
if (ct < .58) continue;
for (let k = 0; k < 8; k++) {
const a = rng()*TAU, r = Math.sqrt(rng()) * .32;
const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
if (x < d.xmin || x > d.xmax || y < d.ymin || y > d.ymax) continue;
const z = level.terrain.f(x, y), g = level.terrain.grad(x, y);
const t = (z - state.zMin) / Math.max(1e-9, state.zMax - state.zMin);
items.push({x, y, z, kind:'darkrock', t, slope:Math.hypot(g.x,g.y), scale:decorationScale('darkrock', rng), phase:rng()*TAU, colorSeed:rng(), trailDist:99});
}
clusters++;
}
}
return items;
}

function assertMarmotDomeTerrain(level,built) {
if (!(CAM_DEBUG||TEST_MODE) || level.id!=='dome') return;
if (built.candidates.length!==4) throw new Error(`[marmot-check] expected 4 candidates, found ${built.candidates.length}`);
const relief=Math.max(1e-9,built.zMax-built.zMin);
const rows=built.candidates.map(candidate=>{
const localValues=[];
for(let i=0;i<built.samples.length;i++){
if(trailArcDistanceFrac(i,candidate.i,built.samples)<=2*STAKE_EPS_FRAC)localValues.push(built.samples[i].z);
}
const prominence=(Math.max(...localValues)-Math.min(...localValues))/relief;
const gradientRatio=norm(built.samples[candidate.i].gF)/Math.max(1e-9,built.maxGrad);
return {candidate,prominence,gradientRatio};
});
console.info(`[marmot-check] ${rows.map(row=>`${row.candidate.kind}: prominence ${(row.prominence*100).toFixed(2)}%, gradient ${(row.gradientRatio*100).toFixed(2)}%`).join(' · ')}`);
for(const row of rows){
if(row.prominence<.025)throw new Error(`[marmot-check] ${row.candidate.kind} prominence ${row.prominence} is below 0.025`);
if(row.gradientRatio<.08)throw new Error(`[marmot-check] ${row.candidate.kind} gradient ratio ${row.gradientRatio} is below 0.08`);
}
}

function farthestTrailPosition(samples,candidates,phase=0) {
const N=samples.length;
if(!N||!candidates.length)return Math.round(N*.08);
const firstIndex=mod(phase,N);
let bestIndex=firstIndex,bestDistance=-1;
for(let step=0;step<N;step++){
const index=mod(firstIndex+step,N);
const nearest=Math.min(...candidates.map(candidate=>trailArcDistanceFrac(index,candidate.i,samples)));
if(nearest>bestDistance+1e-9){bestDistance=nearest;bestIndex=index;}
}
return bestIndex;
}

function guidedStartPosition(samples,candidates,seed=0) {
return farthestTrailPosition(samples,candidates,mixSeed32((Number(seed)||0)^0x47554944));
}

function patrolStartPosition(samples,candidates,seed=0) {
return farthestTrailPosition(samples,candidates,mixSeed32((Number(seed)||0)^0x51f15e1d));
}

function guidedStartAudit() {
return storyLevels.map(level=>{
const built=buildSamples(level);
const start=guidedStartPosition(built.samples,built.candidates,level.seed);
const clearance=Math.min(...built.candidates.map(candidate=>trailArcDistanceFrac(start,candidate.i,built.samples)));
let globalBest=-1;
for(let i=0;i<built.samples.length;i++){
const nearest=Math.min(...built.candidates.map(candidate=>trailArcDistanceFrac(i,candidate.i,built.samples)));
globalBest=Math.max(globalBest,nearest);
}
return {level:level.id,startArc:Number((built.samples[start].dist/built.samples.totalDist).toFixed(5)),clearance:Number(clearance.toFixed(5)),globalBest:Number(globalBest.toFixed(5)),stakeRadius:STAKE_EPS_FRAC,pass:Math.abs(clearance-globalBest)<1e-9&&clearance>STAKE_EPS_FRAC};
});
}

function loadLevel(i) {
const idx = clamp(i, 0, storyLevels.length - 1);
initializeLevel(storyLevels[idx], {runType:'story', levelIndex:idx, levelKey:`story-${idx}`});
}

function currentSample() {
const N = state.samples.length;
const pos = mod(state.pos, N);
const i0 = Math.floor(pos), i1 = mod(i0 + 1, N);
const a = state.samples[i0], b = state.samples[i1];
const f = pos - i0;
const u = mod(a.u + f * (1/N), 1);
const p = state.level.trail.point(u);
const t = normalize(state.level.trail.tangent(u));
const gF = state.level.terrain.grad(p.x, p.y);
const gG = state.level.trail.gradG(p.x, p.y, u);
const z = state.level.terrain.f(p.x, p.y);
const slopeForward = dot(gF, t);
const lambda = dot(gF, gG) / Math.max(1e-10, dot(gG, gG));
const alignDenom = Math.max(1e-10, norm(gF) * norm(gG));
const align = Math.abs(cross(gF, gG)) / alignDenom;
let dist = lerp(a.dist, b.dist + (i1 === 0 ? state.samples.totalDist : 0), f);
if (dist >= state.samples.totalDist) dist -= state.samples.totalDist;
return {u, x:p.x, y:p.y, z, t, gF, gG, slopeForward, slope:slopeForward * (state.lastDir || 1), lambda, align, dist};
}

function markVisited() {
const N = state.samples.length;
const idx = mod(Math.round(mod(state.pos, N)), N);
const r = 14;let changed=false;
for (let k = -r; k <= r; k++){const index=mod(idx+k,N);if(!state.visited[index]){state.visited[index]=true;changed=true;}}
if(changed)state.visitedVersion++;
if (state.started) saveGuidedSnapshot({movement:true});
}

function plotRect(canvas, w, h) {
const inset = canvas.classList.contains('inset');
if (inset) {
const pad = 9;
const size = Math.max(1, Math.min(w - 2*pad, h - 2*pad));
return {x:(w-size)/2, y:(h-size)/2, w:size, h:size, inset:true};
}
const mobile = window.innerWidth <= 760;
const controlsBottom = el.controlsBox?.getBoundingClientRect?.().bottom || (mobile ? 136 : 136);
const top = Math.ceil(controlsBottom) + (mobile ? 8 : 10);
const bottom = 50;
// Reserve top space for the top bar plus the labeled trail-controls panel.
const canvasRect=canvas.getBoundingClientRect();
const narrowMapOverlay=window.innerWidth<=900;
const dockRect=!narrowMapOverlay&&!el.instrumentDock?.hidden?el.instrumentDock.getBoundingClientRect():null;
const dockOverlapsCanvas=dockRect&&dockRect.right>canvasRect.left&&dockRect.left<canvasRect.right&&dockRect.bottom>canvasRect.top&&dockRect.top<canvasRect.bottom;
const dockOnRight=dockOverlapsCanvas&&dockRect.left>=canvasRect.left+canvasRect.width/2;
const leftDockReserve=dockOverlapsCanvas&&!dockOnRight&&dockRect.bottom>top?Math.max(0,dockRect.right-canvasRect.left+10):0;
const rightDockReserve=dockOverlapsCanvas&&dockOnRight&&dockRect.bottom>top?Math.max(0,canvasRect.right-dockRect.left+10):0;
const narrowEdgeMargin=mobile?24:28;
const leftMargin = narrowMapOverlay?narrowEdgeMargin:Math.max(46,leftDockReserve);
const rightMargin = narrowMapOverlay?narrowEdgeMargin:Math.max(42,rightDockReserve);
const usableW = Math.max(150, w - leftMargin - rightMargin);
const usableH = Math.max(160, h - top - bottom);
const size = Math.max(1, Math.min(usableW, usableH));
return {x:leftMargin + Math.max(0, (usableW - size)/2), y:top + Math.max(0, (usableH - size)/2), w:size, h:size, inset:false};
}

function defaultMapView() {
const d=state.level?.domain||commonDomain;
return {zoom:1,cx:(d.xmin+d.xmax)/2,cy:(d.ymin+d.ymax)/2,follow:true,followAnchor:null,followPos:null};
}

function clampMapView(view=state.mapView) {
const d=state.level.domain;
view.zoom=clamp(Number(view.zoom)||1,1,4);
const halfX=(d.xmax-d.xmin)/(2*view.zoom);
const halfY=(d.ymax-d.ymin)/(2*view.zoom);
if(view.zoom<=1.000001){
view.cx=(d.xmin+d.xmax)/2;
view.cy=(d.ymin+d.ymax)/2;
}else{
view.cx=clamp(Number(view.cx)||(d.xmin+d.xmax)/2,d.xmin+halfX,d.xmax-halfX);
view.cy=clamp(Number(view.cy)||(d.ymin+d.ymax)/2,d.ymin+halfY,d.ymax-halfY);
}
return view;
}

function resetMapView() {
state.mapView=defaultMapView();
state.mapGesture=null;
state.mapPointers.clear();
updateMapResetButton();
}

function mapViewForRect(rect) {
if(rect?.inset)return defaultMapView();
const view=state.mapView||defaultMapView();
return view.allowOverflow?view:clampMapView(view);
}

function visibleMapBounds(rect) {
const d=state.level.domain,view=mapViewForRect(rect);
const spanX=(d.xmax-d.xmin)/view.zoom,spanY=(d.ymax-d.ymin)/view.zoom;
return {xmin:view.cx-spanX/2,xmax:view.cx+spanX/2,ymin:view.cy-spanY/2,ymax:view.cy+spanY/2,spanX,spanY};
}

function mapToScreen(x, y, rect) {
const bounds=visibleMapBounds(rect);
return {x:rect.x+(x-bounds.xmin)/bounds.spanX*rect.w,y:rect.y+(bounds.ymax-y)/bounds.spanY*rect.h};
}

function screenToMap(px, py, rect) {
const bounds=visibleMapBounds(rect);
return {x:bounds.xmin+(px-rect.x)/rect.w*bounds.spanX,y:bounds.ymax-(py-rect.y)/rect.h*bounds.spanY};
}

function followCurrentMapLocation(rect=null) {
const view=state.mapView;
if(!view||view.zoom<=1.05||view.follow===false||!mapMainViewVisible()||state.mapGesture?.type==='pan'||state.mapGesture?.type==='pinch')return false;
if(view.followPos===state.pos)return false;
const canvasRect=el.mapCanvas.getBoundingClientRect();
const plot=rect||plotRect(el.mapCanvas,canvasRect.width,canvasRect.height);
if(plot?.inset)return false;
const anchor=view.followAnchor||{qx:.5,qy:.5};
const d=state.level.domain,current=currentSample();
const spanX=(d.xmax-d.xmin)/view.zoom,spanY=(d.ymax-d.ymin)/view.zoom;
const previousCx=view.cx,previousCy=view.cy;
view.cx=current.x-(anchor.qx-.5)*spanX;
view.cy=current.y-(.5-anchor.qy)*spanY;
view.allowOverflow=true;
view.followPos=state.pos;
return Math.abs(view.cx-previousCx)>1e-9||Math.abs(view.cy-previousCy)>1e-9;
}

function captureMapFollowAnchor(rect) {
const view=state.mapView;
if(!view||rect?.inset)return false;
if(view.zoom<=1.05){
view.follow=true;view.followAnchor=null;view.followPos=state.pos;return false;
}
if(view.follow===false)return false;
const current=currentSample(),point=mapToScreen(current.x,current.y,rect);
const qx=(point.x-rect.x)/Math.max(1,rect.w),qy=(point.y-rect.y)/Math.max(1,rect.h);
const visible=qx>=0&&qx<=1&&qy>=0&&qy<=1;
view.followAnchor=visible?{qx,qy}:{qx:.5,qy:.5};
view.followPos=visible?state.pos:null;
if(!visible)followCurrentMapLocation(rect);
return true;
}

function setMapZoomAbout(px,py,rect,newZoom) {
if(rect?.inset)return;
const d=state.level.domain;
const before=screenToMap(px,py,rect);
const qx=(px-rect.x)/Math.max(1,rect.w),qy=(py-rect.y)/Math.max(1,rect.h);
const zoom=clamp(newZoom,1,4);
const spanX=(d.xmax-d.xmin)/zoom,spanY=(d.ymax-d.ymin)/zoom;
state.mapView.zoom=zoom;
state.mapView.allowOverflow=false;
state.mapView.cx=before.x-(qx-.5)*spanX;
state.mapView.cy=before.y-(.5-qy)*spanY;
clampMapView();
captureMapFollowAnchor(rect);
updateMapResetButton(rect,el.mapCanvas);
}

function panMapByPixels(dx,dy,rect) {
if(rect?.inset||state.mapView.zoom<=1)return;
const bounds=visibleMapBounds(rect);
state.mapView.allowOverflow=false;
state.mapView.follow=false;
state.mapView.followAnchor=null;
state.mapView.followPos=null;
state.mapView.cx-=dx/Math.max(1,rect.w)*bounds.spanX;
state.mapView.cy+=dy/Math.max(1,rect.h)*bounds.spanY;
clampMapView();
updateMapResetButton(rect,el.mapCanvas);
}

function mapMainViewVisible(canvas=el.mapCanvas) {
return !!canvas && !canvas.classList.contains('view-hidden') && !canvas.classList.contains('inset');
}

function mapZoomByButton(direction) {
if (!mapMainViewVisible() || !state.level) return false;
const canvasRect=el.mapCanvas.getBoundingClientRect();
const rect=plotRect(el.mapCanvas,canvasRect.width,canvasRect.height);
const current=currentSample();
const focus=mapToScreen(current.x,current.y,rect);
const factor=Math.exp(.25 * Math.sign(direction || 1));
setMapZoomAbout(focus.x,focus.y,rect,(state.mapView.zoom||1)*factor);
noteInput();
return true;
}

function drawMap(canvas) {
if (!state.level) return;
const {ctx, w, h} = resizeCanvas(canvas);
ctx.clearRect(0, 0, w, h);
const isInset = canvas.classList.contains('inset');
ctx.fillStyle = '#f7f3e6';
ctx.fillRect(0, 0, w, h);
const rect = plotRect(canvas, w, h);

ctx.save();
if (isInset) { roundedPath(ctx, rect.x, rect.y, rect.w, rect.h, 14); ctx.clip(); }
else {
// Subtle paper fiber over the full viewport.
ctx.globalAlpha = .09;
for (let i = 0; i < 90; i++) {
const x = (i * 97) % Math.max(1, w), y = (i * 163) % Math.max(1, h);
ctx.fillStyle = i % 2 ? '#fffaf0' : '#d8caa7';
ctx.fillRect(x, y, 1, Math.max(12, h * .025));
}
ctx.globalAlpha = 1;
}

const layers=currentMapLayers();
ctx.fillStyle = '#f7f3e6';
if (isInset) ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
else {
ctx.save(); ctx.fillStyle = 'rgba(247,243,230,.88)'; ctx.fillRect(rect.x, rect.y, rect.w, rect.h); ctx.restore();
}
const zoomClip=!isInset&&(state.mapView?.zoom||1)>1.001;
if(zoomClip){ctx.save();ctx.beginPath();ctx.rect(rect.x,rect.y,rect.w,rect.h);ctx.clip();}
if(layers.terrainFill)drawTerrainMap(ctx,rect);
drawGridAndAxes(ctx, rect, isInset);
if(layers.contours!=='none')drawVectorContours(ctx, rect, isInset);
drawHintShade(ctx, rect, isInset);
drawTrail(ctx, rect, isInset);
if (layers.currentFContour) drawCurrentFContour(ctx, rect, currentSample().z, isInset);
drawStakeAcceptance(ctx, rect, isInset);
drawMapAffordances(ctx, rect, isInset);
drawFlags(ctx, rect, isInset);
drawHikerAndArrows(ctx, rect, isInset);
if (!isInset&&layers.currentFValue) drawProbe(ctx, rect);
if(zoomClip)ctx.restore();
ctx.restore();

if (isInset) {
ctx.save();
roundedPath(ctx, rect.x, rect.y, rect.w, rect.h, 14);
ctx.strokeStyle = 'rgba(255,255,246,.88)'; ctx.lineWidth = 2; ctx.stroke();
ctx.fillStyle = 'rgba(255,255,246,.90)'; ctx.font = '900 11px ui-rounded, system-ui';
ctx.fillText('MAP', rect.x + 10, rect.y + 18);
ctx.restore();
} else {
drawMapMarginLegend(ctx, rect);
}
updateMapResetButton(rect,canvas);
}

function roundedPath(ctx, x, y, w, h, r) {
ctx.beginPath();
ctx.moveTo(x+r, y);
ctx.arcTo(x+w, y, x+w, y+h, r);
ctx.arcTo(x+w, y+h, x, y+h, r);
ctx.arcTo(x, y+h, x, y, r);
ctx.arcTo(x, y, x+w, y, r);
ctx.closePath();
}

function drawTerrainMap(ctx, rect) {
ctx.drawImage(state.mapAssets.terrainCanvas, rect.x, rect.y, rect.w, rect.h);
}

function drawGridAndAxes(ctx, rect, small) {
const d = state.level.domain;
ctx.save();
ctx.lineWidth = 1;
ctx.strokeStyle = small ? 'rgba(45,50,38,.12)' : 'rgba(45,50,38,.16)';
ctx.fillStyle = 'rgba(30,44,36,.64)';
ctx.font = small ? '700 9px ui-rounded, system-ui' : '750 11px ui-rounded, system-ui';
for (let x = Math.ceil(d.xmin); x <= Math.floor(d.xmax); x++) {
const p0 = mapToScreen(x, d.ymin, rect), p1 = mapToScreen(x, d.ymax, rect);
ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
if (!small) ctx.fillText(String(x), p0.x - 4, rect.y + rect.h + 12);
}
for (let y = Math.ceil(d.ymin); y <= Math.floor(d.ymax); y++) {
const p0 = mapToScreen(d.xmin, y, rect), p1 = mapToScreen(d.xmax, y, rect);
ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
if (!small) ctx.fillText(String(y), rect.x - 24, p0.y + 4);
}
if (!small) {
ctx.strokeStyle = 'rgba(30,44,36,.45)'; ctx.lineWidth = 1.25;
const ax0 = mapToScreen(d.xmin, 0, rect), ax1 = mapToScreen(d.xmax, 0, rect);
const ay0 = mapToScreen(0, d.ymin, rect), ay1 = mapToScreen(0, d.ymax, rect);
ctx.beginPath(); ctx.moveTo(ax0.x, ax0.y); ctx.lineTo(ax1.x, ax1.y); ctx.moveTo(ay0.x, ay0.y); ctx.lineTo(ay1.x, ay1.y); ctx.stroke();
ctx.fillStyle = 'rgba(30,44,36,.76)'; ctx.font = '900 12px ui-rounded, system-ui';
ctx.fillText('x', rect.x + rect.w + 12, ax1.y + 4);
ctx.fillText('y', ay1.x - 3, rect.y - 10);

function fittedArrowSegment(x, y, ux, uy, len, bounds=null) {
if (!bounds) return {x1:x, y1:y, x2:x+ux*len, y2:y+uy*len, shift:0};
const pad = Math.min(5, Math.max(2, Math.min(bounds.w, bounds.h) * .04));
const limits = {
xmin:bounds.x+pad, xmax:bounds.x+bounds.w-pad,
ymin:bounds.y+pad, ymax:bounds.y+bounds.h-pad

let low=0, high=len;
const constrain=(a,b,min,max)=>{
if(Math.abs(b)<1e-9)return a>=min&&a<=max;
let lo=(min-a)/b,hi=(max-a)/b;
if(lo>hi)[lo,hi]=[hi,lo];
low=Math.max(low,lo);high=Math.min(high,hi);
return low<=high;
};
const shiftX=-ux,shiftY=-uy;
const fits=
constrain(x,shiftX,limits.xmin,limits.xmax)&&
constrain(y,shiftY,limits.ymin,limits.ymax)&&
constrain(x+ux*len,shiftX,limits.xmin,limits.xmax)&&
constrain(y+uy*len,shiftY,limits.ymin,limits.ymax);
const shift=fits?clamp(0,low,high):0;
return {
x1:x-ux*shift,y1:y-uy*shift,
x2:x+ux*(len-shift),y2:y+uy*(len-shift),
shift
};
}

ctx.shadowColor = 'rgba(255,255,255,.80)'; ctx.shadowBlur = 3;

const head = small ? 5 : 10, a = Math.atan2(uy, ux);

function threeElevation(z) { return (z - (state.zMin + state.zMax) / 2) * state.verticalScale; }
function threePoint(x, y, z=state.level.terrain.f(x,y), lift=0) { return new THREE.Vector3(x * WORLD_SCALE, threeElevation(z) + lift, -y * WORLD_SCALE); }
function threeDir(v) { return new THREE.Vector3(v.x, 0, -v.y).normalize(); }
function terrainHeightAtWorld(wx, wz) {
const x = wx / WORLD_SCALE;
const y = -wz / WORLD_SCALE;
if (typeof extendedTerrainZ === 'function') return threeElevation(extendedTerrainZ(x, y));
const d = state.level.domain;
return threeElevation(state.level.terrain.f(clamp(x, d.xmin, d.xmax), clamp(y, d.ymin, d.ymax)));
}

function easeInOut(t) {
t = clamp(t, 0, 1);
return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function sequenceEase(t) {
t=clamp(t,0,1);
return t*t*t*(t*(t*6-15)+10);
}

function averageWalkingSlope(count=20) {
const N = state.samples.length;
const dir = state.lastDir || 1;
let total = 0, n = 0;
for (let k = 1; k <= count; k++) {
const s = state.samples[mod(Math.round(state.pos) + k * dir, N)];
total += s.slopeForward * dir;
n++;
}
return n ? total / n : currentSample().slopeForward * dir;
}

function lineOfSightOcclusion(target, eye) {
let maxPen = 0, maxT = 0;
const steps = 16;
for (let i = 1; i <= steps; i++) {
const t = i / (steps + 1);
const x = lerp(target.x, eye.x, t);
const y = lerp(target.y, eye.y, t);
const z = lerp(target.z, eye.z, t);
const pen = terrainHeightAtWorld(x, z) + .60 - y;
if (pen > maxPen) { maxPen = pen; maxT = t; }
}

}

function limitEyePitch(eye, target, maxPitchRad) {
const horiz = Math.max(.001, Math.hypot(eye.x - target.x, eye.z - target.z));
const maxY = target.y + Math.tan(maxPitchRad) * horiz;

}

function damp(current, goal, dt, tau) {
return lerp(current, goal, 1-Math.exp(-Math.max(0,dt)/Math.max(1e-6,tau)));

function verticalLiftRequired(eye, target) {

const x=lerp(target.x,eye.x,t),z=lerp(target.z,eye.z,t),y=lerp(target.y,eye.y,t);

}

function verticalLiftNeeded(eye,target) {

}

function clearShot(eye,target,sceneDt,kind) {
const wanted=verticalLiftNeeded(eye,target);

eye.y+=threeView.eyeLift;

function clearSideShot(eye,target,overhead=false) {

function resolveCameraYaw(cur,sceneDt) {

}else{

function terrainSunDot(gr) {
const preset = state.level.sky || SKY.meadow;
const az = preset.sunAzimuth ?? -.7;
const elv = preset.sunElevation ?? .45;
const sx = Math.cos(az) * Math.cos(elv);
const sy = Math.sin(elv);
const sz = Math.sin(az) * Math.cos(elv);
const k = (state.verticalScale || .16) / WORLD_SCALE;
const normal = new THREE.Vector3(-gr.x * k, 1, gr.y * k).normalize();
return clamp(normal.x * sx + normal.y * sy + normal.z * sz, -1, 1);
}

function threeColor(z, x, y, haze=0) {
const gr = state.level.terrain.grad(x, y);
const t = (z - state.zMin) / Math.max(1e-9, state.zMax - state.zMin);
const sunDot = terrainSunDot(gr);
let base = biomeColor(state.level, t, Math.hypot(gr.x, gr.y), 1, x, y);
const biome = state.level.biome;
const snowAllowed = ['tundra','alpine','meadow'].includes(biome);
if (snowAllowed) {
const snowStart = biome === 'tundra' ? .80 : .82;
const snow = clamp((t - snowStart + (hash2(x*4.1,y*4.1,state.level.seed)-.5)*.07) / .17, 0, biome === 'tundra' ? .80 : .72);
if (snow > 0) {
const sh = clamp((.36 - sunDot) / .80, 0, 1);
base = mixColor(base, mixColor([248,250,253], [218,230,248], sh*.325), snow);
}
}
if (haze) base = mixColor(base, hexRgb(state.level.sky?.fog || '#d9eadf'), haze);
const snowZone = biome === 'snowline' && t > .56;
const grainAmp = snowZone ? 5 : biome === 'badlands' ? 9 : 14;
const grain = (hash2(x * 11.1, y * 9.7, state.level.seed) - .5) * grainAmp;
return new THREE.Color(clamp(base[0] + grain,0,255)/255, clamp(base[1] + grain,0,255)/255, clamp(base[2] + grain,0,255)/255);
}

const TERRAIN_APRON_HEIGHT_BLEND = 3.8;
const TERRAIN_APRON_HAZE_BLEND = 4.8;
const TERRAIN_MAIN_EDGE_BLEND = .72;

function terrainDomainOutsideDistance(x,y) {
const d=state.level.domain;
const dx=x<d.xmin?d.xmin-x:x>d.xmax?x-d.xmax:0;
const dy=y<d.ymin?d.ymin-y:y>d.ymax?y-d.ymax:0;
return Math.hypot(dx,dy);
}

function extendedTerrainZ(x, y) {
const d = state.level.domain;
const cx = clamp(x, d.xmin, d.xmax), cy = clamp(y, d.ymin, d.ymax);
const edgeZ = state.level.terrain.f(cx, cy);
const outside = terrainDomainOutsideDistance(x,y);
if (outside <= 1e-9) return edgeZ - .06;
const relief = Math.max(1, state.zMax - state.zMin);
const mid = (state.zMin + state.zMax) / 2;
const waves = Math.sin(x*1.13 + y*.42 + state.level.seed*.001) * .36 + Math.sin(x*.37 - y*.91 + 2.2) * .29 + (hash2(x*.55, y*.55, state.level.seed) - .5) * .38;
const rimLift = smoothstep(0, 5.4, outside) * relief * .24;
const hills = mid + relief * (.16 + .34 * waves) + rimLift;
const blend = 1 - smoothstep(0, TERRAIN_APRON_HEIGHT_BLEND, outside);
return lerp(hills, edgeZ, blend);
}

  return mix(mix(lnpHash(i),lnpHash(i+vec2(1,0)),f.x),mix(lnpHash(i+vec2(0,1)),lnpHash(i+1.0),f.x),f.y);

float lnpGrain(vec2 p){return lnpNoise(p*.64)*.5+lnpNoise(p*1.77)*.3+lnpNoise(p*4.19)*.2;}
vec3 lnpViridis(float t){
  t=clamp(t,0.0,1.0);
  vec3 a=vec3(0.267,0.005,0.329),b=vec3(0.191,0.407,0.556);
  vec3 c=vec3(0.208,0.719,0.473),d=vec3(0.993,0.906,0.144);
  return t<0.333?mix(a,b,t*3.0):(t<0.666?mix(b,c,(t-0.333)*3.003):mix(c,d,(t-0.666)*2.994));

`+shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
diffuseColor.rgb *= mix(vec3(1.0),vLnpBakedLight,uBakeMix*vLnpMainBlend);

.replace('#include <normal_fragment_begin>',`#include <normal_fragment_begin>

vec3 lnpP=vec3(vLnpWorldXZ.x,lnpGrain(vLnpWorldXZ)*uDetailStrength,vLnpWorldXZ.y);

}

function buildTerrainMesh(xmin, xmax, ymin, ymax, n, extended=false) {
const vertices = [], colors = [], fields = [], bakedLight = [], mainBlend = [], indices = [];
for (let j = 0; j < n; j++) {
const y = lerp(ymin, ymax, j/(n-1));
for (let i = 0; i < n; i++) {
const x = lerp(xmin, xmax, i/(n-1));
const cx = clamp(x, state.level.domain.xmin, state.level.domain.xmax);
const cy = clamp(y, state.level.domain.ymin, state.level.domain.ymax);
const z = extended ? extendedTerrainZ(x, y) : state.level.terrain.f(x, y);
vertices.push(x * WORLD_SCALE, threeElevation(z), -y * WORLD_SCALE);
const outside=extended?terrainDomainOutsideDistance(x,y):0;
const haze=extended ? .28*smoothstep(0,TERRAIN_APRON_HAZE_BLEND,outside) : 0;
const color = threeColor(z, cx, cy, haze);
colors.push(color.r, color.g, color.b);
fields.push(z);
bakedLight.push(1,1,1);
const edgeDistance=Math.min(
x-state.level.domain.xmin,
state.level.domain.xmax-x,
y-state.level.domain.ymin,
state.level.domain.ymax-y
);
mainBlend.push(extended?0:smoothstep(0,TERRAIN_MAIN_EDGE_BLEND,Math.max(0,edgeDistance)));
}
}
for (let j = 0; j < n - 1; j++) {
for (let i = 0; i < n - 1; i++) {
const a = j*n + i, b = a + 1, c = a + n, e = c + 1;
indices.push(a, b, c, b, e, c);
}
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geometry.setAttribute('aField', new THREE.Float32BufferAttribute(fields, 1));
geometry.setAttribute('aBakedLight', new THREE.Float32BufferAttribute(bakedLight, 3));
geometry.setAttribute('aMainBlend', new THREE.Float32BufferAttribute(mainBlend, 1));
geometry.setIndex(indices); geometry.computeVertexNormals();
const mat = makeTerrainMaterial(!extended);
const mesh = new THREE.Mesh(geometry, mat);
mesh.receiveShadow = true;
mesh.userData.terrainGrid={xmin,xmax,ymin,ymax,n,extended};
threeView.terrainMaterials.push(mat);
return mesh;
}

function buildTerrain3D() {
const d = state.level.domain;
const group = new THREE.Group();
threeView.terrainShaderEnabled=terrainShaderSupported();
threeView.terrainMaterials=[];
const pad = (d.xmax - d.xmin) * 1.05;
const apron = buildTerrainMesh(d.xmin - pad, d.xmax + pad, d.ymin - pad, d.ymax + pad, 121, true);
apron.receiveShadow = true;
const main = buildTerrainMesh(d.xmin, d.xmax, d.ymin, d.ymax, 213, false);
main.receiveShadow = true;
threeView.terrainMain=main;
group.add(apron, main);
group.userData.main=main;
return group;
}

function terrainBakeKey(tier=terrainBakeTier()) {
const sky=state.level.sky||SKY.meadow;
return [
state.level.id||'patrol',state.level.seed||0,state.level.biome||'default',
sky.sunAzimuth??-.7,sky.sunElevation??.45,sky.noSun?1:0,tier
].join('|');
}

function terrainBakePoint(x,y,tier) {
const level=state.level,d=level.domain,sky=level.sky||SKY.meadow;
const z0=level.terrain.f(x,y);
const az=sky.sunAzimuth??-.7,elv=sky.sunElevation??.45;
const sx=Math.cos(az)*Math.cos(elv),sy=-Math.sin(az)*Math.cos(elv);
const horizontal=Math.max(1e-5,Math.hypot(sx,sy));
let sunVis=1;
if(!sky.noSun&&elv>.01){
let t=.06,minScore=Infinity;
for(let step=0;step<48;step++,t*=1.12){
const px=clamp(x+sx*t,d.xmin,d.xmax),py=clamp(y+sy*t,d.ymin,d.ymax);
const zRay=z0+(Math.sin(elv)/horizontal)*t*(WORLD_SCALE/state.verticalScale);
const zTer=level.terrain.f(px,py);
const clearanceWorld=(zRay-zTer)*state.verticalScale;
const penumbra=.12+t*WORLD_SCALE*.035;
minScore=Math.min(minScore,clearanceWorld/penumbra);
}
sunVis=smoothstep(-.35,.65,minScore);
}
const azimuths=tier==='low'?8:16;
const radii=tier==='low'?[.22,.62,1.4]:[.16,.36,.72,1.42];
let skyVisibility=0;
for(let a=0;a<azimuths;a++){
const theta=(a+.5)/azimuths*TAU;
let horizon=0;
for(const radius of radii){
const px=clamp(x+Math.cos(theta)*radius,d.xmin,d.xmax);
const py=clamp(y+Math.sin(theta)*radius,d.ymin,d.ymax);
const actualDistance=Math.max(1e-5,Math.hypot(px-x,py-y)*WORLD_SCALE);
const rise=(level.terrain.f(px,py)-z0)*state.verticalScale;
horizon=Math.max(horizon,Math.atan2(rise,actualDistance));
}
skyVisibility+=1-Math.sin(clamp(horizon,0,Math.PI/2));
}
const ao=skyVisibility/azimuths;
const light=(.58+.42*ao)*(.58+.42*sunVis);
const skyRgb=hexRgb(sky.hemiSky||'#f2f8ff').map(value=>value/255);
const skyMax=Math.max(.001,...skyRgb);
const tint=.20*(1-sunVis);
return skyRgb.map(value=>light*lerp(1,value/skyMax,tint));
}

function scheduleTerrainIdle(callback) {
if('requestIdleCallback' in window)requestIdleCallback(callback,{timeout:80});
else setTimeout(()=>callback({didTimeout:true,timeRemaining:()=>4}),0);
}

function applyTerrainBake(grid,jobId,key) {
const mesh=threeView.terrainMain;
if(jobId!==terrainBakeJobId||!mesh||threeView.terrainBake?.key!==key)return;
const position=mesh.geometry.getAttribute('position');
const attribute=mesh.geometry.getAttribute('aBakedLight');
const d=state.level.domain,n=grid.n,values=grid.values;
for(let i=0;i<position.count;i++){
const x=position.getX(i)/WORLD_SCALE,y=-position.getZ(i)/WORLD_SCALE;
const gx=clamp((x-d.xmin)/(d.xmax-d.xmin)*(n-1),0,n-1);
const gy=clamp((y-d.ymin)/(d.ymax-d.ymin)*(n-1),0,n-1);
const x0=Math.floor(gx),y0=Math.floor(gy),x1=Math.min(n-1,x0+1),y1=Math.min(n-1,y0+1);
const tx=gx-x0,ty=gy-y0;
const edge=Math.min(gx,gy,n-1-gx,n-1-gy)/(n-1);
const edgeMix=smoothstep(0,.08,edge);
for(let channel=0;channel<3;channel++){
const a=lerp(values[(y0*n+x0)*3+channel],values[(y0*n+x1)*3+channel],tx);
const b=lerp(values[(y1*n+x0)*3+channel],values[(y1*n+x1)*3+channel],tx);
attribute.array[i*3+channel]=lerp(1,lerp(a,b,ty),edgeMix);
}
}
attribute.needsUpdate=true;
threeView.terrainBake.status='blending';
threeView.terrainBake.ready=true;
threeView.terrainBake.progress=1;
threeView.terrainBake.mix=0;
threeView.terrainBake.mixStartedAt=performance.now();
}

function scheduleTerrainBake() {
const mesh=threeView.terrainMain;
const tier=terrainBakeTier(),n=tier==='low'?73:109,key=terrainBakeKey(tier);
const jobId=++terrainBakeJobId;
threeView.terrainBake={key,tier,grid:n,status:'queued',ready:false,progress:0,rowsDone:0,totalRows:n,mix:0,maxChunkMs:0,cacheHit:false};
if(!threeView.terrainShaderEnabled||!mesh)return;
const cached=terrainBakeCache.get(key);
if(cached){
threeView.terrainBake.cacheHit=true;
scheduleTerrainIdle(()=>applyTerrainBake(cached,jobId,key));
return;
}
const d=state.level.domain,values=new Float32Array(n*n*3);
let row=0,column=0;
const processChunk=()=>{
if(jobId!==terrainBakeJobId||threeView.terrainMain!==mesh)return;
const chunkStarted=performance.now();
while(row<n&&performance.now()-chunkStarted<1.8){
const y=lerp(d.ymin,d.ymax,row/(n-1));
const x=lerp(d.xmin,d.xmax,column/(n-1));
const light=terrainBakePoint(x,y,tier),offset=(row*n+column)*3;
values[offset]=light[0];values[offset+1]=light[1];values[offset+2]=light[2];
if(++column>=n){row++;column=0;}
}
const elapsed=performance.now()-chunkStarted;
threeView.terrainBake.maxChunkMs=Math.max(threeView.terrainBake.maxChunkMs,elapsed);
threeView.terrainBake.rowsDone=row;
threeView.terrainBake.progress=row/n;
threeView.terrainBake.status=row<n?'baking':'applying';
if(row<n){scheduleTerrainIdle(processChunk);return;}
const grid={n,values};
terrainBakeCache.set(key,grid);
if(terrainBakeCache.size>12)terrainBakeCache.delete(terrainBakeCache.keys().next().value);
applyTerrainBake(grid,jobId,key);
};
scheduleTerrainIdle(processChunk);
}

function updateTerrainShader3D(cur,now) {
const layers=currentMapLayers();
const mode=layers.contours==='colored'?2:layers.contours==='neutral'?1:0;
const interval=Math.max(1e-4,(state.mapAssets?.interval||1)*contourDensitySetting().multiplier);
let bakeMix=0;
if(threeView.terrainBake?.ready){
bakeMix=smoothstep(0,1,(now-threeView.terrainBake.mixStartedAt)/400);
threeView.terrainBake.mix=bakeMix;
if(bakeMix>=1)threeView.terrainBake.status='ready';
}
for(const material of threeView.terrainMaterials){
const uniforms=material.userData?.terrainUniforms;
if(!uniforms)continue;
uniforms.uBakeMix.value=bakeMix;
uniforms.uContoursOn.value=mode?1:0;
uniforms.uCurrentOn.value=layers.currentFContour?1:0;
uniforms.uContourMode.value=mode;
uniforms.uInterval.value=interval;
uniforms.uCurrentZ.value=cur.z;
uniforms.uZMin.value=state.zMin;
uniforms.uZMax.value=state.zMax;
}
}

function buildBackdropRing(profileFn, radius, opts={}) {
const segments = opts.segments || 128;
const levels = opts.levels || 6;
const baseY = opts.baseY ?? -9;
const opacity = opts.opacity ?? .50;
const verts = [], cols = [], idxs = [];
const nearC = new THREE.Color(opts.color || '#b9c9da');
const topC = new THREE.Color(opts.topColor || opts.color || '#dde8f2');
const strata = opts.strata || null;
for (let i = 0; i <= segments; i++) {
const a = i / segments * TAU;
const x = Math.cos(a) * radius;
const z = Math.sin(a) * radius;
const top = profileFn(a, i / segments);
for (let j = 0; j <= levels; j++) {
const v = j / levels;
verts.push(x, lerp(baseY, top, v), z);
let color;
if (strata) {
const paletteIdx = Math.min(strata.length - 1, Math.floor(v * strata.length));
color = threeRgb(strata[paletteIdx]);
if (v > .82 && opts.capColor) color.lerp(new THREE.Color(opts.capColor), .65);
} else {
color = nearC.clone().lerp(topC, v * .82);
if (opts.snowTop && v > .68) color.lerp(new THREE.Color('#f8fbff'), smoothstep(.68, 1, v) * .80);
}
cols.push(color.r, color.g, color.b);
}
}
const row = levels + 1;
for (let i = 0; i < segments; i++) {
for (let j = 0; j < levels; j++) {
const a = i*row + j, b = (i+1)*row + j, c = a+1, d = b+1;
idxs.push(a,b,c, c,b,d);
}
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
geo.setIndex(idxs); geo.computeVertexNormals();
const mat = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity, depthWrite:false, side:THREE.DoubleSide, fog:true});
const mesh = new THREE.Mesh(geo, mat);
mesh.renderOrder = -10;
mesh.frustumCulled = false;
return mesh;
}

function jaggedBackdropProfile(theta, amp=7, base=9, seed=0) {
const a = Math.sin(theta*3 + seed) * .42 + Math.sin(theta*7.1 + seed*.43) * .24 + Math.sin(theta*13.7 + 1.8) * .14;
const h = hash2(Math.cos(theta)*2.1, Math.sin(theta)*2.1, seed) - .5;
return base + amp * clamp(.62 + a + h*.25, .12, 1.18);
}

function mesaBackdropProfile(theta, amp=8, base=7, seed=0) {
const shelf = Math.floor(mod(theta + seed*.17, TAU) / TAU * 10);
return base + (shelf % 3 === 0 ? amp : amp*.46) + 2.2*Math.sin(theta*4.2+seed) + .7*Math.sin(theta*11+seed);
}

function buildBackdrop3D() {
const biome = state.level.biome;
const group = new THREE.Group();
const seed = state.level.seed || 1;
const add = mesh => { if (mesh) group.add(mesh); };
if (biome === 'snowline') {
add(buildBackdropRing(theta => jaggedBackdropProfile(theta, 10, 10, seed), 150, {color:'#b9c9da', topColor:'#eef6ff', opacity:.72, levels:5, snowTop:true}));
add(buildBackdropRing(theta => jaggedBackdropProfile(theta, 13, 13, seed+8), 230, {color:'#dde8f2', topColor:'#ffffff', opacity:.52, levels:5, snowTop:true}));
} else if (biome === 'badlands') {
const strata = [[198,145,112],[228,194,152],[134,92,92],[235,211,169],[177,111,78],[129,105,126]];
add(buildBackdropRing(theta => mesaBackdropProfile(theta, 7, 7, seed), 148, {strata, opacity:.70, levels:6}));
add(buildBackdropRing(theta => mesaBackdropProfile(theta, 9, 9, seed+1.7), 228, {strata: strata.map(c => mixColor(c,[232,205,182],.35)), opacity:.50, levels:6}));
} else if (biome === 'cinder') {
const az = (state.level.sky?.sunAzimuth ?? .5) + Math.PI;
add(buildBackdropRing(theta => 8 + 17 * Math.exp(-Math.pow(angularDistance(theta, az), 2) / .22) + 2*Math.sin(theta*5+seed), 185, {color:'#9d8c85', topColor:'#f0f3f0', opacity:.60, levels:5, snowTop:true}));
} else if (biome === 'mojave') {
const near=state.level.sky?.backdropNear||'#8d7fa6',far=state.level.sky?.backdropFar||'#b59abd';
add(buildBackdropRing(theta => mesaBackdropProfile(theta, 5, 7, seed), 150, {color:near, topColor:far, opacity:.66, levels:4}));
add(buildBackdropRing(theta => mesaBackdropProfile(theta, 6, 10, seed+4), 230, {color:far, topColor:'#c8b7d0', opacity:.48, levels:4}));
} else if (biome === 'tundra') {
add(buildBackdropRing(theta => jaggedBackdropProfile(theta, 7, 9, seed), 155, {color:'#9db4cc', topColor:'#d9e7f4', opacity:.62, levels:4}));
add(buildBackdropRing(theta => jaggedBackdropProfile(theta, 9, 11, seed+3), 235, {color:'#c4d4e4', topColor:'#f1f7ff', opacity:.46, levels:4}));
} else {
add(buildBackdropRing(theta => jaggedBackdropProfile(theta, 6, 8, seed), 170, {color:'#a9bac8', topColor:'#dce6ee', opacity:.54, levels:4}));
}
group.frustumCulled = false;
return group.children.length ? group : null;
}


function contourSegments3D(z, lift=.12) {
const segments = marchingSegments(state.mapAssets.values, state.mapAssets.N, state.level.domain, z);
const verts = [];
for (const seg of segments) {
const z0 = state.level.terrain.f(seg[0].x, seg[0].y);
const z1 = state.level.terrain.f(seg[1].x, seg[1].y);
const a = threePoint(seg[0].x, seg[0].y, z0, lift);
const b = threePoint(seg[1].x, seg[1].y, z1, lift);
verts.push(a.x,a.y,a.z,b.x,b.y,b.z);
}
return verts;
}

function buildBaseContours3D() {
const verts = [],colors=[];
const colored=currentMapLayers().contours==='colored';
for (const contour of state.mapAssets.contours){
const contourVerts=contourSegments3D(contour.z,.10);

const rgb=colored?viridisRgb((contour.z-state.zMin)/Math.max(1e-9,state.zMax-state.zMin)):[45,52,41];

}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
if(colored)geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
return new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({color:colored?0xffffff:0x2d3429,vertexColors:colored,transparent:true,opacity:colored?.58:.22,depthWrite:false}));
}

function buildCurrentContour3D(z) {

function makeStripMesh(verts, colors, indices, rough=.96) {

function buildTrailRibbon3D() {
const group = new THREE.Group();
const N = state.samples.length, stride = 2;
const treadVerts = [], treadColors = [], treadIndices = [];
const shoulderVerts = [], shoulderColors = [], shoulderIndices = [];
let row = 0;
const baseWidth = state.level.biome === 'snowline' ? .095 : .085;
const style = trailStyleFor();
for (let i = 0; i <= N; i += stride) {
const s = state.samples[mod(i, N)];
const n = {x:-s.t.y, y:s.t.x};
const width = baseWidth * (1 + .12 * Math.sin(i * .083 + state.level.seed));
const centerZ = state.level.terrain.f(s.x, s.y);
let tread = mixColor(style.treadA, style.treadB, .50 + .18 * Math.sin(i * .17));
if (state.level.biome === 'snowline' && row % 12 === 0) tread = mixColor(tread, [0,0,0], .08);
const treadC = threeRgb(tread);
const shoulderC = threeRgb(style.shoulder);
const edgePts = [];
for (const side of [-1, 1]) {
const x = s.x + n.x * side * width * .5;
const y = s.y + n.y * side * width * .5;
const p = threePoint(x, y, centerZ, TREAD_LIFT);
treadVerts.push(p.x, p.y, p.z);
treadColors.push(treadC.r,treadC.g,treadC.b);
edgePts.push({x, y, p, side});
}
for (const edge of edgePts) {
const outerX = s.x + n.x * edge.side * width * .92;
const outerY = s.y + n.y * edge.side * width * .92;
const outerZ = state.level.terrain.f(outerX, outerY);
const outer = threePoint(outerX, outerY, outerZ, .025);
shoulderVerts.push(edge.p.x, edge.p.y - .015, edge.p.z, outer.x, outer.y, outer.z);
shoulderColors.push(shoulderC.r, shoulderC.g, shoulderC.b, shoulderC.r*.92, shoulderC.g*.92, shoulderC.b*.92);
}
if (row > 0) {
const a = (row - 1) * 2, b = a + 1, c = row * 2, d = c + 1;
treadIndices.push(a, c, b, b, c, d);
const ls0 = (row - 1) * 4, ls1 = row * 4;
shoulderIndices.push(ls0, ls1, ls0+1, ls0+1, ls1, ls1+1);
shoulderIndices.push(ls0+2, ls0+3, ls1+2, ls0+3, ls1+3, ls1+2);
}
row++;
}
group.add(makeStripMesh(shoulderVerts, shoulderColors, shoulderIndices, .98));
group.add(makeStripMesh(treadVerts,treadColors,treadIndices,state.level.biome==='snowline'?.72:.96));
if (state.level.biome === 'snowline') {
const iceMat = new THREE.MeshStandardMaterial({color:0xcceffa, roughness:.25, metalness:.02, transparent:true, opacity:.58, side:THREE.DoubleSide, depthWrite:false});
for (const idx of [Math.floor(N*.20), Math.floor(N*.53), Math.floor(N*.77)]) {
const s = state.samples[mod(idx, N)];
const p = threePoint(s.x, s.y, s.z, .075);
const ice = new THREE.Mesh(new THREE.CircleGeometry(.22, 24), iceMat.clone());

function buildTrailMarkers3D() {
const group = new THREE.Group();
const style = trailStyleFor();
const wand = style.marker === 'wand';

const blazeMat = new THREE.MeshStandardMaterial({color:wand ? 0xff8b24 : 0xb12f24, roughness:.75, side:THREE.DoubleSide});
const N = state.samples.length;
const step = wand ? 64 : 80;
for (let i = 0; i < N; i += step) {
const s = state.samples[i];
const n = {x:-s.t.y, y:s.t.x};
const x = s.x + n.x * (wand ? .20 : .24), y = s.y + n.y * (wand ? .20 : .24);
const p = threePoint(x, y, state.level.terrain.f(x,y), .06);
