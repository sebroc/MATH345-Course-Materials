post.castShadow = true; post.position.copy(p).add(new THREE.Vector3(0, wand ? .43 : .275, 0));
let blaze;
if (wand) {
blaze = new THREE.Mesh(new THREE.PlaneGeometry(.22,.13), blazeMat);
blaze.position.copy(p).add(new THREE.Vector3(.08*Math.cos(i*.2), .73, .08*Math.sin(i*.2)));
} else {
blaze = new THREE.Mesh(new THREE.BoxGeometry(.14,.13,.026), blazeMat);
blaze.position.copy(p).add(new THREE.Vector3(0,.44,0));
}
blaze.rotation.y = Math.atan2(s.t.x, -s.t.y);
group.add(post, blaze);
}
const s0 = state.samples[0];
const sign = new THREE.Group();
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.9,8), postMat);
pole.position.y = .45;
const board = new THREE.Mesh(new THREE.BoxGeometry(.86,.25,.06), new THREE.MeshStandardMaterial({color:wand ? 0x50575b : 0x8a5d32, roughness:.82}));
board.position.y = .82;
sign.add(pole, board);

sign.position.copy(threePoint(sx, sy, state.level.terrain.f(sx, sy), .06));
sign.rotation.y = Math.atan2(s0.t.x, -s0.t.y);
group.add(sign);
return group;
}

function setInstance(mesh, idx, x, y, z, scale, rotY=0) {
threeView.tmpPos.set(x, y, z);
threeView.tmpQuat.setFromEuler(new THREE.Euler(0, rotY, 0));
threeView.tmpScale.set(scale.x, scale.y, scale.z);
threeView.tmpMat.compose(threeView.tmpPos, threeView.tmpQuat, threeView.tmpScale);
mesh.setMatrixAt(idx, threeView.tmpMat);
}

function setGroundedInstance(mesh, idx, it, p, scale, rotY=0, normalLift=0) {
const gr = state.level.terrain.grad(it.x, it.y);
const k = (state.verticalScale || .16) / WORLD_SCALE;
threeView.tmpNormal.set(-gr.x * k, 1, gr.y * k).normalize();
threeView.tmpQuat.setFromUnitVectors(threeView.tmpUp, threeView.tmpNormal);
threeView.tmpQuatB.setFromAxisAngle(threeView.tmpUp, rotY);
threeView.tmpQuat.multiply(threeView.tmpQuatB);
// addInstanced supplies a generic .025 vertical lift. Ground-hugging props
// replace it with a smaller surface-normal inset so downhill edges cannot hover.
threeView.tmpPos.set(p.x, p.y - .025, p.z).addScaledVector(threeView.tmpNormal, normalLift);
threeView.tmpScale.set(scale.x, scale.y, scale.z);
threeView.tmpMat.compose(threeView.tmpPos, threeView.tmpQuat, threeView.tmpScale);
mesh.setMatrixAt(idx, threeView.tmpMat);
}

function jitteredThreeColor(base, it, amt=.08) {
const f = 1 + (hash2(it.x * 3.7, it.y * 4.3, state.level.seed + it.colorSeed * 99) - .5) * amt * 2;
return new THREE.Color(clamp(base[0]*f,0,255)/255, clamp(base[1]*f,0,255)/255, clamp(base[2]*f,0,255)/255);
}

function addInstanced(group, name, geo, mat, items, place, colorBase=null) {
if (!items.length) return null;
const mesh = new THREE.InstancedMesh(geo, mat, items.length);
if(mat.userData.windUniforms&&!threeView.windMaterials.includes(mat))threeView.windMaterials.push(mat);
items.forEach((it, idx) => {
const p = threePoint(it.x, it.y, it.z, .025);
place(mesh, idx, it, p);
if (colorBase && mesh.setColorAt) {
const base = typeof colorBase === 'function' ? colorBase(it, idx) : colorBase;
mesh.setColorAt(idx, jitteredThreeColor(base, it, .10));
}
});
mesh.instanceMatrix.needsUpdate = true;
if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
mesh.castShadow = mesh.receiveShadow = true;
group.add(mesh);
return mesh;
}

function biomeWind(){return {mojave:1.15,badlands:.82,snowline:.72,tundra:.76,cinder:.26}[state.level.biome]||.62;}
function addVegetationWind(material,strength,kind) {
const uniforms={uTime:atmosphereUniforms.uTime,uMotion:atmosphereUniforms.uMotion,uWind:{value:strength*biomeWind()}};
material.userData.windUniforms=uniforms;material.userData.windKind=kind;
material.customProgramCacheKey=()=>`lnp-wind-${kind}-v1`;
material.onBeforeCompile=shader=>{
Object.assign(shader.uniforms,uniforms);
shader.vertexShader=`uniform float uTime;uniform float uMotion;uniform float uWind;\n`+shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
float lnpH=max(transformed.y+.25,0.0);
float lnpPhase=instanceMatrix[3][0]*.7+instanceMatrix[3][2]*.5;
float lnpS=sin(uTime*1.35+lnpPhase)+.35*sin(uTime*.77+lnpPhase*1.7);
transformed.xz+=vec2(lnpS,cos(uTime*1.12+lnpPhase))*(uWind*uMotion*lnpH*lnpH*.12);`);
material.userData.compiledShader=shader;
};
return material;
}

function addFlagWind(material) {

float lnpT=clamp(position.x/.44+.5,0.0,1.0);
transformed.z+=sin(uTime*4.2+lnpT*8.0)*uWind*uMotion*lnpT*.035;
transformed.y+=sin(uTime*3.1+lnpT*5.0)*uWind*uMotion*lnpT*.008;`);
material.userData.compiledShader=shader;
};
return material;
}

function buildWater3D() {
const biome = state.level.biome;
// Marmot Dome has no authored shoreline. A flat tundra tarn exposes its disc
// edge against the steep Gaussian terrain, so only crater terrain gets water.
if (biome === 'tundra') return null;
// The crater lake belongs to Obsidian Caldera's authored terrain. Random
// cinder patrol terrain has no matching basin, so a flat lake clips through it.
if (!(biome === 'volcanic' || biome === 'cinder' && state.level?.id === 'cinder')) return null;
const group = new THREE.Group();
const waterZ = state.level.terrain.f(-.1, .05) + 1.1;
const edgeMat = new THREE.MeshStandardMaterial({color:0x3f8ca0, roughness:.14, metalness:0, transparent:true, opacity:.46, side:THREE.DoubleSide});

edge.rotation.x = -Math.PI / 2;
edge.position.copy(threePoint(-.1, .05, waterZ, .055));
edge.userData.animate = true;
edge.userData.baseOpacity = .46;
const mat = new THREE.MeshStandardMaterial({color:0x1d5c7c, roughness:.12, metalness:0, transparent:true, opacity:.78, side:THREE.DoubleSide});
const water = new THREE.Mesh(new THREE.CircleGeometry(4.65, 128), mat);
water.rotation.x = -Math.PI / 2;
water.position.copy(threePoint(-.1, .05, waterZ, .075));
water.userData.animate = true;
water.userData.baseOpacity = .78;
group.add(edge, water);

const ix = .72, iy = -.48;
const iz = waterZ + 1.1;
const island = new THREE.Group();
island.name = 'Wizard Island';
const coneMat = new THREE.MeshStandardMaterial({color:0x4e4540, roughness:.93, flatShading:true});
const oxideMat = new THREE.MeshStandardMaterial({color:0x8d4c39, roughness:.94, flatShading:true});
const baseCone = new THREE.Mesh(new THREE.ConeGeometry(.98, 1.45, 18), coneMat);
baseCone.position.y = .72; baseCone.rotation.y = .35; baseCone.castShadow = true;
const topCone = new THREE.Mesh(new THREE.ConeGeometry(.48, .72, 15), oxideMat);
topCone.position.y = 1.72; topCone.rotation.y = -0.25; topCone.castShadow = true;
const notch = new THREE.Mesh(new THREE.TorusGeometry(.26, .035, 8, 18, Math.PI*1.45), new THREE.MeshStandardMaterial({color:0x2e2c2c, roughness:.96}));
notch.position.y = 1.96; notch.rotation.x = Math.PI/2; notch.rotation.z = .75;
island.add(baseCone, topCone, notch);
island.position.copy(threePoint(ix, iy, iz, .02));
island.scale.set(1.15,1.0,1.15);
group.add(island);
return group;
}

for(let i=0;i<(wispy?26:38);i++){

const rx=(wispy?52:30)+hash2(i,seed,41)*(wispy?78:56),ry=(wispy?7:14)+hash2(i,seed,53)*(wispy?13:25);

const g=x.createRadialGradient(0,0,0,0,0,ry);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.55,'rgba(255,255,255,.58)');g.addColorStop(1,'rgba(255,255,255,0)');

}

function wildlifeYaw(dx, dy) { return Math.atan2(dx * WORLD_SCALE, -dy * WORLD_SCALE); }

function wildlifeGroundSlope(x, y) {
const g=state.level.terrain.grad(x,y);
return Math.hypot(g.x,g.y)*(state.verticalScale||.16)/WORLD_SCALE;
}

function nearestTrailDistanceMap(x, y, step=10) {
let best = Infinity, idx = 0;
const N = state.samples.length || 1;
for (let k = 0; k < N; k += step) {
const s = state.samples[k];
const d = Math.hypot(s.x - x, s.y - y);
if (d < best) { best = d; idx = k; }
}
return {dist:best, idx};
}

function wildlifeAvoidsExtrema(idx) {
const guard=STAKE_EPS_FRAC*2;
if(trailArcDistanceFrac(idx,state.maxIdx)<guard||trailArcDistanceFrac(idx,state.minIdx)<guard)return false;
for(const candidate of state.candidates||[])if(trailArcDistanceFrac(idx,candidate.i)<guard)return false;
return true;
}

function wildlifeSideForSample(s, dist=.72) {
const n = {x:-s.t.y, y:s.t.x};
let plus = 0, minus = 0;
for (const m of [.55, 1, 1.25]) {
plus += state.level.terrain.f(s.x + n.x * dist * m, s.y + n.y * dist * m);
minus += state.level.terrain.f(s.x - n.x * dist * m, s.y - n.y * dist * m);
}
return plus <= minus ? 1 : -1;
}

function wildlifePointValid(x, y, minTrail=.16, maxSlope=Infinity) {
const d = state.level.domain;
if (x < d.xmin + .08 || x > d.xmax - .08 || y < d.ymin + .08 || y > d.ymax - .08) return false;
if(wildlifeGroundSlope(x,y)>maxSlope)return false;
const near = nearestTrailDistanceMap(x, y, 8);
return near.dist > minTrail && wildlifeAvoidsExtrema(near.idx);
}

function wildlifeLOSOk(sample, x, y) {
const trailEye = threePoint(sample.x, sample.y, sample.z, 1.15);
const animalPoint = threePoint(x, y, state.level.terrain.f(x, y), .58);
return lineOfSightOcclusion(animalPoint, trailEye).pen < .45;
}

function chooseWildlifeAnchors(count=4, minTrailOffset=.38, maxTrailOffset=.98) {
const rng = seededRand((state.level.seed || 1) ^ 0x9e3779b9);
const d = state.level.domain;
const candidates = [];
const N = state.samples.length || 1;
for (let k = Math.floor(rng() * 30); k < N; k += 34) {
if (!wildlifeAvoidsExtrema(k)) continue;
const s0 = state.samples[k];
const valley = wildlifeSideForSample(s0, .75);
for (const side of [valley, -valley]) {
const n = {x:-s0.t.y * side, y:s0.t.x * side};
const off = lerp(minTrailOffset, maxTrailOffset, rng());
const along = (rng() - .5) * .18;
const x = s0.x + n.x * off + s0.t.x * along;
const y = s0.y + n.y * off + s0.t.y * along;
if (x < d.xmin + .18 || x > d.xmax - .18 || y < d.ymin + .18 || y > d.ymax - .18) continue;
const trailD = nearestTrailDistanceMap(x, y, 12).dist;
if (trailD < .18 || trailD > 1.55) continue;
let tallNear = 0;
for (const it of state.decorations || []) {
if (decorationHeightWorld(it.kind, it.scale) > .85 && Math.hypot(it.x - x, it.y - y) < .58) tallNear++;
}
const los = wildlifeLOSOk(s0, x, y) ? 1 : 0;
const score = los * 4 + trailD * 1.1 + (side === valley ? .45 : 0) - tallNear * .85 + rng() * .5;
candidates.push({x, y, z:state.level.terrain.f(x, y), idx:k, side, score});
}
}
candidates.sort((a,b) => b.score - a.score);
const chosen = [];
const minSep = Math.max(70, Math.floor(N / 7));
for (const c of candidates) {
if (chosen.every(o => distIndex(o.idx, c.idx, N) > minSep && Math.hypot(o.x - c.x, o.y - c.y) > .58)) chosen.push(c);
if (chosen.length >= count) break;
}
let tries = 0;
while (chosen.length < count && tries++ < 30) {
const k = Math.floor(rng() * N);
if (!wildlifeAvoidsExtrema(k)) continue;
const s0 = state.samples[k], side = wildlifeSideForSample(s0, .7);
const n = {x:-s0.t.y * side, y:s0.t.x * side};
const off = lerp(minTrailOffset, maxTrailOffset, rng());
const x = clamp(s0.x + n.x * off, d.xmin + .2, d.xmax - .2);
const y = clamp(s0.y + n.y * off, d.ymin + .2, d.ymax - .2);
if (wildlifePointValid(x, y, .16)) chosen.push({x, y, z:state.level.terrain.f(x, y), idx:k, side, score:0});
}
return chosen.length ? chosen : [{x:0, y:0, z:state.level.terrain.f(0,0), idx:0, side:1, score:0}];
}

function scatterWildlife(anchor, rng, radius=.26, minTrail=.18, maxSlope=Infinity) {
const d = state.level.domain;
for (let tries = 0; tries < 28; tries++) {
const a = rng() * TAU, r = Math.sqrt(rng()) * radius;
const x = clamp(anchor.x + Math.cos(a) * r, d.xmin + .12, d.xmax - .12);
const y = clamp(anchor.y + Math.sin(a) * r, d.ymin + .12, d.ymax - .12);
if (wildlifePointValid(x, y, minTrail, maxSlope)) return {x, y};
}
for(let tries=0;tries<56&&Number.isFinite(maxSlope);tries++){
const x=lerp(d.xmin+.16,d.xmax-.16,rng()),y=lerp(d.ymin+.16,d.ymax-.16,rng());
if(wildlifePointValid(x,y,minTrail,maxSlope))return {x,y};
}
return {x:anchor.x, y:anchor.y};
}

function wildlifeDecorationPoint(kinds, rng, fallback, minTrail=.18) {
const list = (state.decorations || []).filter(d => kinds.includes(d.kind) && nearestTrailDistanceMap(d.x, d.y, 12).dist > minTrail && wildlifeAvoidsExtrema(nearestTrailDistanceMap(d.x, d.y, 12).idx));
if (!list.length) return fallback;
const d = list[Math.floor(rng() * list.length)];
return {x:d.x, y:d.y, lift:.15 * (d.scale || 1)};
}

function chooseAnimalWaypoint(a) {
a.userData.wpSerial = (a.userData.wpSerial || 0) + 1;
const seed = state.level.seed + Math.floor((a.userData.phase || 0) * 997) + a.userData.wpSerial * 53;
for (let tries=0; tries<14; tries++) {
const r1 = hash2(a.userData.homeX*13.1 + tries, a.userData.homeY*9.7, seed), r2 = hash2(a.userData.homeY*11.1 + tries, a.userData.homeX*5.7, seed + 17);
const ang = r1 * TAU, rad = Math.sqrt(r2) * (a.userData.radius || .45);
const x = a.userData.homeX + Math.cos(ang) * rad, y = a.userData.homeY + Math.sin(ang) * rad;
if (wildlifePointValid(x, y, a.userData.minTrail??.17, a.userData.maxSlope??Infinity)) return {x,y};
}
return {x:a.userData.homeX, y:a.userData.homeY};
}
function clampAnimalToDomain(a) {
const d = state.level.domain; a.userData.mapX = clamp(a.userData.mapX, d.xmin+.08, d.xmax-.08); a.userData.mapY = clamp(a.userData.mapY, d.ymin+.08, d.ymax-.08);
}
function placeGroundAnimal(a) {
const z = a.userData.fixedZ ?? state.level.terrain.f(a.userData.mapX, a.userData.mapY);
const point=threePoint(a.userData.mapX,a.userData.mapY,z,0);
point.y=(a.userData.fixedZ===undefined?terrainHeightAtWorld(point.x,point.z):threeElevation(z))+(a.userData.lift??.04);
a.position.copy(point);
}
function updateAnimalGraze(a, cur, dt, now, near) {
const parts = a.userData.parts || {};
if (near) {
a.rotation.y = dampAngle(a.rotation.y, wildlifeYaw(cur.x - a.userData.mapX, cur.y - a.userData.mapY), 1 - Math.exp(-dt/.25));
if (parts.head) parts.head.rotation.x = lerp(parts.head.rotation.x || 0, -.05, .15);
} else if (parts.head) parts.head.rotation.x = .24 + .22 * Math.sin(now*.0011 + a.userData.phase);
}
function updateAnimalPopper(a, cur, dt, now, near) {
placeGroundAnimal(a);
const cycle = 7.5 + 5.5 * hash2(a.userData.homeX, a.userData.homeY, state.level.seed);
const t = mod(now*.001 + a.userData.phase, cycle);
const up = near ? 0 : (t < .35 ? smoothstep(0,.35,t) : t < 3.6 ? 1 : t < 3.95 ? 1 - smoothstep(3.6,3.95,t) : 0);
const parts=a.userData.parts||{},visible=up>.05,rise=up*.34;
if(parts.body){parts.body.position.y=.23+rise;parts.body.visible=visible;}
if(parts.head){parts.head.position.y=.44+rise;parts.head.visible=visible;}
if(a.userData.shadow){
a.userData.shadow.visible=visible;
a.userData.shadow.material.opacity=.10*up;
}
a.visible=true;
}
function chooseAnimalEscapeWaypoint(a,cur,now) {
const d=state.level.domain;
const awayX=a.userData.mapX-cur.x,awayY=a.userData.mapY-cur.y;
const baseAngle=Math.hypot(awayX,awayY)>.015?Math.atan2(awayY,awayX):(a.userData.phase||0);
const radius=Math.max(.32,(a.userData.radius||.45)*.85);
for(const distanceScale of [1,.72]){
for(const angleOffset of [0,.48,-.48,.92,-.92,Math.PI]){
const angle=baseAngle+angleOffset;
const x=clamp(a.userData.mapX+Math.cos(angle)*radius*distanceScale,d.xmin+.09,d.xmax-.09);
const y=clamp(a.userData.mapY+Math.sin(angle)*radius*distanceScale,d.ymin+.09,d.ymax-.09);
if(wildlifePointValid(x,y,a.userData.minTrail??.17,a.userData.maxSlope??Infinity)){
a.userData.fleeWaypoint={x,y};
a.userData.fleeUntil=now+1200;
return a.userData.fleeWaypoint;
}
}
}
a.userData.fleeWaypoint=null;
a.userData.fleeUntil=now+450;
a.userData.fleeRetryAt=now+450;
return null;
}
function updateAnimalWanderer(a, cur, dt, now, darter=false) {
const near = Math.hypot(a.userData.mapX - cur.x, a.userData.mapY - cur.y) < .25;
if (!a.userData.waypoint || Math.hypot(a.userData.mapX - a.userData.waypoint.x, a.userData.mapY - a.userData.waypoint.y) < .04) a.userData.waypoint = chooseAnimalWaypoint(a);
let tx = a.userData.waypoint.x, ty = a.userData.waypoint.y;
let spd = a.userData.speed || .02;
const fleeActive=near||(a.userData.fleeWaypoint&&now<(a.userData.fleeUntil||0));
if(near&&(!a.userData.fleeWaypoint||now>=(a.userData.fleeUntil||0))&&now>=(a.userData.fleeRetryAt||0))chooseAnimalEscapeWaypoint(a,cur,now);
if(fleeActive){
if(a.userData.fleeWaypoint){tx=a.userData.fleeWaypoint.x;ty=a.userData.fleeWaypoint.y;spd*=1.55;}
else spd=0;
}else if(a.userData.fleeWaypoint){
a.userData.fleeWaypoint=null;
}
if (darter) { const burst = mod(now*.001 + a.userData.phase, 18) < 1.6 || near; spd = burst ? Math.max(spd, .070) : 0; }
const dx = tx - a.userData.mapX, dy = ty - a.userData.mapY, m = Math.hypot(dx,dy);
let moved=false;
if (m > 1e-4 && spd > 0) {
const step = Math.min(m, spd * dt);
const nextX=a.userData.mapX+dx/m*step,nextY=a.userData.mapY+dy/m*step;
if(wildlifePointValid(nextX,nextY,a.userData.minTrail??.17,a.userData.maxSlope??Infinity)){
a.userData.mapX=nextX;a.userData.mapY=nextY;clampAnimalToDomain(a);
moved=true;
}else{
a.userData.waypoint=null;
a.userData.fleeWaypoint=null;
a.userData.fleeRetryAt=now+450;
}
if(moved)a.rotation.y = dampAngle(a.rotation.y, wildlifeYaw(dx, dy), 1 - Math.exp(-dt/.25));
}
placeGroundAnimal(a);
const parts = a.userData.parts || {};
if (parts.legs?.length) {
const swing=moved?(darter ? .42 : .16)*Math.sin(now*.007+a.userData.phase):0;
parts.legs.forEach((leg,i)=>leg.rotation.x=lerp(leg.rotation.x||0,(i%2?1:-1)*swing,moved?.55:.22));
}
if (parts.head && !darter) parts.head.rotation.x = -0.12 + .10 * Math.sin(now*.0012 + a.userData.phase);
}
function updateAnimalFlyer(a, dt, now) {
const r = a.userData.flyRadius || 3.8, h = a.userData.flyHeight || 5.8;
const t = now*.00022 + a.userData.phase;
const mx = a.userData.homeX + Math.cos(t*TAU) * r * .18;
const my = a.userData.homeY + Math.sin(t*TAU) * r * .18;
const z = state.level.terrain.f(clamp(mx,state.level.domain.xmin,state.level.domain.xmax), clamp(my,state.level.domain.ymin,state.level.domain.ymax));
a.position.copy(threePoint(mx, my, z, h + (a.userData.lowCross ? Math.sin(t*2.2)*1.2 : 0)));
a.rotation.y = wildlifeYaw(-Math.sin(t*TAU), Math.cos(t*TAU)); a.rotation.z = clamp(-Math.sin(t*TAU)*.28, -.45, .45);
const parts = a.userData.parts || {}; const flap = Math.sin(now*.006 + a.userData.phase) * .25 * (mod(now*.001 + a.userData.phase, 8) < 2 ? 1 : .22);
if (parts.wingL) parts.wingL.rotation.z = flap; if (parts.wingR) parts.wingR.rotation.z = -flap;
}
function updateAnimalDrifter(a, dt, now) {
const drift = (a.userData.speed || .004) * dt;
a.userData.mapX += Math.cos(a.userData.phase) * drift; a.userData.mapY += Math.sin(a.userData.phase) * drift;
const waterZ = a.userData.fixedZ ?? state.level.terrain.f(-.1, .05) + 1.1;
a.position.copy(threePoint(a.userData.mapX, a.userData.mapY, waterZ, .12 + Math.sin(now*.0015+a.userData.phase)*.018));
a.rotation.y = a.userData.phase + Math.sin(now*.0007+a.userData.phase)*.25;
}
function hideWildlifeTag() {
clearTimeout(state.wildlifeTagTimer);
state.wildlifeTagTimer=null;
state.wildlifeTagExpiresAt=0;
state.wildlifeTagAnimal=null;

function wildlifeAnchorHit(clientX,clientY,maxPx=30) {
const appRect=el.app.getBoundingClientRect();
const x=clientX-appRect.left,y=clientY-appRect.top;
let best=null,bestDistance=maxPx;
for(const anchor of state.wildlifeAnchors||[]){
const distance=Math.hypot(anchor.x-x,anchor.y-y);
if(distance<bestDistance){bestDistance=distance;best=anchor;}
}
return best;
}

function positionWildlifeTag(anchor) {
if(!anchor||!el.wildlifeTag)return;
const appRect=el.app.getBoundingClientRect();
el.wildlifeTag.style.left=`${clamp(anchor.x,8,Math.max(8,appRect.width-170))}px`;
el.wildlifeTag.style.top=`${clamp(anchor.y,28,Math.max(28,appRect.height-8))}px`;
}

function showWildlifeTag(anchor,ms=0) {
if(!anchor||!el.wildlifeTag)return false;
clearTimeout(state.wildlifeTagTimer);
state.wildlifeTagTimer=null;
state.wildlifeTagAnimal=anchor.animal||null;
state.wildlifeTagExpiresAt=ms>0?performance.now()+ms:0;
el.wildlifeTag.textContent=WILDLIFE_DISPLAY_NAMES[anchor.species]||anchor.species;
positionWildlifeTag(anchor);
el.wildlifeTag.hidden=false;
if(ms>0)state.wildlifeTagTimer=setTimeout(hideWildlifeTag,ms);
return true;
}

function showWildlifeTagAtPointer(clientX,clientY,ms=0) {
if(!sceneIsFullView()||splitIsActive())return false;
const anchor=wildlifeAnchorHit(clientX,clientY,30);
if(!anchor){hideWildlifeTag();return false;}
return showWildlifeTag(anchor,ms);
}

function updateWildlifeHover(event) {
if(event.pointerType!=='mouse'||!sceneIsFullView()||splitIsActive()){hideWildlifeTag();return;}
const anchor=wildlifeAnchorHit(event.clientX,event.clientY,30);
if(anchor)showWildlifeTag(anchor,0);else hideWildlifeTag();
}

function updateWildlifeFrustumMetric() {
state.wildlifeAnchors=[];
if(!threeView.camera||!threeView.wildlife){hideWildlifeTag();return;}
threeView.camera.updateMatrixWorld(true);
const frustum=new THREE.Frustum();
const matrix=new THREE.Matrix4().multiplyMatrices(threeView.camera.projectionMatrix,threeView.camera.matrixWorldInverse);
frustum.setFromProjectionMatrix(matrix);
const point=new THREE.Vector3(),projected=new THREE.Vector3();
const sceneRect=el.sceneCanvas.getBoundingClientRect(),appRect=el.app.getBoundingClientRect();
const tagsEnabled=sceneIsFullView()&&!splitIsActive()&&!state.titleOpen;
let anyVisible=false;
for(const animal of threeView.wildlife.userData.animals||[]){
if(!animal.visible)continue;
animal.updateWorldMatrix(true,false);
animal.getWorldPosition(point);
point.y+=.28*Math.max(.7,animal.scale?.y||1);
const distance=threeView.camera.position.distanceTo(point);
const inFrustum=frustum.containsPoint(point);
if(inFrustum&&distance<145)anyVisible=true;
if(!tagsEnabled||!inFrustum||distance>=30)continue;
if(lineOfSightOcclusion(point,threeView.camera.position).pen>.45)continue;
projected.copy(point).project(threeView.camera);
if(projected.z<-1||projected.z>1||Math.abs(projected.x)>1||Math.abs(projected.y)>1)continue;
state.wildlifeAnchors.push({
animal,species:animal.userData.species,
x:sceneRect.left-appRect.left+(projected.x*.5+.5)*sceneRect.width,
y:sceneRect.top-appRect.top+(-projected.y*.5+.5)*sceneRect.height,
distance
});
}
if(state.wildlifeTagAnimal&&!el.wildlifeTag.hidden){
const active=state.wildlifeAnchors.find(anchor=>anchor.animal===state.wildlifeTagAnimal);
if(active)positionWildlifeTag(active);else hideWildlifeTag();
}
if(threeView.debug){
threeView.debug.wildlifeFrames=(threeView.debug.wildlifeFrames||0)+1;
if(anyVisible)threeView.debug.wildlifeVisibleFrames=(threeView.debug.wildlifeVisibleFrames||0)+1;
}
if(!tagsEnabled)hideWildlifeTag();
}

function updateWildlife3D(dt, now) {
if (!threeView.wildlife) return;
const cur = currentSample();
const calmInspection=state.cameraView==='side'&&sceneSupportsSideView();
for(const a of threeView.wildlife.userData.animals||[])if(a.userData.tier==='flyer')a.visible=!calmInspection;
if(!motionReduced()){
for (const a of threeView.wildlife.userData.animals || []) {
const tier = a.userData.tier;
const near = Math.hypot((a.userData.mapX ?? 99) - cur.x, (a.userData.mapY ?? 99) - cur.y) < .25;
if (tier === 'popper') updateAnimalPopper(a, cur, dt, now, near);
else if (tier === 'wanderer') updateAnimalWanderer(a, cur, dt, now, false);
else if (tier === 'darter') updateAnimalWanderer(a, cur, dt, now, true);
else if (tier === 'flyer') {
a.visible=!calmInspection;
if(a.visible)updateAnimalFlyer(a,dt,now);
}
else if (tier === 'drifter') updateAnimalDrifter(a, dt, now);
else { placeGroundAnimal(a); updateAnimalGraze(a, cur, dt, now, near); }
}
}
updateWildlifeFrustumMetric();
}

function fovForAspect(diagDeg, aspect) {
const tanDiag = Math.tan(diagDeg * Math.PI / 360);
const vTan = tanDiag / Math.sqrt(1 + aspect * aspect);
return clamp(2 * Math.atan(vTan) * 180 / Math.PI, 42, 86);
}

function updateThreeCamera(cur,dt,rig) {

if(side){

const outsideHeight=immersive?4.6:3.8;

}
const overhead=threeView.sideShotMode==='overhead';
const distance=(overhead?7.2:9)*aspectPull;

}else{

const height=immersive?4.85:3.75;
const ahead=immersive?7.2:5.6;
eye=ground.clone()
.addScaledVector(camForward,-distance)
.addScaledVector(right,.90)
.add(new THREE.Vector3(0,height,0));

.add(new THREE.Vector3(0,1.10+clamp(threeView.slopeLiftSmooth,-.15,.15)+tallHorizonLift,0))
.addScaledVector(camForward,ahead);

const sequence=threeView.cameraSequence;
let sequenceActive=false;

sequenceActive=true;
sequence.elapsed+=Math.min(dt,.10);
if(!sequence.fromEye){
const overview=trailOverviewBounds(),away=eye.clone().sub(overview.center);away.y=0;

}

const STAKE_EPS_FRAC = .040;
const ALIGNMENT_EPS_DEG = 8;
const STAKE_COLORS = ['#e6873c','#7a5fd0','#3c9d6e','#d05f8a','#4a90d9','#b8a23c','#d0563c','#5fb8c9'];
const MAX_STAKES = STAKE_COLORS.length;

function patrolEpsFrac() { return state.level?.epsFrac||STAKE_EPS_FRAC; }

function matchTrailItems(items, candidates, epsFrac=STAKE_EPS_FRAC) {
const N = state.samples.length;
const pairs = [];
items.forEach((item, itemIndex) => candidates.forEach((candidate, candidateIndex) => {
const frac = trailArcDistanceFrac(item.idx,candidate.i);
if (frac <= epsFrac) pairs.push({itemIndex, candidateIndex, frac});
}));
pairs.sort((a,b) => a.frac - b.frac);
const usedItems = new Set(), usedCandidates = new Set(), matches = [];
for (const pair of pairs) {
if (usedItems.has(pair.itemIndex) || usedCandidates.has(pair.candidateIndex)) continue;
usedItems.add(pair.itemIndex); usedCandidates.add(pair.candidateIndex); matches.push(pair);
}
return {
matches,
matchedItemIndices:[...usedItems],
matchedCandidateIndices:[...usedCandidates],
falseItemIndices:items.map((_,i)=>i).filter(i=>!usedItems.has(i)),
missedCandidateIndices:candidates.map((_,i)=>i).filter(i=>!usedCandidates.has(i))
};
}

function matchStakes(epsFrac=patrolEpsFrac()) {
const result = matchTrailItems(state.stakes, state.candidates, epsFrac);
result.matches = result.matches.map(m => Object.assign(m, {stake:state.stakes[m.itemIndex], candidate:state.candidates[m.candidateIndex]}));
return result;
}

function confirmedStakes(stakes=state.stakes) {
return stakes.filter(stake=>stake.verdict==='confirmed');
}

function candidateKindCounts(candidates=state.candidates) {
return {
nMax:candidates.filter(candidate=>candidate.kind==='high').length,
nMin:candidates.filter(candidate=>candidate.kind==='low').length
};
}

function guidedRunProgress(level=state.level,snapshot=null) {
if(!level||!GUIDED_LEVEL_IDS.includes(level.id))return 0;
if(!snapshot&&state.done&&state.progress.guidedCompleted[level.id])return 1;
let found=0;
if(snapshot){
const stakes=Array.isArray(snapshot.stakes)?snapshot.stakes:[];
found=stakes.filter(stake=>stake?.candidateKey&&stake.candidateKey!==snapshot.pendingCandidateKey).length;
}else{
found=confirmedStakes().length;
}
const total=Math.max(1,Number(level.expectedCandidates)||state.candidates.length||1);
return Number(clamp(Math.min(found,total)/total,0,1).toFixed(4));
}

function guidedCardProgress(level=state.level,snapshot=null) {
if(!level||!GUIDED_LEVEL_IDS.includes(level.id))return 0;
if(!snapshot)return state.progress.guidedCompleted[level.id]?1:0;
const stakes=Array.isArray(snapshot.stakes)?snapshot.stakes:[];
const found=stakes.filter(stake=>stake?.candidateKey&&stake.candidateKey!==snapshot.pendingCandidateKey).length;
const total=Math.max(1,Number(level.expectedCandidates)||state.candidates.length||1);
const candidateFraction=clamp(Math.min(found,total)/total,0,1);
const progress=level.goal?.kind==='critical-then-global'
?candidateFraction*.72+(snapshot.marksCorrect ? .18 : 0)
:candidateFraction*.9;
return Number(clamp(progress,0,.9).toFixed(4));
}

function guidedReadyToReport(level=state.level,snapshot=null) {
if(!level||!GUIDED_LEVEL_IDS.includes(level.id))return false;
const total=Math.max(1,Number(level.expectedCandidates)||state.candidates.length||1);
const found=snapshot
?(Array.isArray(snapshot.stakes)?snapshot.stakes:[]).filter(stake=>stake?.candidateKey&&stake.candidateKey!==snapshot.pendingCandidateKey).length
:confirmedStakes().length;
if(found<total)return false;
return level.goal?.kind!=='critical-then-global'||(snapshot?!!snapshot.marksCorrect:!!state.marksCorrect);
}

function patrolGoalSatisfied() {
const mission=state.level?.mission;
if(!mission)return false;
const confirmed=confirmedStakes();
if(mission.kind==='locate')return confirmed.some(stake=>guidedCandidateByKey(stake.candidateKey)?.kind===(mission.target==='min'?'low':'high'));
if(mission.kind==='tangency'||mission.kind==='alignment')return confirmed.length>=1;
if(mission.kind==='classify')return state.stakes.length===state.candidates.length&&state.stakes.every(stake=>stake.verdict==='confirmed');
if(mission.kind==='survey')return state.candidates.every(candidate=>candidate.claimedBy!=null)&&!!state.marksCorrect;
return false;
}

function objectiveReady() {
return state.runType==='patrol'?patrolGoalSatisfied():guidedReadyToReport();
}

function objectiveCandidateIndices() {
const claimed=new Set(confirmedStakes().map(stake=>stake.candidateKey));
if(state.runType!=='patrol')return state.candidates.map((candidate,index)=>({candidate,index})).filter(item=>!claimed.has(item.candidate.key)).map(item=>item.index);
const mission=state.level?.mission;
if(mission?.kind==='classify'){
return state.stakes.filter(stake=>stake.verdict==='pending').map(stake=>state.candidates.findIndex(candidate=>candidate.key===stake.candidateKey)).filter(index=>index>=0);
}
if(mission?.kind==='survey'&&state.phase!=='locate'){
const target=state.candidates.findIndex(candidate=>mission.rankKind==='max'?candidate.globalHigh:candidate.globalLow);
return target>=0?[target]:[];
}
return state.candidates.map((candidate,index)=>({candidate,index}))
.filter(item=>item.candidate.claimedBy==null&&!claimed.has(item.candidate.key))
.filter(item=>mission?.kind==='locate'?item.candidate.kind===(mission.target==='min'?'low':'high'):true)
.map(item=>item.index);
}

function goalChipText() {
const found=confirmedStakes().length,total=state.candidates.length;
const {nMax,nMin}=candidateKindCounts();
if(state.runType==='patrol'){
const mission=state.level?.mission,kind=mission?.kind;
if(kind==='locate'){
const targetKind=mission.target==='min'?'low':'high';
return fill(COPY[`p_goal_chip_locate_${mission.target}`],{found:Math.min(1,confirmedStakes().filter(stake=>guidedCandidateByKey(stake.candidateKey)?.kind===targetKind).length)});
}
if(kind==='tangency')return fill(COPY.p_goal_chip_tangency,{found:Math.min(1,found)});
if(kind==='alignment')return fill(COPY.p_goal_chip_alignment,{found:Math.min(1,found)});
if(kind==='classify')return fill(COPY.p_goal_chip_classify,{found,total});
if(kind==='survey'){
if(state.phase==='rank')return COPY[`p_goal_chip_survey_rank_${mission.rankKind}`];
return fill(COPY.p_goal_chip_survey_locate,{found:state.candidates.filter(candidate=>candidate.claimedBy!=null).length});
}
return '';
}
if(state.level?.id==='folds'){
const foundMax=confirmedStakes().filter(stake=>stake.claimType==='high').length;
const foundMin=confirmedStakes().filter(stake=>stake.claimType==='low').length;
return fill(COPY.t1_goal_chip,{foundMax,nMax,foundMin,nMin});
}
if(state.level?.id==='dome')return fill(COPY.t2_goal_chip,{found,total});
if(state.level?.id==='cinder')return fill(COPY.t3_goal_chip,{found,total});
if(state.level?.id==='mojave'){
if(state.phase==='rank')return fill(COPY.t4_goal_chip_p2,{
hi:state.stakes.some(stake=>stake.mark==='high')?'1/1':'0/1',
lo:state.stakes.some(stake=>stake.mark==='low')?'1/1':'0/1'
});
return fill(COPY.t4_goal_chip_p1,{found,total});
}
return '';
}

function updateStakeLedger() {
if (!el.stakeLedger) return;
if (!state.stakes.length) { if(el.stakeLedger.innerHTML)el.stakeLedger.innerHTML=''; return; }
const showElevation=!!currentInstruments().elevation;
const valueOnlyReadings=state.runType==='patrol'||state.level?.id==='mojave'||state.level?.id==='folds';
const html=state.stakes
.slice().sort((a,b)=>a.id-b.id)
.map(stake=>{
const sample=state.samples[stake.idx];
const gradNorm=sample?.gF?norm(sample.gF):NaN;
const hasReadings=showElevation&&(valueOnlyReadings||Number.isFinite(gradNorm));
const readings=hasReadings
?valueOnlyReadings
?`<span class="stakeReadings"><span>f = ${fmt(stake.z,1)}</span></span>`
:`<span class="stakeReadings"><span>f = ${fmt(stake.z,1)}</span><span class="stakeReadingDivider" aria-hidden="true">·</span><span>‖∇f‖ = ${fmt(gradNorm,1)}</span></span>`
:'';
const readingLabel=hasReadings
?valueOnlyReadings
?`; f equals ${fmt(stake.z,1)}`
:`; f equals ${fmt(stake.z,1)}; gradient norm equals ${fmt(gradNorm,1)}`
:'';
const verdict=stake.verdict==='confirmed'?' ✓':stake.verdict==='pending'?' ?':'';
const removable=!stake.locked&&(stake.verdict==='pending'||state.runType==='patrol');
const action=stake.verdict==='pending'?'review classification':removable?'remove stake':'confirmed stake';
return `<button class="flagNoteChip stakeChip ${stake.verdict||''}" style="--stake-color:${stake.color}" data-stake-id="${stake.id}" aria-label="Stake ${stake.slot}${readingLabel}; ${action}"><span class="stakeIdentity" style="--stake-color:${stake.color}">${stake.slot}</span>${readings}${verdict}${removable?`<span class="stakeRemove" data-stake-remove="${stake.id}" aria-hidden="true">×</span>`:''}</button>`;
}).join('');
if(el.stakeLedger.innerHTML!==html)el.stakeLedger.innerHTML=html;
}

function actionUiAllowed() { return !state.done && !state.titleOpen && !state.modalOpen; }

function closeGlobalLedger(clearArm=false) {
state.ledgerOpen=false;
if (clearArm) state.selectedMark=null;
if (el.globalLedgerSheet) el.globalLedgerSheet.hidden=true;
el.app?.classList.remove('ledger-sheet-open');
if (el.ledgerBtn) el.ledgerBtn.setAttribute('aria-expanded','false');
}

function renderGlobalLedger() {
if (!el.globalLedgerRows) return;
el.globalLedgerSheet.dataset.levelId=state.level?.id||'';
const ordered=state.stakes.slice().sort((a,b)=>a.id-b.id);
const reportReady=state.runType==='patrol'&&state.level?.mission?.kind==='survey'&&patrolGoalSatisfied();
const storyGlobalRanking=state.runType==='story'&&state.level?.goal?.kind==='critical-then-global';
if(el.globalLedgerActions)el.globalLedgerActions.hidden=storyGlobalRanking;
if(el.ledgerCloseBtn&&!storyGlobalRanking){
el.ledgerCloseBtn.textContent=reportReady?COPY.chrome_report:COPY.dismiss_label;
el.ledgerCloseBtn.dataset.action=reportReady?'report':'dismiss';
}
const showElevation=!!currentInstruments().elevation;
const mapAvailable=state.level?.views?.map!=='hidden';
const patrolRankTarget=state.runType==='patrol'&&state.level?.mission?.kind==='survey'
?(state.level.mission.rankKind==='max'?'high':'low')
:null;
const rankingControls=state.level?.flags==='stakes+globals'||!!patrolRankTarget;
const allCandidatesConfirmed=state.candidates.length>0&&confirmedStakes().length>=state.candidates.length;
const rankLocked=state.level?.goal?.kind==='critical-then-global'&&(!allCandidatesConfirmed||state.phase!=='rank');
const promptVisible=storyGlobalRanking&&rankLocked;
const footerVisible=rankingControls&&(!storyGlobalRanking||!rankLocked);
if(el.globalLedgerPrompt){
el.globalLedgerPrompt.hidden=!promptVisible;
el.globalLedgerPrompt.textContent=rankLocked?COPY.t4_report_phase1_missing:COPY.ledger_rank_prompt;
}
if(el.globalLedgerFooter){
el.globalLedgerFooter.hidden=!footerVisible;
const footerText=patrolRankTarget==='high'
?COPY.ledger_footer_max
:patrolRankTarget==='low'
?COPY.ledger_footer_min
:COPY.ledger_footer;
el.globalLedgerFooter.textContent=storyGlobalRanking&&!rankLocked
?`${COPY.ledger_rank_prompt} ${footerText}`
:footerText;
el.globalLedgerFooter.classList.toggle('storyRankingCopy',storyGlobalRanking&&!rankLocked);
}
if(el.globalLedgerInstructions)el.globalLedgerInstructions.hidden=!promptVisible&&!footerVisible;
if (!ordered.length) {
el.globalLedgerRows.innerHTML='<p class="ledgerEmpty">No stakes yet — plant one and it appears here.</p>';
return;
}
el.globalLedgerRows.innerHTML=ordered.map(stake=>{
const high=stake.mark==='high',low=stake.mark==='low';
const highArmed=state.selectedMark==='high'&&high;
const lowArmed=state.selectedMark==='low'&&low;
const status=stake.verdict==='pending'
?`<button class="ledgerClassifyBtn" type="button" data-ledger-classify="${stake.id}" aria-label="Classify stake ${stake.slot}">Classify</button>`
:`<span class="ledgerStatus${stake.verdict==='confirmed'?' confirmed':stake.verdict==='rejected'?' rejected':''}">${stake.verdict==='confirmed'?'✓':'•'}</span>`;
const locate=mapAvailable?`<button class="ledgerLocateBtn" type="button" data-ledger-locate="${stake.id}" title="Show on map" aria-label="Show on map">⌖</button>`:'';
const removable=!stake.locked&&(stake.verdict==='pending'||state.runType==='patrol');
const remove=removable?`<button class="ledgerRemoveBtn" type="button" data-ledger-remove="${stake.id}" aria-label="Remove this stake">✕</button>`:'';
const sample=state.samples[stake.idx];
const gradNorm=sample?.gF?norm(sample.gF):NaN;
const readings=state.runType==='story'&&!['folds','mojave'].includes(state.level?.id)&&showElevation&&!rankingControls&&Number.isFinite(gradNorm)
?`<span class="globalLedgerReadings"><span>f = ${fmt(stake.z,1)}</span><span class="globalLedgerReadingDivider" aria-hidden="true">·</span><span>‖∇f‖ = ${fmt(gradNorm,1)}</span><span class="globalLedgerReadingDivider" aria-hidden="true">·</span></span>`
:'';
const elevation=showElevation&&!readings?`<span class="globalLedgerElevation">f = ${fmt(stake.z,1)} m</span>`:'';
const highButton=!patrolRankTarget||patrolRankTarget==='high'
?`<button class="ledgerMarkBtn${highArmed?' armed':''}" type="button" data-ledger-mark="high" data-stake-id="${stake.id}" aria-pressed="${high}" ${rankLocked||stake.verdict!=='confirmed'?'disabled':''}>⛰</button>`
:'';
const lowButton=!patrolRankTarget||patrolRankTarget==='low'
?`<button class="ledgerMarkBtn${lowArmed?' armed':''}" type="button" data-ledger-mark="low" data-stake-id="${stake.id}" aria-pressed="${low}" ${rankLocked||stake.verdict!=='confirmed'?'disabled':''}>⛺</button>`
:'';
const marks=rankingControls
?`<span class="globalLedgerMarks">${highButton}${lowButton}</span>`
:readings;
const rowClass=readings?'withReadings':showElevation?'withElevation':'basic';
const spacer=rowClass==='basic'?'<span class="globalLedgerSpacer" aria-hidden="true"></span>':'';
return `<div class="globalLedgerRow ${rowClass}" data-ledger-stake="${stake.id}">
        <span class="stakeIdentity" style="--stake-color:${stake.color}">${stake.slot}</span>
        ${status}
        ${remove}${spacer}${elevation}${marks}${locate}
      </div>`;
}).join('');
}

function openGlobalLedger() {
if (!actionUiAllowed()) return;
if (state.ledgerOpen) { closeGlobalLedger(false); updateHud(); return; }
state.ledgerOpen=true;
renderGlobalLedger();
el.globalLedgerSheet.hidden=false;
el.app?.classList.add('ledger-sheet-open');
el.ledgerBtn.setAttribute('aria-expanded','true');
updateHud();
}

function locateStakeOnMap(id) {
const stake=state.stakes.find(item=>item.id===id);
if(!stake||state.level?.views?.map==='hidden')return false;
if(el.mapCanvas.classList.contains('inset')&&supportsViewSwap())setMode('map');
state.mapView.zoom=2;
state.mapView.allowOverflow=true;
state.mapView.cx=stake.x;
state.mapView.cy=stake.y;
closeGlobalLedger(false);
updateMapResetButton();
drawMap(el.mapCanvas);
noteInput();
return true;
}

function focusPatrolStake(id) {
if(state.runType!=='patrol')return false;
const stake=state.stakes.find(item=>item.id===id);
if(!stake)return false;
const alreadyThere=Math.abs(signedTrailDelta(state.pos,stake.idx,state.samples.length))<1.2;
closeGlobalLedger(false);
if(!alreadyThere)moveHikerToTrailIndex(stake.idx);
if(currentInstruments().elevation&&supportsViewSwap())setMode('scene');
if(alreadyThere&&stake.verdict==='pending')openPendingClassification(stake);
else updateHud();
return true;
}

function toggleLedgerMark(id,mark) {
if (!currentInstruments().elevation || state.level?.flags!=='stakes+globals' || !['high','low'].includes(mark)) return false;
if(state.level?.goal?.kind==='critical-then-global'&&state.phase!=='rank')return false;
const stake=state.stakes.find(item=>item.id===id);
if (!stake||stake.verdict!=='confirmed') return false;
if (stake.mark===mark) {
stake.mark=null;
if (state.selectedMark===mark) state.selectedMark=null;
} else {
for (const item of state.stakes) if (item.mark===mark) item.mark=null;
stake.mark=mark;
state.selectedMark=mark;
}
updateHud();
if (state.ledgerOpen) renderGlobalLedger();
evaluateGlobalMarks();
saveGuidedSnapshot();
return true;
}

function evaluateGlobalMarks() {
const highStake=state.stakes.find(stake=>stake.mark==='high');
const lowStake=state.stakes.find(stake=>stake.mark==='low');
state.marksCorrect=false;
if(!highStake||!lowStake||highStake.id===lowStake.id)return false;
const pair=`${highStake.candidateKey}|${lowStake.candidateKey}`;
const correct=globalMarksCorrect(matchStakes());
if(correct){
state.marksCorrect=true;
saveGuidedSnapshot({immediate:true});
if(state.runType==='story')showGuidedReportReady(COPY.t4_marks_right);
else showToast(COPY.t4_marks_right,4200);
}else if(!state.evaluatedMarkPairs.includes(pair)){
state.evaluatedMarkPairs.push(pair);
state.missCount++;
showToast(COPY.t4_marks_wrong,4200);
saveGuidedSnapshot();
}
updateHud();
if(state.ledgerOpen)renderGlobalLedger();
return correct;
}

function hintShadeReady(missed=matchStakes().missedCandidateIndices.length) {
return !!(missed>0&&state.hintTipShownAt!==null&&performance.now()-state.hintTipShownAt>=20000);
}

el.ledgerBtn.disabled=!allowed;

el.lowBadge.hidden=!globalGoal;

function placeStakeAtIndex(index, source='hiker', origin=null) {
if (!actionUiAllowed()) return false;
const N=state.samples.length;
const idx=mod(Math.round(index),N);
if(state.runType==='patrol'&&(state.level?.mission?.kind==='classify'||patrolGoalSatisfied()))return false;
const pending=state.stakes.find(stake=>stake.verdict==='pending');
if(pending){openPendingClassification(pending);return false;}
const eps=patrolEpsFrac();
const ranked=state.candidates
.map(candidate=>({candidate,distance:trailArcDistanceFrac(idx,candidate.i)}))
.sort((a,b)=>a.distance-b.distance);
const nearest=ranked[0];
const alignmentMission=state.level?.goal?.kind==='parallel-gradients'||state.level?.mission?.kind==='alignment';
const atLiveHiker=source==='hiker'&&Math.abs(signedTrailDelta(state.pos,index,N))<=1;
const alignmentSample=atLiveHiker?currentSample():state.samples[idx];
const gaugeSaysAligned=alignmentMission&&alignmentResidualDegrees(alignmentSample)<=ALIGNMENT_EPS_DEG;
const gaugeAligned=gaugeSaysAligned&&nearest?.distance<=2*eps;
if(nearest?.distance<=eps||gaugeAligned){
const duplicate=state.stakes.find(stake=>stake.candidateKey===nearest.candidate.key)||nearest.candidate.claimedBy!=null;
if(duplicate){showDismissibleToast(COPY.stake_duplicate);return false;}
if(state.runType==='patrol'){
const mission=state.level?.mission;
if(mission?.kind==='locate'){
const targetKind=mission.target==='min'?'low':'high';
if(nearest.candidate.kind!==targetKind){
state.missCount++;state.falseStakes=state.missCount;startRejectedStakeEffect(idx);
showDismissibleToast(mission.target==='min'?COPY.p_wrong_kind_min:COPY.p_wrong_kind_max);updateHud();return false;
}
}
}
return plantCandidateStake(nearest.candidate,source,origin);
}
state.missCount++;
state.falseStakes=state.missCount;
startRejectedStakeEffect(idx);
let feedback;
if(state.runType==='story'&&state.level?.id==='folds')feedback=COPY.t1_no_critical;
else if(state.level?.goal?.kind==='tangencies'||state.level?.mission?.kind==='tangency')feedback=COPY.t2_wrong;
else if(alignmentMission)feedback=gaugeSaysAligned?COPY.t3_aligned_not_critical:COPY.t3_wrong;
else if(nearest?.distance<=2*eps)feedback=COPY.stake_near;
else feedback=state.samples[idx].slopeForward>=0?COPY.stake_wrong_climb:COPY.stake_wrong_desc;
showDismissibleToast(feedback);
state.mapRipple=origin&&!motionReduced()?{x:origin.x,y:origin.y,startedAt:performance.now()}:state.mapRipple;
saveGuidedSnapshot();
noteInput();updateHud();
return false;
}

function plantCandidateStake(candidate,source='hiker',origin=null) {
if(!candidate||state.stakes.length>=MAX_STAKES)return false;
const used=new Set(state.stakes.map(stake=>stake.slot));
const slot=Array.from({length:MAX_STAKES},(_,i)=>i+1).find(value=>!used.has(value));
if(!slot)return false;
const sample=state.samples[candidate.i];
const asksType=state.runType==='story'&&state.level?.goal?.askType;
const stake={
id:state.nextStakeId++,slot,color:STAKE_COLORS[slot-1],idx:candidate.i,x:sample.x,y:sample.y,z:sample.z,
candidateKey:candidate.key,claimType:null,mark:null,
verdict:asksType?'pending':'confirmed',
alignmentDeg:alignmentAngleDegrees(sample),
alignmentResidualDeg:alignmentResidualDegrees(sample)
};
state.stakes.push(stake);
if(source==='map'&&origin&&!motionReduced())state.stakeAnimations.push({stakeId:stake.id,x:origin.x,y:origin.y,startedAt:performance.now()});
if(asksType){
state.pendingCandidateKey=candidate.key;
saveGuidedSnapshot({immediate:true});
updateHud();
openPendingClassification(stake);
return true;
}
candidate.claimedBy=stake.id;
afterStakeConfirmed(stake,candidate);
return true;
}

function answerPendingClassification(answer) {
const stake=state.stakes.find(item=>item.id===state.pendingStakeId&&item.verdict==='pending')||state.stakes.find(item=>item.verdict==='pending');
const candidate=stake&&guidedCandidateByKey(stake.candidateKey);
if(!stake||!candidate)return false;
if(answer!==candidate.kind){
state.typeMissCount++;
if(state.runType==='patrol'){state.missCount++;state.falseStakes=state.missCount;}
const feedback=el.modalActions.querySelector('.classificationFeedback');
if(feedback){
window.MathJax?.typesetClear?.([feedback]);
feedback.textContent=candidate.kind==='high'?COPY.t1_type_wrong_high:COPY.t1_type_wrong_low;

}
saveGuidedSnapshot();
return false;
}
stake.verdict='confirmed';
stake.claimType=answer;
stake.mark=null;
candidate.claimedBy=stake.id;
state.pendingCandidateKey=null;
state.pendingStakeId=null;
startStakeEffect('confirm',stake);

const found=confirmedStakes().filter(item=>item.claimType===answer).length;

const ready=guidedReadyToReport()?COPY.report_ready:'';
saveGuidedSnapshot({immediate:true});

showGuidedStakeSuccess(summary,ready);

}

function removeStakeById(id, refresh=true, userPickup=false) {
const index=state.stakes.findIndex(stake=>stake.id===id);
if(index<0)return false;
const stake=state.stakes[index];
const guidedLocked=state.runType==='story'&&stake.verdict==='confirmed';
const patrolLocked=state.runType==='patrol'&&!!stake.locked;
if(guidedLocked||patrolLocked){showToast(COPY.stake_locked,3900);return false;}
const candidate=guidedCandidateByKey(stake.candidateKey);
if(candidate&&candidate.claimedBy===stake.id)candidate.claimedBy=null;
state.stakes.splice(index,1);
state.stakeAnimations=state.stakeAnimations.filter(item=>item.stakeId!==id);
if(state.pendingCandidateKey===stake.candidateKey)state.pendingCandidateKey=null;
if(state.pendingStakeId===stake.id)state.pendingStakeId=null;
state.selectedMark=null;
state.marksCorrect=false;
if(userPickup)showToast(COPY.stake_packed);
saveGuidedSnapshot();
if(refresh)updateHud();
if (state.ledgerOpen) renderGlobalLedger();
return true;
}

function dismissToast({clearQueue=false,immediate=false}={}) {
clearTimeout(state.toastTimer);
state.toastTimer=null;
if(clearQueue)state.toastQueue.length=0;
state.toastActive=null;
el.toast.classList.remove('show','dismissible');
el.toastDismiss.hidden=true;
if(immediate){
window.MathJax?.typesetClear?.([el.toastMessage]);
el.toastMessage.textContent='';
return;
}
setTimeout(playNextToast,160);
}

function playNextToast() {
if (el.toast.classList.contains('show') || !state.toastQueue.length) return;
const item = state.toastQueue.shift();
state.toastActive=item;
window.MathJax?.typesetClear?.([el.toastMessage]);
el.toastMessage.textContent=item.msg;
el.toast.classList.toggle('dismissible',!!item.dismissible);
el.toastDismiss.hidden=!item.dismissible;
el.toast.classList.add('show');
if(window.MathJax?.typesetPromise)MathJax.typesetPromise([el.toastMessage]).catch(()=>{});
clearTimeout(state.toastTimer);
if(item.dismissible)return;
state.toastTimer = setTimeout(()=>{
dismissToast();
}, item.ms || 3000);
}

function showToast(msg, ms=3000) {
if(state.runType==='patrol'){
showDismissibleToast(msg);
return;
}
state.toastQueue.push({msg,ms,dismissible:true,kind:'toast'});
playNextToast();
}

function showDismissibleToast(msg) {
if(state.toastActive?.msg===msg||state.toastQueue.some(item=>item.msg===msg))return;
state.toastQueue.push({msg,dismissible:true,kind:'feedback'});
playNextToast();
}

function showHintToast(msg) {
if(state.toastActive?.kind==='hint'||state.toastQueue.some(item=>item.kind==='hint'))return;
state.toastQueue.push({msg,dismissible:true,kind:'hint'});
playNextToast();
}


function diagnosticForStake(stake,result) {
if(stake.verdict==='pending')return {kind:'pending',line:COPY.report_row_pending};
return {kind:'confirmed',line:COPY.report_row_confirmed};
}

function globalMarksCorrect(match) {
const highStake=state.stakes.find(s=>s.mark==='high');
const lowStake=state.stakes.find(s=>s.mark==='low');
if (!highStake || !lowStake) return false;
const highMatch=match.matches.find(m=>m.stake.id===highStake.id);
const lowMatch=match.matches.find(m=>m.stake.id===lowStake.id);
return !!(highMatch?.candidate.globalHigh && lowMatch?.candidate.globalLow);
}

function patrolIncompleteMessage() {
if(state.level?.mission?.kind==='classify')return `${COPY.p_report_incomplete} ${COPY.p_report_classify_ledger}`;
if(state.level?.mission?.kind!=='survey')return COPY.p_report_incomplete;
return state.candidates.some(candidate=>candidate.claimedBy==null)?COPY.p_survey_report_incomplete:COPY.p_survey_report_unmarked;
}

function reportCardBody(result) {
if(state.runType==='patrol'){
const history=state.missCount>0?`<p class="reportHistory">${fill(COPY.p_outcome_misses,{n:state.missCount})}</p>`:'';
return `<p class="reportMissed">${patrolIncompleteMessage()}</p>${history}`;
}
const rows=state.stakes.slice().sort((a,b)=>a.slot-b.slot).map(stake=>{
const diagnostic=diagnosticForStake(stake,result);
return `<div class="reportRow"><span class="stakeIdentity" style="--stake-color:${stake.color}">${stake.slot}</span><p>${diagnostic.line}</p></div>`;
}).join('');
const missed=Math.max(0,state.candidates.length-confirmedStakes().length);
const missedLine=missed===1?COPY.report_missing_one:missed>1?fill(COPY.report_missing_many,{n:missed}):'';
let globalLine='';
if (state.level?.goal?.kind==='critical-then-global') {
globalLine=state.phase!=='rank'?COPY.t4_report_phase1_missing:state.marksCorrect?'':COPY.t4_report_phase2_missing;
}
return `<div class="reportRows">${rows}</div>${missedLine?`<p class="reportMissed">${missedLine}</p>`:''}${globalLine?`<p class="reportGlobalRow">${globalLine}</p>`:''}`;
}

function showReportCard(result,onContinue) {
state.modalLocked=true;
showModal(COPY.ranger_report_title,reportCardBody(result),[
{label:state.runType==='patrol'?COPY.dismiss_label:COPY.continue_label,className:'miniBtn primary',onClick:()=>{state.modalLocked=false;closeModal(true);onContinue?.();}}
]);
}

function reportToRanger() {
if(state.done)return;
closeGlobalLedger(false);
state.reportCount++;
const result=matchStakes();
state.lastReport={result,falseCount:state.missCount};
updateHud();

if(state.runType==='patrol'){
if(!patrolGoalSatisfied()){
showReportCard(result,()=>updateHud());
return;
}
const elapsed=Math.max(0,(performance.now()-state.patrolStartedAt)/1000);
finishPatrol(result,elapsed);
return;
}

saveGuidedSnapshot({immediate:true});
if(guidedReadyToReport()){completeStoryLevel(true,result);return;}
showReportCard(result,()=>{
updateHud();
});
}

state.hintStage=2;

state.sceneDirty=true;

}

const key=state.runType==='patrol'?(state.level?.mission?.hintKey||state.level?.mission?.kind):state.level?.id;

function showHint() {
if(!actionUiAllowed())return false;
if(state.runType==='story'&&state.level?.goal?.kind==='critical-then-global'&&state.phase==='rank'){

updateHud();

state.hintStage=Math.max(state.hintStage,1);
showHintToast(strategyHintForCurrentLevel());
saveGuidedSnapshot();
updateHud();
return true;
}

function hashSeed(value) {
let h=2166136261>>>0;
for (const ch of String(value)) { h^=ch.charCodeAt(0); h=Math.imul(h,16777619); }
return h>>>0;
}




function mixSeed32(value) {
let x=(Number(value)>>>0)+0x9e3779b9;
x=Math.imul(x^(x>>>16),0x21f0aaad);
x=Math.imul(x^(x>>>15),0x735a2d97);
return (x^(x>>>15))>>>0;
}

function patrolGlobalExtremaInfo(built) {
const globalHigh=built.candidates.filter(candidate=>candidate.globalHigh);
const globalLow=built.candidates.filter(candidate=>candidate.globalLow);
return {
unique:globalHigh.length===1&&globalLow.length===1,
high:globalHigh[0]||null,
low:globalLow[0]||null
};
}

function alignmentGaugeRegionsClean(built,epsFrac=STAKE_EPS_FRAC) {
if(!built?.samples?.length||!built?.candidates?.length)return false;
const minGradient=Math.max(.25,built.maxGrad*.004);
const regular=built.candidates.filter(candidate=>{
const sample=built.samples[candidate.i];
return (candidate.kind==='high'||candidate.kind==='low')&&norm(sample.gF)>=minGradient;
});
if(!regular.length)return false;
return built.samples.every((sample,index)=>{
if(foldedAlignmentDegrees(sample.gF,sample.gG)>ALIGNMENT_EPS_DEG)return true;
if(norm(sample.gF)<minGradient)return false;
return regular.some(candidate=>trailArcDistanceFrac(index,candidate.i,built.samples)<=2*epsFrac);
});
}

function missionEligible(mission,built) {
if(!mission||!built?.candidates?.length)return false;
const id=mission.id||mission.kind;
const regular=built.candidates.filter(candidate=>{
const sample=built.samples[candidate.i];
return (candidate.kind==='high'||candidate.kind==='low')&&norm(sample.gF)>=Math.max(.25,built.maxGrad*.004);
});
const separated=regular.every((candidate,index)=>regular.slice(index+1).every(other=>
trailArcDistanceFrac(candidate.i,other.i,built.samples)>=2*STAKE_EPS_FRAC
));
if(!separated)return false;
if(mission.panels?.includes('angle')&&!alignmentGaugeRegionsClean(built,mission.epsFrac||STAKE_EPS_FRAC))return false;
if(id==='locate')return regular.some(candidate=>candidate.kind==='low')&&regular.some(candidate=>candidate.kind==='high');
if(id==='tangency'||id==='alignment')return regular.length>=1;
if(id==='classify')return regular.length>=2&&built.candidates.length===regular.length&&built.candidates.length<=MAX_STAKES;
if(id==='survey'){
const extrema=patrolGlobalExtremaInfo(built);
return built.candidates.length>=4&&built.candidates.length===regular.length&&built.candidates.length<=MAX_STAKES&&extrema.unique;
}
return false;
}

function selectPatrolMission(level,built,seed,{avoidMissionId=null}={}) {
const eligible=PATROL_MISSIONS.filter(mission=>missionEligible(mission,built));
if(!eligible.length)throw new Error(`[patrol] no eligible mission for seed ${seed}`);
const varied=eligible.length>1&&avoidMissionId
?eligible.filter(mission=>mission.id!==avoidMissionId)
:eligible;
const weighted=varied.flatMap(mission=>mission.id==='survey'?[mission,mission]:[mission]);
const template=weighted[hashSeed(`${seed}:mission`)%weighted.length];
return configurePatrolMission(level,template,seed);
}

function patrolLevelCandidate(seed,attempt) {
const attemptSeed=mixSeed32((seed^Math.imul(attempt+1,0x9e3779b1))>>>0);
const rng=seededRand(attemptSeed);
const families=['single','twin','three','ridge','basin'];
const family=families[Math.floor(rng()*families.length)];
let terrain;
if(family==='single')terrain=makeLonePeak({cx:lerp(-.8,.8,rng()),cy:lerp(-.8,.8,rng()),amp:lerp(70,115,rng()),s:lerp(.78,1.25,rng()),tx:lerp(-1.3,1.3,rng()),ty:lerp(-1.3,1.3,rng()),base:8});
else if(family==='twin')terrain=makeGaussianField({terms:[
{cx:lerp(-1.35,-.55,rng()),cy:lerp(.1,.85,rng()),amp:lerp(70,105,rng()),s:lerp(.72,1.0,rng())},
{cx:lerp(.55,1.35,rng()),cy:lerp(-.8,.25,rng()),amp:lerp(68,110,rng()),s:lerp(.70,1.02,rng())},
{cx:lerp(-.2,.2,rng()),cy:lerp(-.2,.2,rng()),amp:lerp(-22,-8,rng()),s:lerp(1.0,1.4,rng())}
],tx:lerp(-2.2,2.2,rng()),ty:lerp(-2.2,2.2,rng()),base:12});
else if(family==='three')terrain=makeGaussianField({terms:[
{cx:lerp(-1.15,-.55,rng()),cy:lerp(.2,.9,rng()),amp:lerp(78,110,rng()),s:lerp(.68,.98,rng())},
{cx:lerp(.55,1.2,rng()),cy:lerp(.15,.85,rng()),amp:lerp(65,95,rng()),s:lerp(.68,.98,rng())},
{cx:lerp(-.25,.35,rng()),cy:lerp(-1.15,-.55,rng()),amp:lerp(55,88,rng()),s:lerp(.68,1.0,rng())}
],tx:lerp(-1.6,1.6,rng()),ty:lerp(-1.6,1.6,rng()),base:10});
else if(family==='ridge')terrain=makePatrolRidge({theta:lerp(-1.1,1.1,rng()),ax:lerp(1.45,2.15,rng()),by:lerp(.38,.65,rng()),amp:lerp(68,96,rng()),cx:lerp(-.4,.4,rng()),cy:lerp(-.4,.4,rng()),tx:lerp(-3.5,3.5,rng()),ty:lerp(-3.5,3.5,rng()),base:10});
else terrain=makePatrolBasin({theta:lerp(-.8,.8,rng()),amp:lerp(-88,-58,rng()),ax:lerp(.9,1.4,rng()),by:lerp(.42,.78,rng()),cx:lerp(-.35,.35,rng()),cy:lerp(-.35,.35,rng()),ripple:lerp(4,9,rng()),ty:lerp(1.5,4.2,rng()),tx:lerp(-1.5,1.5,rng()),base:28});
const biomeChoices=[['tundra',SKY.tundra],['badlands',SKY.badlands],['cinder',SKY.cinder],['snowline',SKY.snowline],['mojave',SKY.mojave]];
// Keep environment choice independent of how many terrain parameters were sampled.
// A mixed hash avoids the first-output correlation that simple LCG seeds exhibit.
const environmentHash=hashSeed(`${seed}:${attempt}:environment`);
const [biome,baseSky]=biomeChoices[environmentHash%biomeChoices.length];
const variantNames=['day','dawn','dusk','sunset'];
const variant=variantNames[(environmentHash>>>8)%variantNames.length];
const environmentRng=seededRand(mixSeed32(environmentHash^0xa5a5a5a5));
const override=TIME_VARIANTS[variant];
const sky=Object.assign({},baseSky,override);
if(variant!=='day')sky.sunAzimuth=(override.sunAzimuth??baseSky.sunAzimuth??0)+lerp(-.42,.42,environmentRng());
if(variant==='sunset'){sky.backdropNear=SKY.sunset.backdropNear;sky.backdropFar=SKY.sunset.backdropFar;}
const trail=ellipseTrail({cx:lerp(-.16,.16,rng()),cy:lerp(-.16,.16,rng()),a:lerp(1.95,2.48,rng()),b:lerp(1.18,1.78,rng()),theta:lerp(-Math.PI/2,Math.PI/2,rng()),start:rng()*TAU});
return {
id:`patrol-${seed}-${attempt}`,name:'Ranger Patrol',subtitle:'',trailName:patrolTrailName(seed,attempt,biome),seed:(seed+attempt)>>>0,
terrain,trail,domain:commonDomain,contour:8,biome,variant,environmentKey:`${biome}-${variant}`,sky,reliefMult:.9,
views:{map:'main',scene:'inset'},
mapLayers:{terrainFill:false,contours:'neutral',contourLabels:false,currentFContour:false,currentFValue:false},
instruments:{elevation:false,gradFMap:true,gradGMap:true},panels:['dual'],toolKeys:['dual'],flags:'stakes'
};
}



function patrolCandidateValid(level,built) {
const N=built.samples.length,n=built.candidates.length;
if(n<2||n>6||built.maxGrad>260)return false;
for(let i=0;i<n;i++){
const candidate=built.candidates[i];
if(trailArcDistanceFrac(candidate.i,built.minGradIdx,built.samples)<.03)return false;
if(norm(built.samples[candidate.i].gF)<Math.max(.25,built.maxGrad*.004))return false;
for(let j=i+1;j<n;j++)if(trailArcDistanceFrac(candidate.i,built.candidates[j].i,built.samples)<.14)return false;
}
return true;
}


function makePatrolLevel(seed,options={}) {
for(let attempt=0;attempt<600;attempt++){

function seedPatrolSurvey() {
if(state.runType!=='patrol'||!state.level?.seedsSurvey)return false;
const surveyColor='#65706a';
const order=state.candidates.slice().sort((a,b)=>a.i-b.i);
for(const candidate of state.candidates)candidate.claimedBy=null;
let planted;
if(state.level.seedsSurvey==='all'){
planted=order.slice();
const rng=seededRand(hashSeed(`${state.patrolSeed}:classify-order`));
for(let i=planted.length-1;i>0;i--){
const j=Math.floor(rng()*(i+1));
[planted[i],planted[j]]=[planted[j],planted[i]];
}
if(planted.every((candidate,index)=>candidate===order[index]))planted.push(planted.shift());
}else{
const omitCount=Math.min(1+hashSeed(`${state.patrolSeed}:omit`)%2,state.candidates.length-2);
const target=state.candidates.find(candidate=>state.level.mission.rankKind==='max'?candidate.globalHigh:candidate.globalLow);
const trap=mixSeed32(hashSeed(`${state.patrolSeed}:trap:survey`))%2===0;
const preferred=trap
?target
:state.candidates.filter(candidate=>candidate!==target&&!candidate.globalHigh&&!candidate.globalLow)[hashSeed(`${state.patrolSeed}:decoy`)%Math.max(1,state.candidates.filter(candidate=>candidate!==target&&!candidate.globalHigh&&!candidate.globalLow).length)]||
state.candidates.filter(candidate=>candidate!==target)[hashSeed(`${state.patrolSeed}:decoy-fallback`)%Math.max(1,state.candidates.length-1)];
const omitted=[preferred];
const pool=state.candidates.filter(candidate=>!omitted.includes(candidate)&&(trap?candidate.kind!==target.kind:candidate!==target));
pool.sort((a,b)=>hashSeed(`${state.patrolSeed}:fill:${a.key}`)-hashSeed(`${state.patrolSeed}:fill:${b.key}`));
while(omitted.length<omitCount&&pool.length)omitted.push(pool.shift());
planted=order.filter(candidate=>!omitted.includes(candidate));
}
state.stakes=planted.map((candidate,index)=>{
const sample=state.samples[candidate.i];
const id=index+1;
candidate.claimedBy=id;
return {
id,slot:id,color:surveyColor,idx:candidate.i,x:sample.x,y:sample.y,z:sample.z,
candidateKey:candidate.key,claimType:null,mark:null,
verdict:state.level.seedsSurvey==='all'?'pending':'confirmed',locked:true,survey:true,
alignmentDeg:alignmentAngleDegrees(sample),
alignmentResidualDeg:alignmentResidualDegrees(sample)
};
});
state.nextStakeId=state.stakes.length+1;
state.phase='locate';
state.selectedMark=null;
state.marksCorrect=false;
state.sceneDirty=true;
updateHud();
return true;
}

function runPatrolFuzz(count) {
let failures=0,min=Infinity,max=-Infinity,wildlifeReady=0;
const pairs=new Set(),missions=new Set(),rankKinds=new Set();
const failureDetails=[];
for(let i=0;i<count;i++){
const level=makePatrolLevel(hashSeed(`fuzz-${i}`));
const built=buildSamples(level);min=Math.min(min,built.candidates.length);max=Math.max(max,built.candidates.length);
const validTerrain=patrolCandidateValid(level,built);
const validMission=missionEligible(level.mission,built);
if(!validTerrain||!validMission){
failures++;
if(failureDetails.length<8)failureDetails.push(`${i}:${level.mission?.kind||'none'} terrain=${validTerrain} mission=${validMission}`);
}
if(['tundra','badlands','cinder','snowline','mojave'].includes(level.biome))wildlifeReady++;
pairs.add(level.environmentKey);
missions.add(level.mission?.kind);
if(level.mission?.kind==='survey')rankKinds.add(level.mission.rankKind);
}
const requiredDiversity=count>=200?PATROL_MISSIONS.length:count>=20?4:Math.min(count,1);
const diversityFailure=missions.size<requiredDiversity;
console.info(`[patrolfuzz] ${count} runs; missions ${Array.from(missions).sort().join(', ')}; candidate range ${min}–${max}; validation failures ${failures}; environment pairs ${pairs.size}; wildlife rosters ${wildlifeReady}/${count}; rank targets ${Array.from(rankKinds).sort().join('/')||'none'}`);
if(failures||diversityFailure){
const detail=failureDetails.length?`; ${failureDetails.join(' | ')}`:'';
throw new Error(`[patrolfuzz] ${failures} impossible mission(s); diversity ${missions.size}/${requiredDiversity}${detail}`);
}
return {count,failures,missionCount:missions.size,missions:[...missions],environmentPairs:pairs.size,rankKinds:[...rankKinds]};
}


function signedTrailDelta(from, to, N) {
const f = mod(to - from, N), b = mod(from - to, N);
return f <= b ? f : -b;
}

function updateMotion(dt) {
const N = state.samples.length;
const cur = currentSample();
const slopeIntensity = Math.abs(cur.slopeForward) / Math.max(1, (state.zMax - state.zMin) * .22);
const maxSpeed = N / 11 / (1 + .35 * slopeIntensity);
if (state.dragTarget !== null) {
const delta = signedTrailDelta(state.pos, state.dragTarget, N);
if (Math.abs(delta) < 1.2) {
state.pos = mod(state.dragTarget, N);
state.dragTarget = state.draggingHiker ? state.dragTarget : null;
state.vel = 0;
markVisited();
return;
}
const dragSpeed=state.mapGesture?.type==='trail'?N/3.7:maxSpeed*2.2;
const step = clamp(delta, -dragSpeed * dt, dragSpeed * dt);
state.pos = mod(state.pos + step, N);
state.vel = dt > 0 ? step / dt : 0;
if (Math.abs(delta) > .5) state.lastDir = Math.sign(delta) || state.lastDir;
markVisited();
return;
}
const accel = N / 7;
const input = Math.abs(state.controlDir) < .001 ? 0 : clamp(state.controlDir, -1, 1);
if (input !== 0) {
noteInput();
state.lastDir = Math.sign(input);
state.vel += input * accel * dt;
} else {
state.vel *= Math.pow(.08, dt);
if (Math.abs(state.vel) < .02) state.vel = 0;
}
const cap = maxSpeed * (input ? Math.max(.01,Math.abs(input)) : 1);
state.vel = clamp(state.vel, -cap, cap);
state.pos = mod(state.pos + state.vel * dt, N);
markVisited();
}

function nudgeWalk(dir, e) {

}

function scrubFromEvent(e) {
if (!actionUiAllowed()) return;
dismissMovementCoach();
const r=el.walkTrack.getBoundingClientRect(), center=r.left+r.width/2;
const value=clamp((e.clientX-center)/Math.max(1,r.width/2),-1,1);

if (state.controlDir) state.lastDir=Math.sign(state.controlDir);
state.dragTarget=null; updateScrubThumb(value); noteInput();
}

function trailPositionAtDistance(distance) {
const samples=state.samples,total=samples.totalDist,N=samples.length;
const target=mod(distance,total);
let lo=0,hi=N-1;
while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(samples[mid].dist<=target)lo=mid;else hi=mid-1;}
const i=lo,next=mod(i+1,N);
const start=samples[i].dist,end=next===0?total:samples[next].dist;
const frac=clamp((target-start)/Math.max(1e-9,end-start),0,1);
return i+frac;
}

function advanceAlongTrailFraction(dir,fraction=.0015) {
dismissMovementCoach();
const current=currentSample().dist;
state.pos=mod(trailPositionAtDistance(current+dir*state.samples.totalDist*fraction),state.samples.length);
state.vel=0;state.dragTarget=null;state.controlDir=0;state.lastDir=dir;markVisited();noteInput();
}

function jumpToTrailhead() {
state.pos=0;state.vel=0;state.dragTarget=null;state.controlDir=0;state.keyWalk={active:false,dir:0,start:0};state.lastDir=1;markVisited();noteInput();
}

function beginKeyWalk(dir) {
if(!actionUiAllowed())return;
startPlaying();
if(state.keyWalk.active&&state.keyWalk.dir===dir)return;
advanceAlongTrailFraction(dir,.0015);
state.keyWalk={active:true,dir,start:performance.now()};
updateScrubThumb(dir*.15);
}

function updateKeyboardWalk(now) {
const key=state.keyWalk;
if(!key?.active)return;
if(!actionUiAllowed()){state.keyWalk={active:false,dir:0,start:0};state.controlDir=0;updateScrubThumb(0);return;}
const elapsed=(now-key.start)/1000;
if(elapsed<.18){state.controlDir=0;return;}
const multiplier=lerp(.15,1,clamp((elapsed-.18)/1.1,0,1));
state.controlDir=key.dir*multiplier;
state.lastDir=key.dir;
updateScrubThumb(state.controlDir);
}

function endKeyWalk(dir) {
if(!state.keyWalk.active||state.keyWalk.dir!==dir)return;
state.keyWalk={active:false,dir:0,start:0};
state.controlDir=0;state.vel=0;updateScrubThumb(0);noteInput();
}

function nearestSampleIndex(x, y) {
let best=0,bestD=Infinity;
for (let i=0;i<state.samples.length;i++) {
const sample=state.samples[i],d=(sample.x-x)**2+(sample.y-y)**2;
if (d<bestD) {bestD=d;best=i;}
}
return best;
}

function nearestScreenSample(px,py,rect) {
let best=0,bestD=Infinity;
for (let i=0;i<state.samples.length;i+=2) {
const sample=state.samples[i],point=mapToScreen(sample.x,sample.y,rect),d=(point.x-px)**2+(point.y-py)**2;
if (d<bestD) {bestD=d;best=i;}
}
return {idx:best,distPx:Math.sqrt(bestD)};
}

function nearestStakeOnScreen(px,py,rect,maxPx=24) {

for (const stake of state.stakes) {
const point=mapToScreen(stake.x,stake.y,rect),d=Math.hypot(point.x-px,point.y-py);
if (d<bestD) {bestD=d;best=stake;}
}
return best;
}

function mapGestureKind({hiker,stake,nearTrail}) { return hiker?'hiker':(!stake&&nearTrail&&stakingAvailable()?'trail':'tap'); }

function updateMapHoverSnap(event) {
if(!fineHoverPointer(event)||!actionUiAllowed()||!stakingAvailable()||el.mapCanvas.classList.contains('inset')||el.mapCanvas.classList.contains('view-hidden')||state.mapGesture){state.mapHoverSnap=null;return;}
const geometry=mapEventGeometry(event);
if(!geometry.inside){state.mapHoverSnap=null;return;}
const nearest=nearestScreenSample(geometry.x,geometry.y,geometry.rect);
state.mapHoverSnap=nearest.distPx<=14?{idx:nearest.idx,x:geometry.x,y:geometry.y}:null;
}

function beginMapPinch() {
if(state.mapPointers.size<2||el.mapCanvas.classList.contains('inset'))return false;
const points=Array.from(state.mapPointers.entries()).slice(0,2);
const a=points[0][1],b=points[1][1];
const canvasRect=el.mapCanvas.getBoundingClientRect(),rect=plotRect(el.mapCanvas,canvasRect.width,canvasRect.height);
const midClientX=(a.x+b.x)/2,midClientY=(a.y+b.y)/2;
const midX=midClientX-canvasRect.left,midY=midClientY-canvasRect.top;
if(midX<rect.x||midX>rect.x+rect.w||midY<rect.y||midY>rect.y+rect.h)return false;
state.draggingHiker=false;state.dragTarget=null;
state.mapGesture={
type:'pinch',ids:[points[0][0],points[1][0]],startDist:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
startZoom:state.mapView.zoom,anchorMap:screenToMap(midX,midY,rect)
};
return true;
}

function updateMapPinch() {
const gesture=state.mapGesture;
if(gesture?.type!=='pinch')return;
const a=state.mapPointers.get(gesture.ids[0]),b=state.mapPointers.get(gesture.ids[1]);
if(!a||!b)return;
const canvasRect=el.mapCanvas.getBoundingClientRect(),rect=plotRect(el.mapCanvas,canvasRect.width,canvasRect.height);
const midX=(a.x+b.x)/2-canvasRect.left,midY=(a.y+b.y)/2-canvasRect.top;
const distance=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
const zoom=clamp(gesture.startZoom*distance/gesture.startDist,1,4);
const d=state.level.domain,qx=(midX-rect.x)/Math.max(1,rect.w),qy=(midY-rect.y)/Math.max(1,rect.h);
const spanX=(d.xmax-d.xmin)/zoom,spanY=(d.ymax-d.ymin)/zoom;
state.mapView.zoom=zoom;
state.mapView.cx=gesture.anchorMap.x-(qx-.5)*spanX;
state.mapView.cy=gesture.anchorMap.y-(.5-qy)*spanY;
clampMapView();captureMapFollowAnchor(rect);updateMapResetButton(rect,el.mapCanvas);noteInput();
}

function moveHikerToTrailIndex(index) {
if(!actionUiAllowed())return false;
dismissMovementCoach();
const N=state.samples.length,idx=mod(Math.round(index),N);
const direction=Math.sign(signedTrailDelta(state.pos,idx,N));
startPlaying();stopForAction();
state.pos=idx;
state.lastDir=direction||state.lastDir;
state.cameraSnap=true;
state.sceneDirty=true;
state.probe=null;
markVisited();
noteInput();
updateHud();
return true;
}

function performMapTap(data) {
if(!data?.inside)return;
if(data.split){setMode('map');return;}
if(data.stakeId){
if(!assignMarkToStake(data.stakeId))removeStakeById(data.stakeId,true,true);
noteInput();return;
}
if(data.nearTrail&&stakingAvailable()){
moveHikerToTrailIndex(data.trailIdx);return;
}
if(stakingAvailable()){
state.mapRipple=motionReduced()?null:{x:data.x,y:data.y,startedAt:performance.now()};
state.missedTapToastShown=true;
showDismissibleToast(COPY.map_tap_help);
}
if(!currentMapLayers().currentFValue){state.probe=null;return;}
state.probe=screenToMap(data.x,data.y,data.rect);
clearTimeout(state.probeTimer);
state.probeTimer=setTimeout(()=>{state.probe=null;},4200);
}

function queueMapTap(data,pointerType) {
if(pointerType!=='touch'){performMapTap(data);return;}
const now=performance.now(),last=state.mapLastTap;
if(last&&now-last.time<320&&Math.hypot(data.clientX-last.clientX,data.clientY-last.clientY)<28){
clearTimeout(state.mapTapTimer);state.mapTapTimer=null;state.mapLastTap=null;
const target=(state.mapView.zoom||1)>1.05?1:2.5;
setMapZoomAbout(data.x,data.y,data.rect,target);
noteInput();return;
}
state.mapLastTap={time:now,clientX:data.clientX,clientY:data.clientY};
clearTimeout(state.mapTapTimer);
state.mapTapTimer=setTimeout(()=>{state.mapTapTimer=null;state.mapLastTap=null;performMapTap(data);},260);
}

state.started=true;
if (state.titleOpen) closeTitle();
}

state.dragTarget=null; state.draggingHiker=false; state.vel=0; state.controlDir=0; state.scrubPointer=null; state.mapHoverSnap=null; updateScrubThumb(0);
}

el.mapCanvas.addEventListener('pointerdown',event=>{
if(el.mapCanvas.classList.contains('view-hidden'))return;
event.preventDefault();
if(el.mapCanvas.classList.contains('inset')&&supportsViewSwap()){
setMode(splitLayoutUsable()?'split':'map');noteInput();return;
}
const geometry=mapEventGeometry(event);
state.mapHoverSnap=null;
state.mapPointers.set(event.pointerId,{x:event.clientX,y:event.clientY,pointerType:event.pointerType});
try{el.mapCanvas.setPointerCapture(event.pointerId);}catch{}
if(state.mapPointers.size>=2&&beginMapPinch())return;
if(!geometry.inside){state.mapGesture={type:'tap',id:event.pointerId,inside:false};return;}
const nearest=nearestScreenSample(geometry.x,geometry.y,geometry.rect),cur=currentSample(),hikerPoint=mapToScreen(cur.x,cur.y,geometry.rect);
const stake=nearestStakeOnScreen(geometry.x,geometry.y,geometry.rect);
const hiker=Math.hypot(geometry.x-hikerPoint.x,geometry.y-hikerPoint.y)<34;
const nearTrail=nearest.distPx<=14;
const split=el.mapCanvas.classList.contains('split-map');
state.mapGesture={
type:mapGestureKind({hiker,stake,nearTrail}),id:event.pointerId,pointerType:event.pointerType,inside:true,split,
startX:event.clientX,startY:event.clientY,lastX:event.clientX,lastY:event.clientY,moved:false,
rect:geometry.rect,x:geometry.x,y:geometry.y,clientX:event.clientX,clientY:event.clientY,
stakeId:stake?.id||0,nearTrail,trailIdx:nearest.idx,
canPan:!hiker&&!stake&&!nearTrail&&(state.mapView.zoom||1)>1
};
if(hiker){
dismissMovementCoach();startPlaying();noteInput();state.draggingHiker=true;
const mapPoint=screenToMap(geometry.x,geometry.y,geometry.rect);state.dragTarget=nearestSampleIndex(mapPoint.x,mapPoint.y);state.probe=null;
}
});

el.mapCanvas.addEventListener('pointermove',event=>{
if(state.mapPointers.has(event.pointerId))state.mapPointers.set(event.pointerId,{x:event.clientX,y:event.clientY,pointerType:event.pointerType});
if(state.mapPointers.size>=2){event.preventDefault();if(state.mapGesture?.type!=='pinch')beginMapPinch();updateMapPinch();return;}
const gesture=state.mapGesture;
if(!gesture||gesture.id!==event.pointerId){updateMapHoverSnap(event);return;}
event.preventDefault();
const dx=event.clientX-gesture.lastX,dy=event.clientY-gesture.lastY;
gesture.lastX=event.clientX;gesture.lastY=event.clientY;
if(Math.hypot(event.clientX-gesture.startX,event.clientY-gesture.startY)>=6)gesture.moved=true;
const geometry=mapEventGeometry(event);
if(gesture.type==='hiker'){
const mapPoint=screenToMap(clamp(geometry.x,geometry.rect.x,geometry.rect.x+geometry.rect.w),clamp(geometry.y,geometry.rect.y,geometry.rect.y+geometry.rect.h),geometry.rect);
state.dragTarget=nearestSampleIndex(mapPoint.x,mapPoint.y);noteInput();return;
}
if(gesture.type==='trail'&&gesture.moved){
dismissMovementCoach();
const nearest=nearestScreenSample(clamp(geometry.x,geometry.rect.x,geometry.rect.x+geometry.rect.w),clamp(geometry.y,geometry.rect.y,geometry.rect.y+geometry.rect.h),geometry.rect);
state.dragTarget=nearest.idx;state.probe=null;startPlaying();noteInput();return;
}
if(gesture.canPan&&gesture.moved){gesture.type='pan';panMapByPixels(dx,dy,geometry.rect);state.probe=null;noteInput();}
});

const endMapGesture=event=>{
const gesture=state.mapGesture;
state.mapPointers.delete(event.pointerId);
if(gesture?.type==='pinch'){
if(state.mapPointers.size<2)state.mapGesture=null;
try{el.mapCanvas.releasePointerCapture(event.pointerId);}catch{}
return;
}
if(!gesture||gesture.id!==event.pointerId)return;
state.mapGesture=null;
if(gesture.type==='hiker'){
state.draggingHiker=false;state.dragTarget=null;state.vel*=.2;noteInput();
}else if(gesture.type==='trail'&&gesture.moved){
state.dragTarget=null;state.vel*=.2;noteInput();
}else if(!gesture.moved&&gesture.type!=='pan'){
queueMapTap(gesture,gesture.pointerType);
}
try{el.mapCanvas.releasePointerCapture(event.pointerId);}catch{}
};
const cancelMapGesture=event=>{
const active=state.mapGesture?.id===event.pointerId||state.mapGesture?.type==='pinch';
state.mapPointers.delete(event.pointerId);
if(!active)return;
state.mapGesture=null;
if(state.draggingHiker||state.dragTarget!==null){state.draggingHiker=false;state.dragTarget=null;state.vel*=.2;}
state.mapHoverSnap=null;state.mapRipple=null;
try{el.mapCanvas.releasePointerCapture(event.pointerId);}catch{}
};
