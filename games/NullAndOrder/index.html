<style>
:root{--font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#1b2028;--paper:#e9edf2;--card:#fffdf7;--ink:#101722;--muted:#465366;--line:#111722;
 --gold:#d7b76c;--gold2:#f6e7bf;--teal:#d8ebe8;--teal2:#b3dbd3;--rose:#efd9e1;--rose2:#e8bccb;--green:#dcebe4;--greenInk:#1f5b4f;--wine:#f3d6dd;--wineInk:#8a2940;
 --manila:#efd9a6;--manila2:#f8ecce;--suspectBlue:#c4d9f0;--focus:#254c79;--head:linear-gradient(100deg,#265c8c,#4c5b86 52%,#8f3c55);--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:12px;min-height:100vh;color:var(--ink);font:500 16px/1.45 var(--font);background:
 radial-gradient(circle at 14% 12%,rgba(200,164,101,.16) 0 10rem,transparent 10.2rem),radial-gradient(circle at 86% 88%,rgba(135,83,93,.16) 0 11rem,transparent 11.2rem),linear-gradient(145deg,#171b22,#212732 45%,#151920)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nw{white-space:nowrap}
/* nav */
#allGamesNav{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1240px;margin:0 auto 12px}
body.inShift #allGamesNav{display:none}
body.inShift{height:100dvh;min-height:0;overflow:hidden}
#allGamesLink,#infoBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border:2px solid var(--line);background:#fbf8f2;color:var(--ink);box-shadow:0 3px 0 var(--line);font:800 14px/1 var(--font);text-decoration:none;cursor:pointer}
#allGamesLink{padding:0 15px;border-radius:12px}
#allGamesLink svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#infoBtn{width:44px;border-radius:50%;font-size:22px;font-weight:1000;color:#a33447}
#allGamesLink:active,#infoBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.game{max-width:1240px;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:24px;box-shadow:0 22px 48px rgba(0,0,0,.3);overflow:clip}
body.inShift .game{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
/* buttons */
.btn{appearance:none;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);font:900 15px/1.1 var(--font);padding:11px 18px;min-height:46px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.gold{background:var(--gold)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--line)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line)}
.fine{font-size:12px;color:var(--muted);font-weight:700}
.fine a{color:var(--focus)}
/* landing (original structure) */
.landingTop{position:relative;padding:18px 20px 16px;color:#fff;border-bottom:2px solid var(--line);background:var(--head)}
.landingTop{overflow:hidden;padding-right:110px}
.bannerArt{position:absolute;right:22px;top:50%;height:50px;width:auto;transform:translateY(-50%);pointer-events:none}
@media (max-width:480px){.landingTop{padding-right:84px}.bannerArt{right:14px;height:42px}}
@media (max-width:360px){.landingTop{padding-right:64px}.bannerArt{right:10px;height:34px}}
.landingTop h1{margin:0;font-size:clamp(28px,3.2vw,38px);line-height:1;font-weight:1000;letter-spacing:-.045em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.landingTop .desc{margin:8px 0 0;font-size:14px;line-height:1.35;font-weight:800;max-width:780px}
.landingTop .coverage{margin:6px 0 0;font-size:12px;font-weight:600;opacity:.92}
.startScreen{display:grid;place-items:start center;padding:18px 14px 22px}
.startStack{width:min(900px,100%);display:grid;gap:12px}
.referenceStack{overflow:hidden}
.referenceStack details+details{border-top:2px solid var(--line)}
.referenceStack summary{display:flex;gap:10px;align-items:center;padding:12px 15px;font-size:16px;font-weight:1000;cursor:pointer;list-style:none;background:#f8f5ec}
.referenceStack summary::-webkit-details-marker{display:none}
.referenceStack summary::before{content:"▸";color:#5e6778;font-size:18px;transition:transform .15s}
.referenceStack details[open]>summary::before{transform:rotate(90deg)}
.refBody{padding:12px 15px 14px;border-top:1px solid rgba(17,23,34,.18)}
.goalList{margin:0;padding-left:20px;color:#394354;font-size:14px;line-height:1.4;font-weight:700}
.refIntro{margin:0 0 8px;font-size:13px;line-height:1.4;font-weight:600;color:#465366}
.refTable{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.4}
.refTable th,.refTable td{padding:6px 8px;border-top:1px solid rgba(17,23,34,.16);text-align:left;vertical-align:top}
.refTable th{width:9.5em;font-weight:900;white-space:nowrap}
.refTable td{font-weight:600;color:#2e3746}
@media (max-width:560px){.refTable th,.refTable td{display:block;width:auto;border-top:0;padding:0 2px}.refTable th{padding-top:8px;border-top:1px solid rgba(17,23,34,.16)}.refTable td{padding-bottom:4px}}
.startHead{padding:12px 18px;border-bottom:2px solid var(--line);background:var(--gold)}
.startHead h2{margin:0;font-size:30px;line-height:1;font-weight:1000;letter-spacing:-.05em}
.startBody{padding:14px 16px}
.howPlaySteps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.howPlaySteps li{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fbf8f1}
.howPlaySteps .n{display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);border-radius:50%;background:var(--gold2);font-weight:1000;font-size:13px}
.howPlaySteps strong{display:block;font-size:13.5px;line-height:1.28}
.howPlaySteps small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35;font-weight:700}
.startBottomGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.recordCard,.launchCard{padding:14px;background:linear-gradient(145deg,#fffaf0,#f6e7bf)}
.recordCard h2,.launchCard h2{margin:0 0 10px;font-size:19px;line-height:1;font-weight:1000;letter-spacing:-.03em}
.launchCard{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.launchCard p{margin:0;color:#5c4c2d;font-size:14px;font-weight:800}
.startBtn{width:100%;min-height:58px;font-size:22px;box-shadow:0 5px 0 var(--line)}
.recordFacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.recordFacts>div{padding:9px 10px;border:2px solid var(--line);border-radius:12px;background:#fbf8f1}
.recordFacts span{display:block;font:900 10.5px/1.1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#6a7383}
.recordFacts strong{display:block;margin-top:5px;font-size:13px;line-height:1.25;font-weight:900}
.rankBadge{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fffaf0}
.rankBadge small{display:block;font:900 10.5px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:#6a7383}
.rankBadge strong{display:block;margin-top:3px;font-size:17px;line-height:1.15;font-weight:1000}
.rankInsignia{width:48px;height:38px;flex:0 0 48px;display:flex;align-items:center;justify-content:center;color:var(--line)}
.rankInsignia svg{width:100%;height:100%}
.insigniaChevron{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.insigniaPip,.insigniaCrown{fill:var(--gold);stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}
.insigniaCrownDetail{fill:var(--gold);stroke:var(--line);stroke-width:1.6}
.promo{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;margin:12px 0 0;padding:12px 14px;border:3px double var(--wineInk);border-radius:12px;background:linear-gradient(110deg,#fff6d8,#f6dce3);box-shadow:0 3px 0 var(--line);animation:promoIn .55s cubic-bezier(.2,.9,.25,1.25) 1}
@keyframes promoIn{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:none}}
.promo .rankInsignia{width:64px;height:52px;flex-basis:64px}
.promo span{display:block;font:900 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--wineInk)}
.promo strong{display:block;font-size:19px;line-height:1.1;margin-top:4px}
.promo p{margin:4px 0 0;font-size:13px;font-weight:700}
/* play: top bar */
.top{position:sticky;top:0;z-index:20;color:#fff;border-bottom:2px solid var(--line);background:var(--head)}
.topRow{display:flex;align-items:center;gap:8px;padding:9px 12px}
.topActions{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:22px;line-height:1;font-weight:1000;letter-spacing:-.045em;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.dots{display:flex;gap:4px;margin-left:4px}
.dots i{width:11px;height:11px;border:1.5px solid #fff;border-radius:50%;opacity:.85}
.dots i.now{background:#fff}.dots i.c{background:#8fd3bf;border-color:#8fd3bf}.dots i.a{background:#f09aae;border-color:#f09aae}
.spacer{flex:1}
.iconBtn{display:grid;place-items:center;width:38px;height:36px;padding:0;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line);cursor:pointer}
.iconBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:active{transform:translateY(2px);box-shadow:none}
.miniCrime{display:none;align-items:baseline;gap:8px;padding:6px 12px 7px;border-top:1px solid rgba(255,255,255,.25);background:rgba(10,14,22,.28);font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniCrime b{font:900 10px/1 var(--font);letter-spacing:.14em;color:var(--gold2)}
.top.showMini .miniCrime{display:flex}
/* play layout */
.play{padding:14px;display:grid;grid-auto-rows:max-content;gap:14px;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;align-content:start}
.caseCol,.sideCol{display:grid;grid-auto-rows:max-content;gap:12px;align-content:start;min-width:0;min-height:0}
.suspectSection{display:grid;grid-auto-rows:max-content;gap:12px;min-width:0}
.caseFile{min-width:0}
.fileBody{padding:12px;border:2px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);background:var(--manila);box-shadow:0 4px 0 var(--line)}
.fileTab{position:relative;z-index:1;width:fit-content;max-width:calc(100% - 20px);margin-bottom:-2px;padding:4px 12px 5px;border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--manila);font:900 11px/1.2 var(--font);letter-spacing:.09em;text-transform:uppercase;color:#4a3a15;white-space:normal;text-wrap:balance}
.reopened{display:inline-block;margin:0 0 8px;padding:2px 8px;border:2px dashed var(--wineInk);border-radius:6px;background:#fff4f6;color:var(--wineInk);font:900 11px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;transform:rotate(-1.5deg)}
.crime{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--manila2)}
.crime .lab{font:900 11px/1 var(--font);letter-spacing:.14em;color:#6b5418}
.crime .txt{font-size:21px;line-height:1.25;font-weight:900;letter-spacing:-.015em}
.crime .txt .katex,.crime .txt math{font-size:1.14em}
.notation{margin:8px 2px 0;font-size:14px;font-weight:700;color:#4d4023}
.shared{margin-top:12px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.shared h2,.moreEvidence h4{margin:0 0 6px;font:900 11px/1.2 var(--font);letter-spacing:.09em;text-transform:uppercase;color:#6b5418}
.evRow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 24px}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px;background:var(--line);overflow:hidden}
.board.stacked{grid-template-columns:minmax(0,1fr)}
.sus{min-width:0;display:flex;flex-direction:column;background:var(--card)}
.susHead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:7px 8px 7px 12px;border-bottom:2px solid var(--line)}
.s1 .susHead,.s2 .susHead{background:var(--suspectBlue)}
.susHead h3{margin:0;font:900 13px/1.2 var(--font);letter-spacing:.07em;text-transform:uppercase}
.susStatus{display:grid;place-items:center;flex:none;width:88px;height:34px}
.chargeBtn{width:100%;min-height:34px;padding:5px 12px;font-size:13px;box-shadow:0 2px 0 var(--line)}
.chargeBtn[aria-pressed=true]{background:var(--ink);color:#fff}
.evs{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 8px 8px}
.moreEvidence{align-self:stretch;min-width:0;margin:8px -8px 0;padding:10px 12px 0;border-top:2px solid var(--line)}
.ev{max-width:100%;text-align:center}
.evTag{display:inline-block;margin-top:6px;padding:1px 8px;border:1.5px solid #8a7440;border-radius:5px 12px 12px 5px;background:var(--manila2);font-size:12px;font-weight:800;color:#4d4023}
.mx{overflow-x:auto;overflow-y:hidden;max-width:100%}
.mx .katex-display,.mx .mdisp{margin:.3em 0}
.mx .katex .fbox,.mx .katex .fcolorbox{border-width:.08em!important}
.matrixMath{position:relative;isolation:isolate}
.matrixMath>.katex-display,.matrixMath>.mdisp{position:relative;z-index:1}
.matrixMath .katex-html [style*="background-color"],.matrixMath .mdisp [style*="background"]{background:transparent!important}
.matrixHighlights{position:absolute;inset:0;z-index:0;pointer-events:none}
.matrixHighlights span{position:absolute;background:#bfe3d9}
.matrixHighlights .rowHighlight{background:#f4c3cf}
.play:not(.done) .matrixHighlights{visibility:hidden}
/* Reserve annotation geometry before the verdict; reveal only its paint. */
.play:not(.done) .mx :is(.fbox,.fcolorbox,.colorbox,.bx,.cb){border-color:transparent!important;background:transparent!important}
math{font-family:"Latin Modern Math","STIX Two Math","Cambria Math",math;font-size:1.1em}.mdisp{display:block;margin:.6em 0}
.mt mtd{padding:.1em .38em}.mt.smallmatrix{font-size:.75em}.mt mtd.vl{border-left:1.2px solid}.mt mtd.ar{text-align:right;text-align:-webkit-right;padding-right:0}.mt mtd.al{text-align:left;text-align:-webkit-left;padding-left:0}
.bx{border:1.6px solid;padding:0 .2em}.cb{padding:0 .2em;border-radius:2px}
.guiltTag{display:grid;place-items:center;width:100%;height:100%;padding:6px 8px 4px;border:2px solid var(--line);border-radius:999px;box-shadow:0 2px 0 var(--line);font:900 11px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase}
.guiltTag.g,.guiltTag.i{background:#fff;color:var(--muted)}
/* closing argument */
.closing{display:grid;gap:10px}
.stem{font-weight:600;color:var(--muted)}
.play .inst{margin:0 2px;font-size:14.5px;font-weight:700;color:#2e3746}
.done .chargeInst,.done .closingInst{visibility:hidden}
@media(max-width:999px){.done .sideCol{min-height:var(--closing-height,0px)}}
.opts{display:grid;grid-auto-rows:1fr;gap:10px;border:0;margin:0;padding:0;min-width:0}
.opt{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);cursor:pointer;font-size:15.5px;line-height:1.45}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .letter{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--line);border-radius:50%;font-weight:1000;font-size:14px;background:#f4f1e8}
.opt.sel{background:var(--suspectBlue)}
.opt.sel .letter{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.done .opt{cursor:default}
.opt.isSound{border-color:var(--greenInk);background:var(--green);opacity:1}
.opt.isSound .letter{background:var(--greenInk);border-color:var(--greenInk);color:#fff}
.opt.isWrong{border-color:var(--wineInk);background:var(--wine);opacity:1}
.opt.isWrong .letter{background:var(--wineInk);border-color:var(--wineInk);color:#fff}
.optMark{grid-column:2;font:900 12.5px/1.3 var(--font)}
.isSound .optMark{color:var(--greenInk)}.isWrong .optMark{color:var(--wineInk)}
.optNotes{grid-column:2;font-size:12.5px;font-weight:700;color:var(--muted)}
/* verdict */
.verdictCard{position:relative;overflow:hidden;scroll-margin-top:96px}
.vHead{position:relative;padding:14px 16px 12px;border-bottom:2px solid var(--line);min-height:86px;animation:verdictHeadIn .32s ease-out both}
.v-conviction .vHead{background:var(--green);color:var(--greenInk)}
.v-acquittal .vHead{background:var(--wine);color:var(--wineInk)}
.vHead h2{margin:0;max-width:calc(100% - 150px);font-size:23px;line-height:1.08;font-weight:1000;letter-spacing:-.035em}
.vHead p{margin:5px 0 0;max-width:calc(100% - 180px);font-size:14px;font-weight:800}
.stamp{position:absolute;right:12px;top:16px;padding:5px 10px;border:4px double currentColor;border-radius:8px;font:1000 21px/1 var(--font);letter-spacing:.12em;transform:rotate(-9deg);opacity:.92;background:rgba(255,255,255,.35);animation:stampIn .62s .12s cubic-bezier(.2,.8,.3,1) both}
.stamp::after{content:"";position:absolute;inset:-5px;border:2px solid currentColor;border-radius:10px;opacity:0;pointer-events:none;animation:stampEcho .4s .46s ease-out both}
@keyframes verdictHeadIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes stampIn{0%{opacity:0;transform:translateY(-16px) rotate(-18deg) scale(1.9);box-shadow:0 12px 18px rgba(16,23,34,.18)}55%{opacity:1;transform:translateY(2px) rotate(-7deg) scale(.94);box-shadow:0 0 0 rgba(16,23,34,0)}76%{transform:translateY(-2px) rotate(-10deg) scale(1.04)}100%{opacity:.92;transform:translateY(0) rotate(-9deg) scale(1);box-shadow:0 0 0 rgba(16,23,34,0)}}
@keyframes stampEcho{0%{opacity:0;transform:scale(1)}15%{opacity:.38}100%{opacity:0;transform:scale(1.22,1.4)}}
.vBody{padding:12px 16px 14px}
.vBody h3{margin:0 0 4px;font:900 12px/1.1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:#4d5a6c}
.vBody p{margin:0 0 8px;font-weight:600;line-height:1.5}
.lesson{padding:10px 12px;border-left:5px solid var(--gold);background:#fbf6e8;border-radius:0 10px 10px 0;margin:6px 0}
/* action bar */
.actionBar{position:relative;z-index:15;display:flex;align-items:center;gap:10px;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:#fffaf3;border-top:2px solid var(--line)}
.seg{display:flex;align-items:center;gap:6px}
.seg>span{font:900 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg button{min-width:46px;min-height:46px;padding:0 12px;font-size:16px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.restBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.navBtns{flex:1;display:flex;gap:10px}.navBtns .btn{flex:1}
/* end */
.endTop{padding:18px 20px 16px;color:#fff;border-bottom:2px solid var(--line);background:var(--head)}
.endTop h1{margin:0;font-size:30px;line-height:1;font-weight:1000;letter-spacing:-.045em}

<script>
/*ENGINE-START*/
// Null & Order — closing-argument engine. Exact arithmetic, case generation,
// argument templates grounded in §§2.2–2.4, and the leak audit.
// No DOM, no storage, no network.
const Engine=(()=>{
"use strict";
const T=String.raw;
// ---------- exact rationals ----------
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1;};
const Q=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};};
const add=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>Q(a.n*b.n,a.d*b.d),div=(a,b)=>Q(a.n*b.d,a.d*b.n),neg=a=>Q(-a.n,a.d);
const isZ=x=>x.n===0,eqQ=(a,b)=>a.n===b.n&&a.d===b.d;
const qv=xs=>xs.map(x=>typeof x==='number'?Q(x):x),toQ=rows=>rows.map(qv);
const tq=x=>x.d===1?String(x.n):(x.n<0?'-':'')+T`\tfrac{${Math.abs(x.n)}}{${x.d}}`;
const zeros=(m,n)=>Array.from({length:m},()=>Array(n).fill(0));
const matmul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,a,k)=>add(s,mul(a,B[k][j])),Q(0))));
const matvec=(A,v)=>matmul(A,v.map(x=>[x])).map(r=>r[0]);
function ref(A0){const A=A0.map(r=>r.slice()),m=A.length,n=A[0].length,piv=[];let r=0;
 for(let c=0;c<n&&r<m;c++){let p=-1;for(let i=r;i<m;i++)if(!isZ(A[i][c])){p=i;break;}if(p<0)continue;
  [A[r],A[p]]=[A[p],A[r]];const s=A[r][c];A[r]=A[r].map(x=>div(x,s));
  for(let i=r+1;i<m;i++){const f=A[i][c];if(!isZ(f))A[i]=A[i].map((x,j)=>sub(x,mul(f,A[r][j])));}piv.push(c);r++;}
 return {R:A,piv};}
function rref(A0){const {R,piv}=ref(A0),A=R.map(r=>r.slice());
 piv.forEach((c,r)=>{for(let i=0;i<r;i++){const f=A[i][c];if(!isZ(f))A[i]=A[i].map((x,j)=>sub(x,mul(f,A[r][j])));}});return {R:A,piv};}
const rank=A=>ref(A).piv.length;
const hcat=(A,B)=>A.map((r,i)=>r.concat(B[i]));
const colOf=(A,j)=>A.map(r=>r[j]);
const fromCols=cs=>cs[0].map((_,i)=>cs.map(c=>c[i]));
const vecEq=(u,v)=>u.length===v.length&&u.every((x,i)=>eqQ(x,v[i]));
const matEq=(A,B)=>A.length===B.length&&A.every((r,i)=>vecEq(r,B[i]));
const maxAbs=A=>Math.max(...A.flat().map(x=>Math.abs(x.n/x.d)));
const parallel=(u,v)=>rank(fromCols([u,v]))<2;
const combo=(cols,xs)=>cols[0].map((_,i)=>cols.reduce((s,c,k)=>add(s,mul(xs[k],c[i])),Q(0)));
const nullVec=(M,free)=>{const {R,piv}=rref(M),x=Array(M[0].length).fill(Q(0));x[free]=Q(1);piv.forEach((p,i)=>x[p]=neg(R[i][free]));return x;};
// Facts read directly off a displayed echelon form (never from generation tags).
function facts(R,aug=null){
 const n=aug??R[0].length,lead=R.map(row=>row.findIndex(x=>!isZ(x)));
 const pivots=lead.flatMap((c,i)=>c>=0?[[i,c]]:[]),varPiv=pivots.filter(([,c])=>c<n).map(([,c])=>c);
 const lhsZero=R.flatMap((row,i)=>row.slice(0,n).every(isZ)?[i]:[]);
 return {n,lead,pivots,varPiv,lead1:pivots.length,zeroRows:lead.flatMap((c,i)=>c<0?[i]:[]),lhsZero,
  contra:aug==null?[]:lhsZero.filter(i=>!isZ(R[i][aug])),free:[...Array(n).keys()].filter(j=>!varPiv.includes(j))};}
const nonLead=(R,f,j)=>R.some((row,i)=>!isZ(row[j])&&f.lead[i]!==j);
// ---------- randomness ----------
function rng(seed){let h=1779033703^String(seed).length;for(const ch of String(seed)){h=Math.imul(h^ch.charCodeAt(0),3432918353);h=h<<13|h>>>19;}
 let a=h>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1)),nz=(r,a,b)=>{let x=0;while(!x)x=ri(r,a,b);return x;};
const pick=(r,xs)=>xs[Math.floor(r()*xs.length)];
const shuffle=(r,xs)=>{const o=xs.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;};
function unitLower(r,m){for(;;){const L=zeros(m,m);let k=0;for(let i=0;i<m;i++){L[i][i]=1;for(let j=0;j<i;j++){L[i][j]=ri(r,-2,2);k+=L[i][j]!==0;}}if(m<2||k>=Math.min(2,m*(m-1)/2))return toQ(L);}}
// An REF with pivots at the given pivot columns, then disguised by row operations.
function echelon(r,m,n,piv,fill=()=>ri(r,-3,3)){const U=zeros(m,n);piv.forEach((c,i)=>{U[i][c]=1;for(let j=c+1;j<n;j++)U[i][j]=fill(i,j);});return toQ(U);}
function disguise(r,U,aug=null,lim=9){const A=matmul(unitLower(r,U.length),U);if(maxAbs(A)>lim)return null;
 const nv=aug??A[0].length;if([...Array(nv).keys()].some(j=>colOf(A,j).every(isZ)))return null;
 const R=ref(A).R;return {A,R,f:facts(R,aug)};}
// ---------- TeX helpers ----------
const sv=v=>T`\left[\begin{smallmatrix}${qv(v).map(tq).join(T`\\`)}\end{smallmatrix}\right]`;
function lin(cs,names){let s='';cs=qv(cs);cs.forEach((c,k)=>{if(isZ(c))return;const a=Q(Math.abs(c.n),c.d),m=eqQ(a,Q(1))?'':tq(a);
 s+=(s?(c.n<0?'-':'+'):(c.n<0?'-':''))+m+names[k];});return s||'0';}
const cf=t=>{t=typeof t==='number'?Q(t):t;return eqQ(t,Q(1))?'':eqQ(t,Q(-1))?'-':tq(t);};
const word=k=>['zero','one','two','three','four'][k];
const ord=k=>['first','second','third','fourth'][k];
const colList=(js,cap)=>(cap?'Columns ':'columns ')+(js.length===2?`${js[0]+1} and ${js[1]+1}`:js.slice(0,-1).map(j=>j+1).join(', ')+`, and ${js.at(-1)+1}`);
const cn=j=>`column ${j+1}`,Cn=j=>`Column ${j+1}`;
const fam={};
// Optional proof-specific highlights follow the sound argument, never a distractor.
const soundUsesFreeColumns=c=>c.options.some(o=>o.role==='sound'&&template(c.fam,o.tid).freeColumns);

// ===================================================================
// C01 — dependent columns (§2.4 A Test of Independence; §2.2 free variables)
fam.C01={id:'C01',title:'The dependent lineup',section:'2.4',topic:'Independence',page:'independence',
 crime:'Having linearly dependent columns.',
 notation:T`Each suspect is a matrix \(C\) with columns \(\mathbf c_1,\mathbf c_2,\mathbf c_3\); \(R\) is an REF of \(C\).`,
 gen(r){const m=4,n=3,jG=pick(r,[1,2]),fill=()=>pick(r,[-3,-2,-1,0,1,2,3]);
  const sus=piv=>{const U=echelon(r,m,n,piv,fill);if([0,1,2].some(j=>colOf(U,j).every(isZ)))return null;const s=disguise(r,U);if(!s)return null;
   return {...s,C:s.A,items:[{name:'C',rows:s.A},{name:'R',rows:s.R}]};};
  const G=sus([0,1,2].filter(j=>j!==jG)),I=sus([0,1,2]);if(!G||!I)return null;
  G.nullv=nullVec(G.C,G.f.free[0]);return {shared:[],G,I};},
 crimeTrue:s=>rank(s.C)<3,
 valids:[
  {id:'C01.V.free',cands:c=>[1,2].map(j=>({p:{j}})),premise:(s,p)=>!s.f.varPiv.includes(p.j),
   text:p=>T`${Cn(p.j)} of \(R\) has no pivot, so \(t_1\mathbf c_1+t_2\mathbf c_2+t_3\mathbf c_3=\mathbf 0\) has a free variable.`,
   falseWhy:(p,s)=>T`${Cn(p.j)} of this \(R\) has a pivot (row ${s.f.pivots.find(([,c])=>c===p.j)[0]+1}), so \(t_{${p.j+1}}\) is not free.`},
  {id:'C01.V.relation',cands:c=>{const out=[{p:{x:c.G.nullv}}];
    // near miss: back-substitute the innocent REF as if column 3 were free (ignores row 3)
    const R=c.I.R,x3=Q(1),x2=neg(R[1][2]),x1=sub(neg(mul(R[0][1],x2)),R[0][2]);out.push({p:{x:[x1,x2,x3]},tag:'ignoreRow'});return out;},
   premise:(s,p)=>p.x.some(x=>!isZ(x))&&matvec(s.C,p.x).every(isZ),
   text:p=>T`\(${lin(p.x,C3)}=\mathbf 0\), so a nontrivial combination of the columns of \(C\) equals \(\mathbf 0\).`,
   falseWhy:(p,s)=>T`For this \(C\), \(${lin(p.x,[T`\mathbf c_1`,T`\mathbf c_2`,T`\mathbf c_3`])}=${sv(matvec(s.C,p.x))}\ne\mathbf 0\).`}],
 misc:[
  {id:'C01.M.trivial',name:'The trivial combination proves nothing',cands:()=>[{p:{}}],premise:()=>true,
   text:()=>T`\(0\mathbf c_1+0\mathbf c_2+0\mathbf c_3=\mathbf 0\), so a combination of the columns of \(C\) equals \(\mathbf 0\).`,
   why:()=>T`Every list has the trivial combination. Dependence needs a nontrivial one, with some coefficient not zero.`},
  {id:'C01.M.zeroRow',name:'A zero row is not a free variable',cands:()=>[{p:{i:3}}],premise:(s,p)=>s.f.zeroRows.includes(p.i),
   text:p=>T`Row ${p.i+1} of \(R\) is zero, so one equation of \(t_1\mathbf c_1+t_2\mathbf c_2+t_3\mathbf c_3=\mathbf 0\) is redundant.`,
   why:()=>T`Zero rows come from having more rows than pivots. \(C\) has 4 rows and 3 columns, so its REF has a zero row even when every column has a pivot. The Test of Independence asks whether \(t_1\mathbf c_1+t_2\mathbf c_2+t_3\mathbf c_3=\mathbf 0\) has a free variable: a column of \(R\) with no pivot.`},
  {id:'C01.M.shape',name:'More rows does not force dependence',cands:()=>[{p:{}}],premise:s=>s.C.length>s.C[0].length,
   text:()=>T`\(C\) has more rows (4) than columns (3), so its columns cannot all be independent.`,
   why:()=>T`It is the other way around. A homogeneous system has a nontrivial solution when there are more unknowns than equations, so more columns than rows forces dependence. Three vectors in \(\mathbb R^4\) can be independent.`},
  {id:'C01.M.offPivot',name:T`Count pivots, not nonzero entries`,cands:()=>[1,2].map(j=>({p:{j}})),premise:(s,p)=>nonLead(s.R,s.f,p.j),
   text:p=>T`${Cn(p.j)} of \(R\) has a nonzero entry that is not a pivot, so \(\mathbf c_{${p.j+1}}\) depends on the other columns.`,
   why:()=>T`An REF may have any entries above a pivot. A column signals dependence only when it has no pivot at all.`},
  {id:'C01.M.pivotsZero',name:'Zero rows concern the rows, not the columns',cands:(...a)=>(()=>[{p:{}}])(...a).flatMap(o=>[o,{...o,p:{...o.p,v:1}}]),premise:s=>s.f.varPiv.length===3&&s.f.zeroRows.length>0,
   text:p=>p.v?T`Every column of \(R\) has a pivot, but row 4 is zero.`:T`Every column of \(R\) has a pivot, but row 4 is zero, so \(C\mathbf x=\mathbf 0\) lost an equation.`,
   why:()=>T`A zero row means a row of \(C\) was a combination of the others. With a pivot in every column there is no free variable, so \(t_1\mathbf c_1+t_2\mathbf c_2+t_3\mathbf c_3=\mathbf 0\) has only the trivial solution (Test of Independence).`}],
 conviction:(c,s)=>T`${Cn(s.f.free[0])} of \(R\) has no pivot, so \(t_{${s.f.free[0]+1}}\) is free. Setting it to 1 gives \(${lin(s.nullv,[T`\mathbf c_1`,T`\mathbf c_2`,T`\mathbf c_3`])}=\mathbf 0\), a nontrivial combination, so the columns are dependent (Test of Independence).`,
 clearing:()=>T`Every column of \(R\) has a pivot, so \(t_1\mathbf c_1+t_2\mathbf c_2+t_3\mathbf c_3=\mathbf 0\) has only the trivial solution: the columns are independent.`,
 marks:(c,s)=>({R:{box:s.f.pivots,colT:s.f.free}})
};

// ===================================================================
// C03 — membership in a span (§2.3 Testing membership in a span; §2.2 Note on variable columns)
fam.C03={id:'C03',title:'The span witness',section:'2.3',topic:'Span',page:'subspaces',
 crime:T`Being in \(\operatorname{span}\{\mathbf c_1,\mathbf c_2\}\).`,
 notation:T`Each suspect is a vector \(\mathbf b\in\mathbb R^3\); \(R\) is an REF of \([\,\mathbf c_1\ \mathbf c_2\mid\mathbf b\,]\).`,
 gen(r){const a=ri(r,-3,3),L=unitLower(r,3),C=matmul(L,toQ([[1,a],[0,1],[0,0]]));
  if(maxAbs(C)>9||colOf(C,0).every(isZ)||colOf(C,1).every(isZ))return null;
  const s=nz(r,-3,3),t=nz(r,-3,3),bG=combo([colOf(C,0),colOf(C,1)],qv([s,t]));
  const bI=matvec(L,qv([ri(r,-4,4),ri(r,-4,4),nz(r,-2,2)]));
  if(maxAbs([bG,bI])>12)return null;
  const sus=b=>{const M=hcat(C,b.map(x=>[x])),R=ref(M).R;return {b,M,R,f:facts(R,2),items:[{name:'b',vec:b},{name:'R',rows:R,aug:2}]};};
  const G=sus(bG),I=sus(bI);G.coef=qv([s,t]);
  const R=I.R,y=R[1][2],x=sub(R[0][2],mul(R[0][1],y));I.fake=[x,y];
  return {shared:[{name:'Cc',rows:C,tex:T`[\,\mathbf c_1\ \mathbf c_2\,]`}],C,cols:[colOf(C,0),colOf(C,1)],G,I};},

// C09 — basis for col(A) (§2.4 Rank Theorem; Warning: pivot columns come from A)
fam.C09={id:'C09',magSlack:0,title:'The column-space witness',section:'2.4',topic:'Column space',page:'independence',
 crime:T`Being a basis for \(\operatorname{col}(A)\).`,notation:T`The columns of each suspect \(C\) are the candidate basis vectors; \(R\) is an REF of \(A\).`,
 gen(r){const type=pick(r,['reduced','rows']),q=type==='rows'?pick(r,[2,3]):pick(r,[1,2,3]);
  const U=echelon(r,3,4,[0,q]);if(type==='rows'&&isZ(U[0][1]))return null;
  const s=disguise(r,U);if(!s)return null;const {A,R,f}=s,[p,qq]=f.varPiv;
  const cand=cols=>({C:fromCols(cols),cols,items:[{name:'C',rows:fromCols(cols)}]});
  const G=cand([colOf(A,p),colOf(A,qq)]),I=type==='reduced'?cand([colOf(R,p),colOf(R,qq)]):cand([colOf(A,0),colOf(A,1)]);I.type=type;
  return {shared:[{name:'A',rows:A},{name:'R',rows:R}],A,R,f,p,q:qq,G,I};},
 crimeTrue:(s,c)=>rank(s.C)===2&&rank(hcat(c.A,s.C))===2,
 valids:[
  {id:'C09.V.pivots',cands:(...a)=>(c=>{const alt=c.p===0&&c.q===1?{i:0,j:2}:{i:0,j:1};return [{p:{i:c.p,j:c.q}},{p:alt}];})(...a).flatMap(o=>[{...o,p:{...o.p,v:0}},{...o,p:{...o.p,v:1}},{...o,p:{...o.p,v:2}}]),
   premise:(s,p,c)=>c.p===p.i&&c.q===p.j&&vecEq(s.cols[0],colOf(c.A,p.i))&&vecEq(s.cols[1],colOf(c.A,p.j)),
   text:p=>p.v===1?T`\(C\) is columns ${p.i+1} and ${p.j+1} of \(A\), where \(R\) has its pivots.`:p.v===2?T`\(R\) has its pivots in columns ${p.i+1} and ${p.j+1}, and \(C\) is made of exactly those columns of the original \(A\).`:T`\(R\) has pivots in columns ${p.i+1} and ${p.j+1}, and \(C\) is columns ${p.i+1} and ${p.j+1} of \(A\).`,
   falseWhy:(p,s,c)=>c.p!==p.i||c.q!==p.j?T`The pivots of \(R\) are in columns ${c.p+1} and ${c.q+1}, not ${p.i+1} and ${p.j+1}.`:T`This \(C\) is not made of columns ${p.i+1} and ${p.j+1} of \(A\).`},
  {id:'C09.V.indep',cands:()=>[{p:{}}],premise:(s,p,c)=>isColsOfA(s,c)&&!parallel(...s.cols),
   text:()=>T`The columns of \(C\) are two nonparallel columns of \(A\), and \(R\) has two pivots.`,
   falseWhy:(p,s,c)=>isColsOfA(s,c)?T`These two columns of \(A\) are parallel, so they are dependent.`:T`These vectors are not columns of \(A\).`}],
 misc:[
  {id:'C09.M.count',name:'Counting is not enough',cands:()=>[{p:{}}],premise:s=>s.cols.length===2,
   text:()=>T`\(C\) has two columns, one for each pivot of \(R\).`,
   why:()=>T`Two is the right number, since \(\dim\operatorname{col}(A)=2\). But two vectors form a basis only if they lie in \(\operatorname{col}(A)\) and are independent; counting checks neither.`},
  {id:'C09.M.nonparallel',name:T`A basis must lie in \(\operatorname{col}(A)\)`,cands:()=>[{p:{}}],premise:s=>!parallel(...s.cols),
   text:()=>T`The columns of \(C\) are not multiples of each other, and \(R\) has two pivots.`,
   why:()=>T`Independent and the right number, but the vectors must also lie in \(\operatorname{col}(A)\) for the dimension argument to apply.`},
  {id:'C09.M.subset',name:T`Columns of \(A\) can be dependent`,cands:()=>[{p:{}}],premise:(s,p,c)=>isColsOfA(s,c),
   text:()=>T`The columns of \(C\) are two columns of \(A\), and \(R\) has two pivots.`,
   why:()=>T`Columns of \(A\) lie in \(\operatorname{col}(A)\), but two of them can be dependent. The Rank Theorem picks the columns where \(R\) has its pivots.`},
  {id:'C09.M.reduced',name:'Pivot columns come from the original matrix',cands:()=>[{p:{}}],premise:(s,p,c)=>vecEq(s.cols[0],colOf(c.R,c.p))&&vecEq(s.cols[1],colOf(c.R,c.q)),
   text:()=>T`The columns of \(C\) are the pivot columns of \(R\).`,
   why:()=>T`Row operations change the columns, so the columns of \(R\) usually are not even in \(\operatorname{col}(A)\). Use the pivot columns of the original \(A\).`},
  {id:'C09.M.rows',name:'Read pivot positions by column',cands:()=>[{p:{}}],premise:(s,p,c)=>vecEq(s.cols[0],colOf(c.A,0))&&vecEq(s.cols[1],colOf(c.A,1)),
   text:()=>T`The pivots of \(R\) are in rows 1 and 2, and \(C\) is columns 1 and 2 of \(A\).`,
   why:(p,c)=>T`Every nonzero row of an REF has a pivot; what matters is which columns they sit in. Here they are in columns ${c.p+1} and ${c.q+1}.`}],
 conviction:(c,s)=>T`The pivots of \(R\) are in columns ${c.p+1} and ${c.q+1}, and \(C\) holds exactly those columns of the original \(A\). By the Rank Theorem they form a basis for \(\operatorname{col}(A)\).`,
 clearing:(c,s)=>{if(s.type==='reduced'){const bad=s.cols.findIndex(v=>rank(hcat(c.A,v.map(x=>[x])))>2);
   return T`These are columns ${c.p+1} and ${c.q+1} of \(R\), not of \(A\). Column ${bad+1} of \(C\) is not in \(\operatorname{col}(A)\): the system \(A\mathbf x=${sv(s.cols[bad])}\) has no solution.`;}
  const k=div(s.cols[1].find(x=>!isZ(x)),s.cols[0][s.cols[1].findIndex(x=>!isZ(x))]);
  return T`Columns 1 and 2 of \(A\) are dependent: column 2 is \(${tq(k)}\) times column 1.`;},
 marks:c=>({R:{box:c.f.pivots},A:{colT:[c.p,c.q]}})
};
function isColsOfA(s,c){return s.cols.every(v=>[0,1,2,3].some(j=>vecEq(v,colOf(c.A,j))));}

// C13 — coordinates in an ordered basis (§2.4 Ordered bases and coordinate vectors)
fam.C13={id:'C13',title:'The coordinate decoder',section:'2.4',topic:'Coordinates',page:'independence',

 gen(r){const a=nz(r,-3,3),c1=nz(r,-4,4),c2=nz(r,-4,4);if(c1===c2)return null;
  const p=c1+a*c2;if(Math.abs(p)>4||p===c2)return null;const q=c2,U=toQ([[1,a,p],[0,1,q],[0,0,0]]),s=disguise(r,U,2,12);if(!s)return null;

 valids:[
  {id:'C13.V.check',cands:(...a)=>(c=>[{p:{x:c.G.c}},{p:{x:c.I.c}}])(...a).flatMap(o=>[{...o,p:{...o.p,v:0}},{...o,p:{...o.p,v:1}},{...o,p:{...o.p,v:2}}]),premise:(s,p,c)=>vecEq(s.c,p.x)&&vecEq(combo(c.b,p.x),c.v),

   text:(p,c)=>{const sg=eqQ(p.s,sub(c.p,mul(c.a,c.q)))?'-':'+';return p.v?T`Back substitution gives \(c_2=${tq(c.q)}\), \(c_1=${tq(c.p)}${sg}(${tq(c.a)})(${tq(c.q)})=${tq(p.s)}\).`:T`Back substitution in \(R\) gives \(c_2=${tq(c.q)}\) and \(c_1=${tq(c.p)}${sg}(${tq(c.a)})(${tq(c.q)})=${tq(p.s)}\), the entries of \(\mathbf c\).`;},

  {id:'C13.M.consistent',name:'Existence is not the coordinates',cands:()=>[{p:{}}],premise:()=>true,

// C15 — dimension of the null space (§2.4 Rank–Nullity; §2.2 basic solutions)
fam.C15={id:'C15',title:'The forgotten dimensions',section:'2.4',topic:'Rank and nullity',page:'independence',
 crime:c=>`Having a ${word(c.d)}-dimensional null space.`,notation:T`Each suspect is a matrix \(A\); \(R\) is an REF of \(A\).`,
 // Symmetric generation: build two suspects of one size, then use them only if EITHER could be
 // the guilty one (the crime's dimension follows from which one is chosen). No size or rank tells.
 pair(r){const shapes=[[2,3],[2,4],[2,5],[3,3],[3,4],[3,5],[4,3],[4,4],[4,5],[3,2],[4,2]],nul=shuffle(r,[1,2,3]).slice(0,2);
  const mk=nu=>{const [m,n]=pick(r,shapes.filter(([m,n])=>n-nu>=1&&n-nu<=Math.min(m,n))),rk=n-nu;
   const piv=[0,...shuffle(r,[...Array(n-1).keys()].map(x=>x+1)).slice(0,rk-1)].sort((x,y)=>x-y);
   const U=echelon(r,m,n,piv);if([...Array(n).keys()].some(j=>colOf(U,j).every(isZ)))return null;
   const s=disguise(r,U,null,12);if(!s)return null;return {...s,m,n,items:[{name:'A',rows:s.A},{name:'R',rows:s.R}]};};
  const X=mk(nul[0]),Y=mk(nul[1]);if(!X||!Y)return null;
  return [X,Y,(G,I)=>({shared:[],d:G.n-G.f.lead1,G,I})];},
 crimeTrue:(s,c)=>s.n-rank(s.A)===c.d,
 valids:[
  {id:'C15.V.rn',cands:(...a)=>(c=>{const out=[{p:{r:c.G.f.lead1,n:c.G.n}}],rr=c.I.n-c.d;if(rr>0&&rr!==c.I.f.lead1)out.push({p:{r:rr,n:c.I.n}});return out;})(...a).flatMap(o=>[{...o,p:{...o.p,v:0}},{...o,p:{...o.p,v:1}},{...o,p:{...o.p,v:2}}]),
   premise:(s,p)=>s.f.lead1===p.r&&s.n===p.n,
   text:(p,c)=>p.v===1?T`\(R\) has ${p.r} pivot${p.r>1?'s':''} and \(A\) has ${p.n} columns.`:p.v===2?T`\(R\) has ${p.r} pivot${p.r>1?'s':''} and \(A\) has ${p.n} columns, so \(A\mathbf x=\mathbf 0\) has \(${p.n}-${p.r}\) free variables and \(\dim\operatorname{null}(A)=${p.n}-${p.r}\).`:T`\(R\) has ${p.r} pivot${p.r>1?'s':''} and \(A\) has ${p.n} columns, so \(\dim\operatorname{null}(A)=${p.n}-${p.r}\).`,
   falseWhy:(p,s)=>T`This \(R\) has ${s.f.lead1} pivot${s.f.lead1>1?'s':''} and \(A\) has ${s.n} columns.`},
  {id:'C15.V.free',cands:(...a)=>(c=>{const out=[];if(c.G.f.free.length===c.d)out.push({p:{js:c.G.f.free}});
    const fI=c.I.f.free,piv=c.I.f.varPiv.filter(j=>j>0);
    if(fI.length<c.d&&piv.length>=c.d-fI.length)out.push({p:{js:[...fI,...piv.slice(-(c.d-fI.length))].sort((a,b)=>a-b)}});

   premise:(s,p)=>s.f.free.length===p.js.length&&p.js.every(j=>s.f.free.includes(j)),
   text:p=>p.v?(p.js.length===1?T`Only ${cn(p.js[0])} of \(R\) has no pivot.`:T`Only ${colList(p.js)} of \(R\) have no pivot.`):(p.js.length===1?T`Only ${cn(p.js[0])} of \(R\) has no pivot, so \(A\mathbf x=\mathbf 0\) has one basic solution.`:T`Only ${colList(p.js)} of \(R\) have no pivot, so \(A\mathbf x=\mathbf 0\) has ${word(p.js.length)} basic solutions.`),
   falseWhy:(p,s)=>T`In this \(R\), the columns without pivots are ${s.f.free.length?s.f.free.map(j=>j+1).join(', '):'none'}.`}],
 misc:[
  {id:'C15.M.zeroRows',name:'Zero rows are not free variables',cands:(...a)=>(()=>[{p:{}}])(...a).flatMap(o=>[o,{...o,p:{...o.p,v:1}}]),premise:(s,p,c)=>s.f.zeroRows.length===c.d,
   text:(p,c)=>p.v?T`\(R\) has ${word(c.d)} zero row${c.d>1?'s':''}, so ${c.d>1?word(c.d)+' equations':'one equation'} of \(A\mathbf x=\mathbf 0\) drop${c.d>1?'':'s'} out and leave${c.d>1?'':'s'} ${word(c.d)} free parameter${c.d>1?'s':''}.`:T`\(R\) has ${word(c.d)} zero row${c.d>1?'s':''}, so ${c.d>1?word(c.d)+' equations':'one equation'} of \(A\mathbf x=\mathbf 0\) drop${c.d>1?'':'s'} out.`,
   why:()=>T`Zero rows count \(m-r\): equations that add nothing. The null-space dimension is \(n-r\), the number of columns without pivots (Rank–Nullity).`},
  {id:'C15.M.rank',name:T`Pivots mark what is kept, not what is forgotten`,cands:()=>[{p:{}}],premise:(s,p,c)=>s.f.lead1===c.d,
   text:(p,c)=>T`\(R\) has only ${word(c.d)} pivot${c.d>1?'s':''}, so \(A\mathbf x=\mathbf 0\) has ${word(c.d)} basic solution${c.d>1?'s':''}.`,
   why:()=>T`Pivots mark basic variables; basic solutions come from the free variables, one per column without a pivot. The pivots give \(\operatorname{rank}(A)\), and the null space gets the rest: \(\dim\operatorname{null}(A)=n-\operatorname{rank}(A)\).`},
  {id:'C15.M.tall',name:'Extra rows do not create free variables',cands:()=>[{p:{}}],premise:(s,p,c)=>s.m-s.n===c.d,

// Remaining crime families. Same contract as above: each case needs a sound argument
// (premise true only for the guilty suspect), a near-miss valid argument (premise false
// for both), a misconception true for both, and a misconception true only for the innocent.
const pairwiseFree=M=>{const n=M[0].length;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(parallel(colOf(M,i),colOf(M,j)))return false;return true;};
const noZeroCol=M=>M[0].every((_,j)=>!colOf(M,j).every(isZ));
const C3=[T`\mathbf c_1`,T`\mathbf c_2`,T`\mathbf c_3`];
const zeroRowOf=s=>s.f.zeroRows[0]+1;

// ---------- C02 — independent columns (§2.4 A Test of Independence) ----------

// ---------- C14 — dimension of the image (§2.4 Rank Theorem, Rank–Nullity) ----------
fam.C14={id:'C14',title:'Rank and dimension',section:'2.4',topic:'Rank',page:'independence',
 crime:c=>`Having a ${word(c.d)}-dimensional image space.`,notation:T`Each suspect is a matrix \(A\); \(R\) is an REF of \(A\).`,
 pair(r){const shapes=[[2,3],[2,4],[3,3],[3,4],[3,2],[4,3],[4,2]],ranks=shuffle(r,[1,2,3]).slice(0,2);
  const mk=rk=>{const ok=shapes.filter(([m,n])=>rk<=Math.min(m,n));if(!ok.length)return null;const [m,n]=pick(r,ok);
   const piv=[0,...shuffle(r,[...Array(n-1).keys()].map(x=>x+1)).slice(0,rk-1)].sort((x,y)=>x-y);
   const U=echelon(r,m,n,piv);if(!noZeroCol(U))return null;const s=disguise(r,U,null,12);if(!s)return null;
   return {...s,m,n,items:[{name:'A',rows:s.A},{name:'R',rows:s.R}]};};
  const X=mk(ranks[0]),Y=mk(ranks[1]);if(!X||!Y)return null;return [X,Y,(G,I)=>({shared:[],d:G.f.lead1,G,I})];},
 crimeTrue:(s,c)=>rank(s.A)===c.d,
 valids:[
  {id:'C14.V.basis',cands:c=>{const out=[{p:{js:c.G.f.varPiv}}],ip=c.I.f.varPiv;
    const gp=c.G.f.varPiv,last=gp.at(-1);if(last+1<c.G.n)out.push({p:{js:[...gp.slice(0,-1),last+1]}});
    if(ip.length>c.d)out.push({p:{js:ip.slice(0,c.d)}});else{const extra=[...Array(c.I.n).keys()].filter(j=>!ip.includes(j));if(extra.length>=c.d-ip.length)out.push({p:{js:[...ip,...extra.slice(0,c.d-ip.length)].sort((a,b)=>a-b)}});}return out;},
   premise:(s,p)=>s.f.varPiv.join()===p.js.join(),
   text:p=>T`\(R\) has pivots in ${p.js.length===1?cn(p.js[0]):colList(p.js)}, so ${p.js.length===1?'that column':'those columns'} of \(A\) form a basis for \(\operatorname{im}(A)\).`,
   falseWhy:(p,s)=>T`The pivots of this \(R\) are in ${s.f.varPiv.length===1?cn(s.f.varPiv[0]):colList(s.f.varPiv)}.`},
  {id:'C14.V.rows',cands:()=>[{p:{}}],premise:(s,p,c)=>s.f.lead1===c.d,
   text:(p,c)=>T`\(R\) has exactly ${c.d} nonzero row${c.d>1?'s':''}, so the rank of \(A\) is ${c.d}.`,
   falseWhy:(p,s)=>T`This \(R\) has ${word(s.f.lead1)} nonzero row${s.f.lead1>1?'s':''}.`},
  {id:'C14.V.rn',freeColumns:true,cands:c=>{const out=[{p:{n:c.G.n,k:c.G.f.free.length}}],k=c.I.n-c.d;if(k>=0&&k!==c.I.f.free.length)out.push({p:{n:c.I.n,k}});return out;},
   premise:(s,p)=>s.n===p.n&&s.f.free.length===p.k,
   text:(p,c)=>T`\(A\) has ${p.n} columns, and ${p.k} column${p.k===1?'':'s'} of \(R\) ${p.k===1?'has':'have'} no pivot, so the null space of \(A\) has dimension ${p.k}.`,
   falseWhy:(p,s)=>T`This \(A\) has ${s.n} columns, and ${s.f.free.length} column${s.f.free.length===1?'':'s'} of \(R\) lack a pivot.`}],
 misc:[
  {id:'C14.M.stopEarly',name:'Count every nonzero row',cands:()=>[{p:{}}],premise:(s,p,c)=>s.f.lead1>=c.d,
   text:(p,c)=>T`Row ${c.d} of \(R\) is nonzero, so \(R\) has ${c.d} independent row${c.d>1?'s':''}.`,
   why:(p,c)=>T`Rows below row ${c.d} may also be nonzero. The rank counts every nonzero row of \(R\), that is, every pivot.`},
  {id:'C14.M.room',name:'Possible is not actual',cands:()=>[{p:{}}],premise:(s,p,c)=>s.m>=c.d&&s.n>=c.d,
   text:(p,c)=>T`\(A\) has at least ${c.d} rows and at least ${c.d} columns, so its image has room for ${c.d} dimension${c.d>1?'s':''}.`,
   why:()=>T`The size of \(A\) only bounds the rank. The actual image dimension is the number of pivots in \(R\).`},
  {id:'C14.M.zeroRows',name:'Zero rows are lost outputs, not image directions',cands:()=>[{p:{}}],premise:(s,p,c)=>s.f.zeroRows.length===c.d,
   text:(p,c)=>T`\(R\) has ${c.d} zero row${c.d>1?'s':''}, so ${c.d} output direction${c.d>1?'s are':' is'} accounted for.`,
   why:()=>T`The image dimension is the number of pivots (Rank Theorem). Zero rows count the output directions the image misses.`},
  {id:'C14.M.free',name:'Free columns count the null space',cands:()=>[{p:{}}],premise:(s,p,c)=>s.f.free.length===c.d,
   text:(p,c)=>T`${c.d} column${c.d>1?'s':''} of \(R\) ${c.d>1?'have':'has'} no pivot, so \(A\) has ${c.d} free direction${c.d>1?'s':''}.`,
   why:()=>T`Columns without pivots count \(\dim\operatorname{null}(A)\), the forgotten input directions. The image dimension is \(n-\dim\operatorname{null}(A)\), the number of pivots.`},
  {id:'C14.M.rows',name:'The output space is not the image',cands:()=>[{p:{}}],premise:(s,p,c)=>s.m===c.d,
   text:(p,c)=>T`\(A\) has ${c.d} row${c.d>1?'s':''}, so every output \(A\mathbf x\) lies in \(\mathbb R^{${c.d}}\).`,
   why:()=>T`\(\operatorname{im}(A)\) is a subspace of \(\mathbb R^m\); it can be smaller. Its dimension is the number of pivots.`},
  {id:'C14.M.cols',name:'Columns can be redundant',cands:()=>[{p:{}}],premise:(s,p,c)=>s.n===c.d,
   text:(p,c)=>T`\(A\) has ${c.d} column${c.d>1?'s':''}, so the image of \(A\) is spanned by ${c.d} vector${c.d>1?'s':''}.`,
   why:()=>T`The columns span \(\operatorname{im}(A)\), but some may be redundant. Only the pivot columns form a basis (Rank Theorem).`}],
 conviction:(c,s)=>T`\(R\) has ${word(s.f.lead1)} pivot${s.f.lead1>1?'s':''}, so \(\operatorname{rank}(A)=${s.f.lead1}=\dim\operatorname{im}(A)\).`,
 clearing:(c,s)=>T`\(R\) has ${word(s.f.lead1)} pivot${s.f.lead1>1?'s':''}, so \(\dim\operatorname{im}(A)=${s.f.lead1}\), not ${c.d}.`,
 marks:(c,s)=>({R:{box:s.f.pivots,colT:s===c.G&&soundUsesFreeColumns(c)?s.f.free:[]}})
};

 gen(r){const a=nz(r,-3,3),b=nz(r,-3,3),p=ri(r,-3,3),q=ri(r,-3,3);const R=toQ([[1,0,a,p],[0,1,b,q]]),M=matmul(unitLower(r,2),R);if(maxAbs(M)>9)return null;

   text:p=>p.v===3?T`The family has \(A\mathbf x_0=\mathbf b\) and \(A\mathbf d=\mathbf 0\) with \(\mathbf d\ne\mathbf 0\), and the RREF has exactly one free variable, so the solutions form one line.`:p.v===2?T`\(A\mathbf x_0=\mathbf b\), \(A\mathbf d=\mathbf 0\), \(\mathbf d\ne\mathbf 0\), and one free variable.`:p.v?T`The family has \(A\mathbf x_0=\mathbf b\) and \(A\mathbf d=\mathbf 0\) with \(\mathbf d\ne\mathbf 0\), and the RREF has one free variable.`:T`\(A\mathbf x_0=\mathbf b\), \(A\mathbf d=\mathbf 0\) with \(\mathbf d\ne\mathbf 0\), and the RREF has one free variable.`,

  {id:'C20.V.read',cands:c=>[{p:{sg:1}},{p:{sg:-1}}],premise:(s,p,c)=>p.sg===1&&vecEq(s.x0,c.x0)&&vecEq(s.d,c.z),
   text:(p,c)=>{const t=(v,w)=>{const u=p.sg===1?neg(w):w;return isZ(v)?T`${u.n<0?'-':''}${cf(Q(Math.abs(u.n),u.d))}t`:T`${tq(v)}${u.n<0?'-':'+'}${cf(Q(Math.abs(u.n),u.d))}t`;};

// ===================================================================
// Crime variants. Each variant is a crime of its own, grouped under its parent
// family (same title and textbook section). Contract as above: sound argument
// true only for the guilty suspect; a near-miss valid argument false for both;
// a misconception true for both; a misconception true only for the innocent.
const sub1=(t,a,b)=>t.split(a).join(b);
// A variant built by renaming the objects in an existing family's texts.
function renamed(base,id,o){const B=fam[base],rn=s=>s==null?s:o.map.reduce((t,[a,b])=>sub1(t,a,b),String(s));
 const wrap=t=>({...t,id:id+t.id.slice(base.length),text:(p,c)=>rn(t.text(p,c)),name:t.name&&rn(t.name),
  why:t.why&&((p,c)=>rn(t.why(p,c))),falseWhy:t.falseWhy&&((p,s,c)=>rn(t.falseWhy(p,s,c)))});
 const fixItems=list=>list.forEach(it=>{if(it.label)it.label=rn(it.label);if(it.tex)it.tex=rn(it.tex);});
 return {...B,id,parent:base,crime:o.crime,notation:o.notation,
  ...(o.meta||{}),
  gen:B.gen&&(r=>{const c=B.gen(r);if(!c)return null;o.post&&o.post(c);fixItems(c.shared);fixItems(c.G.items);fixItems(c.I.items);return c;}),
  pair:B.pair&&(r=>{const P=B.pair(r);if(!P)return null;const [X,Y,build]=P;for(const S of [X,Y]){o.postSus&&o.postSus(S);fixItems(S.items);}return [X,Y,build];}),
  valids:B.valids.map(wrap),misc:B.misc.map(wrap),conviction:(c,s)=>rn(B.conviction(c,s)),clearing:(c,s)=>rn(B.clearing(c,s)),
  extraItems:B.extraItems&&((c,s)=>B.extraItems(c,s).map(it=>({...it,tex:o.extraTex&&o.extraTex[it.name]||it.tex})))};}

// Cheatsheet: a brief version of the textbook's "Row reduction at a glance" table (Table 2.4.63).
const HELP_INTRO=T`For vectors \(\mathbf v_1,\ldots,\mathbf v_k\), write \(M=[\,\mathbf v_1\ \cdots\ \mathbf v_k\,]\). An REF is enough; back-substitute when you need actual solutions or coefficients.`;
const HELP=[
 ['Find all solutions',T`Reduce \([A\mid\mathbf b]\). If consistent, make the free variables parameters and back-substitute.`],
 ['Classify a system',T`A row \([\,0\ \cdots\ 0\mid c\,]\) with \(c\ne0\): no solution. Otherwise no free variables: unique; any free variable: infinitely many.`],
 ['Span membership',T`Reduce \([M\mid\mathbf w]\). Consistent exactly when \(\mathbf w\in\operatorname{span}\{\mathbf v_i\}=\operatorname{im}(M)\).`],
 ['Independence',T`Reduce \(M\). A pivot in every column: independent. A free variable gives a nonzero \(\mathbf c\) with \(\sum c_i\mathbf v_i=\mathbf 0\).`],
 ['Spanning, bases',T`Reduce \(M\). A pivot in every row: the columns span \(\mathbb R^m\). For \(d\) vectors in a \(d\)-dimensional space, independence suffices for a basis.`],
 ['Coordinates',T`For \(B=(\mathbf b_1,\ldots,\mathbf b_d)\), reduce \([\,\mathbf b_1\ \cdots\ \mathbf b_d\mid\mathbf v\,]\) and back-substitute: the unique coefficients form \(C_B(\mathbf v)\).`],
 ['Row-space basis',T`The nonzero rows of an REF of \(A\) form a basis for \(\operatorname{row}(A)\).`],
 ['Image basis',T`The pivot columns of the original \(A\) (not of its REF) form a basis for \(\operatorname{im}(A)=\operatorname{col}(A)\).`],
 ['Rank and nullity',T`With \(r\) pivots, \(\operatorname{rank}(A)=\dim\operatorname{row}(A)=\dim\operatorname{im}(A)=r\), and \(\dim\operatorname{null}(A)=n-r\), the number of free variables.`],
 ['Basic solutions',T`In \(A\mathbf x=\mathbf 0\), set one free variable to \(1\) and the others to \(0\), then back-substitute. These form a basis for \(\operatorname{null}(A)\).`]];

function readRecord(){let v=null;try{v=JSON.parse(store()?.getItem(KEY)||'null');}catch{}
 if(!v||!Number.isInteger(v.best)||v.best<0||v.best>10||!Number.isSafeInteger(v.shifts)||v.shifts<0)return {best:0,rankIndex:0,shifts:0};
 return {best:v.best,rankIndex:rankFor(v.best),shifts:v.shifts};}
function updateRecord(score,completed){const prior=readRecord(),best=Math.max(prior.best,score),next={best,rankIndex:rankFor(best),shifts:prior.shifts+(completed?1:0)};
 try{store()?.setItem(KEY,JSON.stringify({best:next.best,shifts:next.shifts}));}catch{}
 return {record:next,promotion:next.rankIndex>prior.rankIndex?{from:prior.rankIndex,to:next.rankIndex,score}:null};}

// ---------- deck: ten cases across the whole unit (session-only shuffle bags) ----------
const GROUPS={systems:['C21','C20'],membership:['C03'],independence:['C01','C02','C06'],bases:['C09','C10','C13'],dimension:['C14','C15'],nullspace:['C11']};
const QUOTA=[['systems',2],['membership',1],['independence',2],['bases',2],['dimension',1],['nullspace',1]];
const bags=new Map();
function take(key,values,r,exclude=[]){let bag=(bags.get(key)||[]).filter(x=>values.includes(x));
 if(!bag.some(x=>!exclude.includes(x)))bag=[...bag,...shuffle(values.filter(x=>!bag.includes(x)),r)];
 if(!bag.some(x=>!exclude.includes(x)))bag=[...bag,...shuffle(values,r)];
 const i=bag.findIndex(x=>!exclude.includes(x)),v=bag.splice(i,1)[0];bags.set(key,bag);return v;}
function shuffle(xs,r){const o=xs.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;}
function planDeck(seed){const r=E.rng('deck:'+seed),fams=[];
 for(const [g,n] of QUOTA)for(let k=0;k<n;k++)fams.push(take(g,GROUPS[g],r,fams));
 const order=shuffle(fams,r),flex=take('flex',Object.values(GROUPS).flat(),r,fams);order.splice(7,0,flex);return order;}
// Each family has one or more crimes; rotate through them so repeat shifts see every crime.
function pickCrime(base,seed,avoid){const vs=E.VARIANTS[base]||[base],r=E.rng('crime:'+seed);return take('crime:'+base,vs,r,vs.length>1&&avoid?[avoid]:[]);}
function makeCase(fam,seed){try{return E.makeCase(fam,seed);}catch(e){const alt=Object.values(GROUPS).flat().find(f=>f!==fam);return E.makeCase(alt,seed);}}

// ---------- matrices ----------
function texMat(rows,{aug=null,box=[],rowT=[],colT=[]}={}){
 const cell=(x,i,j)=>{const t=E.tq(x),boxed=box.some(([a,b])=>a===i&&b===j);
  const tint=rowT.includes(i)?'#f4c3cf':colT.includes(j)?'#bfe3d9':null;
  const value=boxed&&tint?`\\fcolorbox{#101722}{${tint}}{$${t}$}`:boxed?`\\boxed{${t}}`:tint?`\\colorbox{${tint}}{$${t}$}`:t;
  return rowT.length||colT.length?`\\htmlClass{matrixCell matrixRow${i} matrixCol${j}}{${value}}`:value;};
 const body=rows.map((r,i)=>r.map((x,j)=>cell(x,i,j)).join('&')).join('\\\\');
 if(aug==null)return `\\begin{bmatrix}${body}\\end{bmatrix}`;
 return `\\left[\\begin{array}{${rows[0].map((_,j)=>j===aug?'|c':'c').join('')}}${body}\\end{array}\\right]`;}
const NAME={C:'C',R:'R',A:'A',B:'B',N:'N',L:'L',V:'V',W:'W',P:'P',S:'A+B',z:T`\mathbf z`,w:T`\mathbf w`,Az:T`A\mathbf z`,M:T`[A\mid\mathbf b]`,b:T`\mathbf b`,c:T`\mathbf c`};
const grid=it=>it.vec?it.vec.map(x=>[x]):it.rows;
function item(it,mk={}){const tag=it.label?`<div class="evTag">${P(it.label)}</div>`:'';
 if(it.body)return `<div class="ev">${tag}<div class="mx">${K(it.body,true)}</div></div>`;
 const marked=!!(mk.rowT?.length||mk.colT?.length),math=K((it.tex||NAME[it.name])+'='+texMat(grid(it),{aug:it.aug??null,...mk}),true,marked);
 return `<div class="ev">${tag}<div class="mx">${marked?`<div class="matrixMath" data-row-tints="${(mk.rowT||[]).join(',')}" data-col-tints="${(mk.colT||[]).join(',')}">${math}</div>`:math}</div></div>`;}
function highlightMatrices(){
 for(const matrix of app.querySelectorAll('.matrixMath')){
  let layer=matrix.querySelector('.matrixHighlights');if(!layer){layer=document.createElement('div');layer.className='matrixHighlights';layer.setAttribute('aria-hidden','true');matrix.prepend(layer);}
  const origin=matrix.getBoundingClientRect(),rects=[],z=+(matrix.closest('.play')?.style.zoom)||1;
  for(const [kind,indices] of [['Col',matrix.dataset.colTints],['Row',matrix.dataset.rowTints]])for(const index of indices.split(',').filter(Boolean)){
   const cells=[...matrix.querySelectorAll(`.katex-html .matrix${kind}${index},.mdisp .matrix${kind}${index}`)].map(el=>el.getBoundingClientRect());if(!cells.length)continue;
   const left=Math.min(...cells.map(r=>r.left)),top=Math.min(...cells.map(r=>r.top)),right=Math.max(...cells.map(r=>r.right)),bottom=Math.max(...cells.map(r=>r.bottom));
   rects.push(`<span class="${kind==='Row'?'row':'col'}Highlight" style="left:${(left-origin.left)/z}px;top:${(top-origin.top)/z}px;width:${(right-left)/z}px;height:${(bottom-top)/z}px"></span>`);
  }
  layer.innerHTML=rects.join('');
 }}

 const board=$('#board');document.fonts?.ready.then(()=>{if(board.isConnected)fit();});}
function actionBar(X,review){
 if(review)return `<div class="navBtns"><button class="btn" id="prevRev"${S.i===0?' disabled':''}>◂ Prev</button><button class="btn gold" id="backRev">Casebook</button><button class="btn" id="nextRev"${S.i===S.deck.length-1?' disabled':''}>Next ▸</button></div>`;
 if(X.done)return `<button class="btn gold restBtn" id="nextBtn">${S.i+1===S.deck.length?'Close the casebook ▸':'Next case ▸'}</button>`;
 const ready=X.charge!=null&&X.pick!=null;
 return `<div class="seg" role="group" aria-label="Charged"><span>Charged</span>${[1,2].map(n=>`<button type="button" class="btn" data-charge="${n}" aria-pressed="${X.charge===n}" aria-label="Charge Suspect ${n}">${n}</button>`).join('')}</div>
  <button class="btn gold restBtn" id="restBtn"${ready?'':' disabled'}><span>Rest your case</span></button>`;}
function verdictHTML(X){const c=X.c,F=E.FAMILIES[c.fam],o=c.options[X.pick],chargedSide=c.sideOf(X.charge),g=c.label('G');
 const conv=X.verdict==='conviction',wrongArgument=X.verdict==='acquittal'&&chargedSide==='G';
 const reason=!FEEDBACK.verdictReason?'':conv?'Right suspect, sound argument.':chargedSide==='I'?`Suspect ${X.charge} is innocent.`:`Suspect ${g} committed the crime, but your argument does not prove it.`;
 const sound=c.options.find(option=>option.role==='sound');
 const why=`<h3>${wrongArgument?`The valid argument against Suspect ${g}`:conv?`Why Suspect ${g} is guilty`:`The argument against Suspect ${g}`}</h3><p>${P(E.optionText(c,sound))}</p>`;
 // Silenced explanations, kept for later use.
 const t=E.template(c.fam,o.tid),lesson=FEEDBACK.misconceptionLesson&&!conv&&t.why?`<div class="lesson"><b>${P(t.name)}</b> ${P(t.why(o.params,c))}</div>`:'';
 const clear=FEEDBACK.clearing?`<p>${P(F.clearing(c,c.I))}</p>`:'';
 const yourArgument=wrongArgument?`<div class="yourArgument"><h3>Your argument against Suspect ${X.charge}</h3><p>${P(E.optionText(c,o))}</p></div>`:'';
 return `<section class="card verdictCard v-${X.verdict}" id="verdict" tabindex="-1"><div class="vHead"><h2>${conv?`Suspect ${X.charge} convicted.`:`Suspect ${X.charge} acquitted.`}</h2>${reason?`<p>${esc(reason)}</p>`:''}<div class="stamp" aria-hidden="true">${conv?'CONVICTED':'ACQUITTED'}</div></div>
  <div class="vBody">${yourArgument}${why}${lesson}${clear}<p class="fine">${reading(c,F)}</p>${S.screen==='play'?promoNotice(S.promotion):''}</div></section>`;}
// Silenced: per-argument notes from the prototype.
function optNotes(c,o){const truth=[1,2].map(n=>`Suspect ${n} ${E.premiseOn(c,o,c.sideOf(n))?'✓':'✗'}`).join(' · ');return `<div class="optNotes">Premise true for: ${truth}</div>`;}

function bindCase(review){const X=cur();
 if(review){$('#prevRev').onclick=()=>showReview(S.i-1);$('#nextRev').onclick=()=>showReview(S.i+1);$('#backRev').onclick=end;return;}
 $('#homeBtn').onclick=()=>modal('leave');
 if(X.done){$('#nextBtn').onclick=next;return;}
 app.querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>setCharge(+b.dataset.charge));
 app.querySelectorAll('input[name=arg]').forEach(inp=>inp.onchange=()=>setPick(+inp.value));
 $('#restBtn').onclick=rest;}
function setCharge(n){const X=cur();if(X.done)return;X.charge=n;sync();}
function setPick(k){const X=cur();if(X.done)return;X.pick=k;const inp=app.querySelectorAll('input[name=arg]')[k];if(inp)inp.checked=true;sync();}
function sync(){const X=cur();
 app.querySelectorAll('.opt').forEach((l,k)=>l.classList.toggle('sel',k===X.pick));
 app.querySelectorAll('.sus').forEach((s,k)=>s.classList.toggle('charged',X.charge===k+1));
 app.querySelectorAll('.chargeBtn').forEach(b=>{const on=X.charge===+b.dataset.charge;b.setAttribute('aria-pressed',on);b.textContent=on?'Charged':'Charge';});
 $('#actionBar').innerHTML=actionBar(X,false);
 $('#actionBar').querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>setCharge(+b.dataset.charge));$('#restBtn').onclick=rest;}
function rest(){const X=cur();if(X.done||X.charge==null||X.pick==null)return;const c=X.c;
 const scrolls=['.play'].map(selector=>({selector,top:$(selector).scrollTop}));
 const closingHeight=$('.closing').getBoundingClientRect().height;
 X.verdict=E.verdict(c,c.options[X.pick],c.sideOf(X.charge));X.done=true;
 // cold case: the first acquittal in cases 1–4 comes back as case 8
 if(X.verdict==='acquittal'&&!S.revisit&&S.i<=3&&S.deck.length>7){S.revisit={slot:7,fam:c.base,crime:c.fam};S.deck[7]=c.base;}
 const st=stats(),saved=updateRecord(st.conv,st.closed===S.deck.length);S.record=saved.record;S.promotion=saved.promotion;if(saved.promotion)S.shiftPromotion=saved.promotion;
 live.textContent=`${X.verdict==='conviction'?'Convicted':'Acquitted'}. `;
 if(!reduceMotion()&&navigator.vibrate){try{navigator.vibrate(X.verdict==='conviction'?[30]:[40,60,40]);}catch{}}
 // Reveal annotations on the existing evidence, without rebuilding or resizing the board.
 $('.play').style.setProperty('--closing-height',`${closingHeight}px`);
 $('.play').classList.add('done');
 $('.chargeInst').setAttribute('aria-hidden','true');
 $('.closingInst').setAttribute('aria-hidden','true');
 app.querySelectorAll('.susStatus').forEach((el,k)=>{el.innerHTML=guiltTag(c.sideOf(k+1));});
 $('.closing').setAttribute('aria-label','Case verdict');
 $('.opts').outerHTML=verdictHTML(X);
 $('#actionBar').innerHTML=actionBar(X,false);
 const header=document.createElement('template');header.innerHTML=topBar(false);
 $('#top').replaceChildren(...header.content.firstElementChild.childNodes);
 bindCase(false);
 // Shorter feedback must not clamp the scroll position on narrow screens.
 scrolls.forEach(({selector,top})=>{$(selector).scrollTop=top;});
 $('#verdict')?.focus({preventScroll:true});}
function next(){if(S.i+1<S.deck.length){S.i++;loadCase();}else end();}
const desktop=()=>matchMedia('(min-width:1000px)').matches;
// Lower a CSS scale variable on el in small steps until test() reports no overflow.
function shrink(el,name,test,min=.6){let k=1;el.style.setProperty(name,1);while(test()&&k>min){k=Math.round((k-.05)*100)/100;el.style.setProperty(name,k);}}
// (KaTeX brackets overhang their box by a pixel or two, hence the small tolerance.)
const over=el=>el&&(el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+4);
const wideMath=root=>[...root.querySelectorAll('.mx')].some(m=>m.scrollWidth>m.clientWidth+4);
function fit(){const b=$('#board');if(!b)return;const play=b.closest('.play');
 const scrolls=[play].map(el=>({el,top:el.scrollTop}));
 b.classList.remove('stacked');play.style.zoom='';play.style.overflowY='';
 if(desktop()){
  // The stack has one fixed height; on short windows shrink all of it by the same factor.
  const cs=getComputedStyle(play),need=['--bandH','--susH','--argH'].reduce((a,v)=>a+parseFloat(cs.getPropertyValue(v)),0)+2*parseFloat(cs.rowGap)+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const fitZ=play.clientHeight/need,z=Math.max(.72,Math.min(1,fitZ));if(z<1)play.style.zoom=z;
  play.style.overflowY=fitZ<.72?'auto':'';// very short windows: smallest size, then scroll
  // Inside each fixed box, shrink the content (never the box). One factor per box: both suspects
  // and all four arguments always share a size, so size never hints at an answer.
  const fb=$('.fileBody'),sh=$('.shared');
  shrink(fb,'--bandS',()=>over(fb),.7);
  if(sh)shrink(sh,'--shS',()=>over(sh)||wideMath(sh));
  shrink(b,'--susS',()=>[...b.querySelectorAll('.evs')].some(over)||wideMath(b));
  const opts=$('.opts');if(opts)shrink(opts,'--argS',()=>[...opts.querySelectorAll('.opt')].some(over),.7);
 }else{
  const tooWide=()=>[...b.querySelectorAll('.sus')].some(s=>{const avail=s.clientWidth-16;return [...s.querySelectorAll('.katex-display,.mdisp')].some(k=>k.scrollWidth>avail);});
  b.classList.toggle('stacked',tooWide());
 }
 for(const selector of ['.susHead','.evs > .ev','.moreEvidence']){
  const panels=[...b.querySelectorAll(selector)];
  panels.forEach(el=>el.style.minHeight='');
  if(panels.length<2)continue;
  const height=Math.max(...panels.map(el=>el.getBoundingClientRect().height))/(+play.style.zoom||1);
  panels.forEach(el=>el.style.minHeight=`${height}px`);
 }
 highlightMatrices();
 scrolls.forEach(({el,top})=>{el.scrollTop=top;});
 observeCrime();}
let crimeObs=null;
function observeCrime(){if(crimeObs)crimeObs.disconnect();const cr=$('#crime'),top=$('#top');if(!cr||!top||!('IntersectionObserver' in window))return;
 const play=$('.play'),root=play;
 crimeObs=new IntersectionObserver(([e])=>top.classList.toggle('showMini',e.boundingClientRect.bottom<=e.rootBounds.top),{root,threshold:0});crimeObs.observe(cr);}

function end(){setScreen('end');const st=stats(),n=S.deck.length,rec=S.record,newBest=rec.best>S.startBest;
 const praise=st.conv===n?'Every case closed with a sound conviction. A perfect shift.':st.conv>=8?'Strong work. Review the acquittals before your next shift.':st.conv>=5?'Solid shift. Open an acquitted case to see the sound argument.':'Every case is a lesson. Open the acquitted cases to see the sound arguments.';
 app.innerHTML=`<header class="endTop"><h1>Null &amp; Order</h1><p>Shift complete.</p></header>
 <div class="startScreen"><section class="card endCard"><div class="endHead">${promoNotice(S.shiftPromotion)}<h2 style="margin-top:${S.shiftPromotion?'14px':'0'}">Casebook closed.</h2>
  <div class="bigScore"><b>${st.conv}/${n}</b><span>convictions</span></div>${newBest?'<span class="newBest">New best score!</span>':''}</div>
  <div class="endBody">${rankBadge(rec.rankIndex)}<p>${esc(praise)}</p>
   <p class="fine">Best score: ${rec.best}/10 · Next promotion: ${esc(nextPromotion(rec.rankIndex))}</p>
   <div class="review"><div class="reviewDots" aria-label="Review cases">${S.cases.map((x,k)=>`<button class="${x.verdict==='conviction'?'c':'a'}" data-review="${k}" aria-label="Review case ${k+1}: ${x.verdict}">${k+1}<i aria-hidden="true">${x.verdict==='conviction'?'✓':'✗'}</i></button>`).join('')}</div>
    <div class="legend"><span>✓ Convicted</span><span>✗ Acquitted</span><span>Tap a case to review it.</span></div></div>
   <div class="endBtns"><button class="btn gold startBtn" id="newShift" style="width:auto;flex:1">New shift</button><button class="btn" id="homeEnd">Home</button></div></div></section></div>`;
 app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>showReview(+b.dataset.review));
 $('#newShift').onclick=newShift;$('#homeEnd').onclick=start;window.scrollTo(0,0);}
function showReview(k){if(k<0||k>=S.cases.length)return;S.i=k;setScreen('review');render();window.scrollTo(0,0);}

// ---------- dialogs ----------
function modal(kind){let html='';
 if(kind==='leave')html=`<section class="card dialog small" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dHead"><h2 id="dT">Leave shift?</h2></div><div class="dBody"><p>Return to the menu? Current shift progress will be cleared.</p></div><div class="dActions"><button class="btn" data-close>Cancel</button><button class="btn gold" id="confirmLeave">Menu</button></div></section>`;
 if(kind==='info')html=`<section class="card dialog" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dHead"><h2 id="dT">About Null &amp; Order</h2></div><div class="dBody">
  <p><strong>Version:</strong> Null &amp; Order [v0.4(beta)]</p>
  <p><strong>Copyright:</strong> © 2026 <a href="https://people.math.wisc.edu/~roch/" target="_blank" rel="noopener noreferrer">Sébastien Roch</a></p>
  <p><strong>Code license:</strong> The software source code—including the functional HTML, CSS, and JavaScript—is available under the <a href="https://opensource.org/license/mit" target="_blank" rel="noopener noreferrer">MIT License</a>.</p>
  <p><strong>Content license:</strong> Except where otherwise noted, the original instructional text, questions, feedback, and visual assets are licensed under the <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">Creative Commons Attribution-NonCommercial 4.0 International License</a>.</p>
  <p><strong>Textbook:</strong> <a href="https://math345-textbook.github.io/" target="_blank" rel="noopener noreferrer">math345-textbook.github.io</a></p>
  <p><strong>Privacy:</strong> ${esc(PRIVACY)}</p>
  <p><strong>Acknowledgments:</strong> Thanks to Betsy Stovall and Jingyi Li for helpful feedback.</p></div><div class="dActions"><button class="btn gold" data-close>Close</button></div></section>`;
 const opener=document.activeElement;
 host.innerHTML=`<div class="overlay" id="ov">${html}</div>`;
 const close=()=>{host.innerHTML='';if(opener&&opener.focus)opener.focus();};
 host.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
 $('#ov').onclick=e=>{if(e.target.id==='ov')close();};
 const cl=$('#confirmLeave');if(cl)cl.onclick=()=>{host.innerHTML='';start();};
 const f=host.querySelector('.dActions .btn.gold')||host.querySelector('button');if(f)f.focus();}
document.getElementById('infoBtn').onclick=()=>modal('info');

// ---------- keyboard ----------
const typing=el=>el.tagName==='SELECT'||el.tagName==='TEXTAREA'||el.tagName==='INPUT'&&!['radio','checkbox'].includes(el.type);
document.addEventListener('keydown',e=>{
 if(host.firstChild){if(e.key==='Escape'){const b=host.querySelector('[data-close]');if(b)b.click();}
  if(e.key==='Tab'){const f=[...host.querySelectorAll('button,a[href]')];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}}return;}
 if(S.screen!=='play'||typing(e.target)||e.altKey||e.ctrlKey||e.metaKey)return;const X=cur();
 if(!X.done){if(e.key==='1'||e.key==='2')setCharge(+e.key);const k='abcd'.indexOf(e.key.toLowerCase());if(k>=0&&e.key.length===1)setPick(k);}
 if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='A'){const b=$('#restBtn')||$('#nextBtn');if(b&&!b.disabled){e.preventDefault();b.click();}}});
addEventListener('resize',()=>{clearTimeout(fit.t);fit.t=setTimeout(fit,120);});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
