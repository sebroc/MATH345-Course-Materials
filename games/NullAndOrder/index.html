<style>
:root{
  --bg:#1b2028;
  --paper:#f8f4ea;
  --paper2:#fbf8f2;
  --ink:#1a2030;
  --muted:#5e6778;
  --line:#202634;
  --gold:#c8a465;
  --teal:#dce9e4;
  --rose:#f1dde1;
  --green:#5c7f77;
  --wine:#87535d;
  --shadow:0 22px 48px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  padding:14px;
  color:var(--ink);
  font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 14% 12%, rgba(200,164,101,.18) 0 10rem, transparent 10.2rem),
    radial-gradient(circle at 84% 10%, rgba(92,127,119,.16) 0 11rem, transparent 11.2rem),
    radial-gradient(circle at 16% 88%, rgba(135,83,93,.18) 0 10rem, transparent 10.2rem),
    repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 11px, rgba(255,255,255,0) 11px 22px),
    linear-gradient(145deg, #171b22, #212732 45%, #151920);
}
.game{
  width:min(1240px, calc(100vw - 28px));
  margin:0 auto;
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.top{
  position:relative;
  overflow:hidden;
  padding:18px 20px 16px;
  border-bottom:2px solid var(--line);
  background:
    linear-gradient(135deg, rgba(255,255,255,.82), rgba(255,255,255,.3)),
    linear-gradient(160deg, #f0e5cf, #faf7ef 56%, #efe9de);
}
.glassArt{
  position:absolute;
  top:-8px;
  right:16px;
  width:112px;
  height:112px;
  object-fit:contain;
  transform:rotate(5deg);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));
  opacity:.98;
  pointer-events:none;
}
.title{
  margin:0;
  font-size:36px;
  line-height:.94;
  letter-spacing:-.06em;
  font-weight:1000;
}
.subtitle{
  margin:8px 0 0;
  font-size:14px;
  line-height:1.35;
  color:var(--muted);
  font-weight:750;
  max-width:780px;
}
.statsRow{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-top:12px;
}
.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 12px;
  border:2px solid var(--line);
  border-radius:999px;
  background:#fff;
  box-shadow:0 3px 0 var(--line);
  font-size:12px;
  line-height:1;
  font-weight:1000;
}
.pill.gold{background:#f6e7bf}
.pill.teal{background:#dce9e4}
.pill.rose{background:#f1dde1}
.restartPill{
  appearance:none;
  cursor:pointer;
  color:var(--ink);
  font:1000 12px/1 ui-sans-serif, system-ui, sans-serif;
  margin-left:auto;
}
.restartPill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.caseBar{
  display:block;
  padding:20px 18px 18px;
  border-bottom:2px solid var(--line);
  background:linear-gradient(90deg, #fefcf6, #f4efe5 55%, #ede8de);
  text-align:center;
}
.caseBar h2{
  margin:0;
  font-size:clamp(24px, 3.5vw, 32px);
  line-height:1.02;
  letter-spacing:-.05em;
  font-weight:1000;
  text-align:left;
}
.caseLine{
  margin:22px 0 0;
  font-size:clamp(18px, 2.65vw, 23px);
  line-height:1.2;
  color:#626b79;
  font-weight:1000;
}
.mathCode,.mono{
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight:900;
}
.vec{font-weight:1000}
.ruleBox{
  min-width:190px;
  padding:11px 12px;
  border:2px solid var(--line);
  border-radius:18px;
  background:#fff;
  box-shadow:0 4px 0 var(--line);
}
.ruleTop{
  font-size:10px;
  line-height:1;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#677182;
  font-weight:1000;
}
.ruleCount{
  margin-top:8px;
  font-size:14px;
  line-height:1.1;
  font-weight:950;
}
.ruleDots{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
}
.ruleDot{
  width:14px;
  height:14px;
  border:2px solid var(--line);
  border-radius:50%;
  background:#fff;
}
.ruleDot.live{background:var(--gold)}
.main{padding:14px 18px 18px}
.evidenceRow{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:12px 0 10px;
}
.evidenceCard{
  border:2px solid var(--line);
  border-radius:18px;
  background:#fff;
  box-shadow:0 4px 0 var(--line);
  padding:10px 12px;
  min-height:72px;
  text-align:center;
}
.evidenceLabel{
  font-size:10px;
  line-height:1;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#667182;
  font-weight:1000;
  margin-bottom:8px;
}
.objWrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:0;
  width:100%;
}
.matrixFrame{position:relative;display:inline-block;padding:0 10px}
.matrixFrame::before,.matrixFrame::after{
  content:"";
  position:absolute;
  top:-5px;
  bottom:-5px;
  width:8px;
  border-top:3px solid var(--line);
  border-bottom:3px solid var(--line);
}
.matrixFrame::before{left:0;border-left:3px solid var(--line);border-radius:8px 0 0 8px}
.matrixFrame::after{right:0;border-right:3px solid var(--line);border-radius:0 8px 8px 0}
.matrixFrame.compact{padding:0 8px}
.matrixFrame.compact::before,.matrixFrame.compact::after{top:-4px;bottom:-4px}
.matrixTable{border-collapse:separate;border-spacing:0 3px}
.matrixTable td{
  min-width:28px;
  height:28px;
  padding:0 5px;
  text-align:center;
  white-space:nowrap;
  border-left:0;
  border-bottom:0;
  vertical-align:middle;
  font:900 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.matrixFrame.compact .matrixTable td{min-width:24px;height:24px;font-size:13px;padding:0 4px}
.matrixFrame.augmented .matrixTable{border-spacing:0}
.matrixTable td.sep{border-left:3px solid var(--line);padding-left:8px}
.setWrap{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.setBrace{font:1000 46px/1 ui-sans-serif,system-ui,sans-serif;display:flex;align-items:center;align-self:stretch;transform:none}
.setItems{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;justify-content:center}
.board{
  position:relative;
  border:2px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:0 6px 0 var(--line);
  overflow:hidden;
}
.boardHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 14px;
  border-bottom:2px solid var(--line);
  background:linear-gradient(90deg, #f0e6d2, #faf6ee 62%, #eee8de);
}
.boardTitle{font-size:18px;line-height:1;font-weight:1000;letter-spacing:-.03em}
.boardNote{
  min-height:31px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  font-size:15px;
  line-height:1.25;
  color:var(--muted);
  font-weight:900;
  text-align:right;
}
.boardNoteBubble{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:31px;
  padding:3px 12px;
  border:2px solid var(--line);
  border-radius:999px;
  background:var(--gold);
  color:var(--ink);
  box-shadow:0 3px 0 var(--line);
  font-weight:1000;
}
.clueTable{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:fixed;
}
.clueTable > thead > tr > th,
.clueTable > tbody > tr > td{
  vertical-align:top;
  border-bottom:2px solid var(--line);
}
.clueTable > tbody > tr:last-child > td{border-bottom:0}
.clueTable > thead > tr > th{background:var(--paper2);padding:0;text-align:left}
.clueTable > thead > tr > th + th,
.clueTable > tbody > tr > td + td{border-left:2px solid var(--line)}
.leftHead{width:31%;padding:0 !important}
.suspectHead{width:34.5%}
.suspectCardMini{
  min-height:134px;
  display:grid;
  grid-template-rows:auto auto auto;
  gap:12px;
  align-content:center;
  align-items:center;
  justify-items:center;
  padding:16px 12px 14px;
}
.suspectCardMini.a{background:linear-gradient(180deg, #e7efef, #fff)}
.suspectCardMini.b{background:linear-gradient(180deg, #f5e8eb, #fff)}
.susTop{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.susName{display:flex;align-items:center;justify-content:center;gap:8px}
.susNameText{font-size:20px;line-height:1;font-weight:1000;letter-spacing:-.03em}
.susBadge{
  width:32px;
  height:32px;
  border:2px solid var(--line);
  border-radius:999px;
  background:#fff;
  display:grid;
  place-items:center;
  font-size:15px;
  font-weight:1000;
  box-shadow:0 2px 0 var(--line);
}
.aliasChip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.78);
  font-size:16px;
  line-height:1;
  font-weight:950;
  color:var(--muted);
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}
.aliasChip .mono,.aliasChip .vec{
  color:var(--ink);
  font-weight:1000;
}
.aliasChip sup{
  font-size:.78em;
  line-height:0;
}
.questionCell{width:31%;padding:0}
.answerCell{width:34.5%;padding:12px 14px;font-size:14px;line-height:1.35;font-weight:850;color:#2b3342;background:#fff}
.answerCell sub{font-size:.72em;line-height:0;vertical-align:sub}
.answerCell.empty{background:#fbf9f5;color:#9da4b2}
.vectorPairAnswer{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
}
.vectorPairAnd{
  display:inline-flex;
  align-items:center;
  align-self:center;
  font-weight:1000;
  color:var(--ink);
}
.askBtn{
  width:100%;
  min-height:66px;
  padding:12px 16px;
  border:0;
  background:#fff;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
  font:inherit;
  transition:background .12s ease, transform .06s ease;
}
.askBtn:hover{background:#f4efe6}
.askBtn:active{transform:translateY(2px)}
.askBtn.used{background:#f8f9fb;cursor:default}
.askBtn.locked{background:#fbfaf6;color:#a1a7b4;cursor:not-allowed}
.askBtn[disabled]{cursor:not-allowed}
.qLabel{display:block;font-size:15px;line-height:1.28;font-weight:1000;letter-spacing:-.02em}
.qSub{display:block;margin-top:6px;font-size:12px;line-height:1;color:#70798a;font-weight:800}
.decisionRow{
  display:grid;
  grid-template-columns:31% 34.5% 34.5%;
  gap:0;
  align-items:stretch;
  margin-top:12px;
}
.decisionSpacer{min-height:1px}
.btn{
  appearance:none;
  border:2px solid var(--line);
  border-radius:999px;
  background:#fff;
  box-shadow:0 3px 0 var(--line);
  color:var(--ink);
  cursor:pointer;
  font:900 13px/1 ui-sans-serif, system-ui, sans-serif;
  padding:10px 13px;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.gold{background:#f6e7bf}
.btn.teal{background:#dce9e4}
.btn.rose{background:#f1dde1}
.decisionBtn{
  width:calc(100% - 14px);
  justify-self:center;
  min-height:64px;
  padding:14px 18px;
  font-size:24px;
  letter-spacing:-.03em;
  box-shadow:0 5px 0 var(--line);
}
.statusBar{
  margin-top:12px;
  min-height:42px;
  display:flex;
  align-items:center;
  padding:10px 12px;
  border:2px solid var(--line);
  border-radius:16px;
  background:#faf7f0;
  font-size:13px;
  line-height:1.3;
  color:#495264;
  font-weight:900;
}
.resultWrap{margin-top:12px}
.resultCard{
  border:2px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:0 6px 0 var(--line);
  overflow:hidden;
}
.resultTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  border-bottom:2px solid var(--line);
}
.resultTop.good{background:#dce9e4}
.resultTop.bad{background:#f1dde1}
.resultTitle{font-size:26px;line-height:1;font-weight:1000;letter-spacing:-.05em}
.resultButtons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.explainPanel{
  display:none;
  padding:13px 16px;
  background:#fffaf3;
  border-top:2px solid var(--line);
}
.explainPanel.show{display:block}
.explainPanel p{margin:0;font-size:14px;line-height:1.42;font-weight:850;color:#2e3746}
.explainPanel p + p{margin-top:9px}
.footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:12px 18px;
  border-top:2px solid var(--line);
  background:#f8f4eb;
}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:13px;height:13px;border:2px solid var(--line);border-radius:50%;background:#fff}
.dot.done{background:var(--green)}
.dot.fail{background:var(--wine)}
.dot.now{background:var(--gold)}
.startScreen,.endScreen{padding:28px 18px 32px;display:grid;place-items:center}
.startCard,.endCard{
  width:min(760px, 100%);
  border:2px solid var(--line);
  border-radius:24px;
  background:#fff;
  box-shadow:0 7px 0 var(--line);
  overflow:hidden;
}
.startHead,.endHead{padding:18px 20px;border-bottom:2px solid var(--line);background:linear-gradient(135deg,#efe6d2,#faf7ef 60%,#ede8de)}
.startHead h2,.endHead h2{margin:0;font-size:36px;line-height:.95;letter-spacing:-.06em}
.startBody,.endBody{padding:18px 20px}
.startBody p,.endBody p{margin:0;font-size:15px;line-height:1.48;font-weight:850;color:#2e3746}
.startBody p + p,.endBody p + p{margin-top:10px}
.rulesList{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ruleItem{
  border:2px solid var(--line);
  border-radius:18px;
  background:#fbf8f1;
  padding:11px 12px;
  font-size:14px;
  line-height:1.4;
  font-weight:850;
  color:#2e3746;
}
.startBtns,.endBtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.startBtn{min-height:56px;padding:14px 20px;font-size:22px;box-shadow:0 5px 0 var(--line)}
.restartOverlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(5,8,13,.58);
}
.restartDialog{
  width:min(430px, calc(100vw - 40px));
  border:2px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:0 8px 0 var(--line), 0 24px 54px rgba(0,0,0,.34);
  overflow:hidden;
}
.restartDialogHead{
  padding:16px 18px;
  border-bottom:2px solid var(--line);
  background:linear-gradient(135deg,#efe6d2,#faf7ef 60%,#ede8de);
}
.restartDialogHead h2{
  margin:0;
  font-size:28px;
  line-height:.98;
  letter-spacing:-.05em;
}
.restartDialogBody{padding:16px 18px 18px}
.restartDialogBody p{
  margin:0;
  font-size:14px;
  line-height:1.42;
  font-weight:850;
  color:#2e3746;
}
.restartActions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}
.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.summaryBox{border:2px solid var(--line);border-radius:18px;background:#fbf8f1;padding:12px;text-align:center}
.summaryBox span{display:block;font-size:11px;line-height:1;color:#6a7383;text-transform:uppercase;letter-spacing:.09em;font-weight:1000}
.summaryBox b{display:block;margin-top:8px;font-size:30px;line-height:1;font-weight:1000;letter-spacing:-.05em}
.bigScore{font-size:64px;line-height:1;font-weight:1000;letter-spacing:-.08em;color:#345d54;margin-top:10px}
@media (max-width: 980px){
  .glassArt{width:102px;height:102px;top:-6px}
}

@media (min-width: 781px){
  .answerSheet,.sheetBackdrop{display:none}
}
@media (max-width: 780px){
  body{padding:10px}
  .game{width:100%}
  .top,.caseBar,.main,.footer{padding-left:14px;padding-right:14px}
  .top{padding-right:14px}
  .glassArt{display:none}
  .caseBar{grid-template-columns:1fr}
  .decisionRow{grid-template-columns:31% 34.5% 34.5%}
  .decisionSpacer{display:block}
  .decisionBtn{width:calc(100% - 10px);font-size:20px;line-height:1.08}
  .summaryGrid{grid-template-columns:1fr}
}
</style>


<style>

.suspectCardMini.b{background:linear-gradient(180deg,#efd9e1,#fffdf7)}
.btn.gold{background:#d7b76c}
.startHead{background:#d7b76c}
.btn.teal{background:#d8ebe8;color:#101722}
.btn.rose{background:#efd9e1;color:#101722}

.resultTop.bad{background:#efd9e1}
.footer{background:#dbe3e8}

<style id="course-alignment-revision-styles">
.feedbackReport{
  margin-top:18px;
  display:grid;
  gap:12px;
}
.feedbackCase{
  border:2px solid var(--line);
  border-radius:18px;
  background:#fbf8f1;
  padding:20px 22px;
}
.feedbackCase.caseReport{
  display:grid;

  opacity:.72;
}
.v3Top{

  align-items:center;
  gap:var(--space-2);

.resultCell{

  font-size:13px;

// Null &amp; Order — randomized one-clue case game
// The seed is based on date+time down to milliseconds and is not shown to players.
const SEED_STRING = new Date().toISOString() + '|' + Date.now();

function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function() {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function scrambleRows(A, count=4) {
  const M = clone(A);
  for (let k=0; k<count; k++) {
    if (rand() < 0.35) {
      const i = randInt(0, M.length - 1);
      let j = randInt(0, M.length - 1);
      if (j === i) j = (j + 1) % M.length;
      [M[i], M[j]] = [M[j], M[i]];
    } else {
      const target = randInt(0, M.length - 1);
      let source = randInt(0, M.length - 1);
      if (source === target) source = (source + 1) % M.length;
      const c = choice([-2,-1,1,2]);
      M[target] = M[target].map((x, j) => x + c * M[source][j]);

  }
  return M;
}

function scrambleAwayFromRREF(A,count=4) {

  }
  const candidate=clone(A);
  if(candidate.length>1)candidate[0]=candidate[0].map((value,index)=>value+candidate[1][index]);
  return candidate;
}

function makeTutorialCase() {

  const bank=[
    question('Compute <span class="mono">A<span class="vec">z</span></span>.',{A:colVectorHTML(matVec(A,good),true),B:colVectorHTML(matVec(A,bad),true)},'decisive',{cost:1,group:'Az'}),
    question('Compute <span class="mono">A<sup>T</sup><span class="vec">z</span></span>.',answerSame(shapeError('not defined: $A^{T}$ is $3\\times2$ and $\\mathbf{z}\\in\\mathbb{R}^{3}$')),'misleading',{cost:1}),
    question('Compute <span class="mono">RREF([A | z])</span>.',attemptedBadAugmentInput(A,'z'),'misleading',{cost:3}),
    question('Compute <span class="mono">rank(A)</span>.',answerSame('<span class="mono">'+rank(A)+'</span>'),'neutral',{cost:2,allowWeak:true})
  ];
  return finalizeCase({id:'first-case-guide',title:'Case 0 · practice: the hidden direction',crime:'Being in <span class="mono">null(A)</span>.',math:'A suspect committed the crime when <span class="mono">A<span class="vec">z</span> = 0</span>.',evidence:[{label:'Evidence A',html:matrixHTML(A)}],suspects:{A:{html:colVectorHTML(good)},B:{html:colVectorHTML(bad)}},questions:bank,guilty:'A',explanation:'Suspect A committed the crime because <span class="mono">A<span class="vec">z</span> = 0</span>, while the other suspect is not sent to zero.',fastRoute:'Compute <span class="mono">A<span class="vec">z</span></span>.',learningGoal:'Recognize null-space membership by computing Az.',decisionRule:'A vector is in null(A) exactly when Az is the zero vector.'});
}
function loadNextCase(tutorial=false) { state.current=makePlayState(tutorial?makeTutorialCase():nextCaseObject());state.current.tutorial=!!tutorial; }
function tutorialText(playState) {
  if (!playState?.tutorial || playState.resolved) return '';
  const jury='The jury only convicts on evidence they can see: put a clear-cut clue on the table before charging — even if you can do the computation in your head.';
  if (!playState.clueLog.length) return `Choose a test that directly addresses the crime. ${jury}`;
  if (hasDecisiveClue(playState)) return 'Read both results, then charge the suspect the evidence implicates. One clue was enough — the minimum.';

}

}

}

function smokeTestPersistence() {

function smokeTestShiftAndReport() {
  const saved=snapshotState();try{state.mode='play';state.convictions=0;state.shiftExtras=0;state.attempted=0;state.history=[];state.caseLog=[];state.deck=[];for(let i=0;i<SHIFT_CASES;i++){state.current=makePlayState(makeTutorialCase());state.current.tutorial=false;const dec=state.current.caseObj.questions.findIndex(q=>q.kind==='decisive');revealQuestion(state.current,dec);resolveCase(state.current,state.current.caseObj.guilty,'conviction');if(i<SHIFT_CASES-1&&finishAfterCurrentCase())throw new Error('Shift ended before 10 cases.');}if(!finishAfterCurrentCase()||state.convictions!==SHIFT_CASES||state.shiftExtras!==0||state.attempted!==SHIFT_CASES)throw new Error('10-case shift accounting failed.');const report=buildReportMarkdown();if(/evidence spent|average evidence|sufficiency bonus|\bpoint\b|penalty|retrial|\bstrokes?\b|\bpar\b|\bkatex\b|mathml|\u200b/i.test(report))throw new Error('Report contains removed economy, golf language, or KaTeX artifacts.');if(!/Extra clues: 0/.test(report))throw new Error('Report is missing extra-clue accounting.');return true;}finally{restoreState(saved);}
}
function smokeTestKatexFallback() { const saved=window.katex;try{window.katex=undefined;const html=matrixHTML([[1,2],[3,4]]);if(!/texFallback/.test(html)||!/data-plain/.test(html))throw new Error('KaTeX fallback failed.');return true;}finally{window.katex=saved;} }
function smokeTestTexSourceEscapes() {
  const saved=window.katex,seen=[];
  try{
    window.katex={renderToString:source=>{seen.push(String(source));return '<span class="fakeKatex"></span>';}};
    lineSystemHTML([[3,-1,4],[1,2,1]]);
    const systemCase=caseUniqueSolution();renderIdentity(systemCase,systemCase.suspects.A);
    if(seen.some(source=>/[\x00-\x1f]/.test(source)))throw new Error('A KaTeX source contains a control character from an under-escaped command.');
    if(!seen.some(source=>source.includes('\\begin{aligned}'))||!seen.some(source=>source.includes('[A\\,|\\,\\mathbf{b}]=')))throw new Error('Line or augmented-system KaTeX source lost its command escapes.');

  }finally{window.katex=saved;}
}

function runAllSmokeTests(iterations=30) {
  const results={cases:smokeTestCases(Math.max(iterations,30)),randomization:smokeTestRandomizationCoverage(200),notation:smokeTestNotation(Math.min(iterations,30)),feedbackNeutrality:smokeTestFeedbackNeutrality(),popupSymmetry:smokeTestPopupSymmetry(),prose:smokeTestProseRendering(Math.min(iterations,20)),scoring:smokeTestScoring(),mistrial:smokeTestMistrialFlow(),defense:smokeTestDefenseArguments(iterations),bestAndPromotion:smokeTestBestAndPromotion(),shiftAndReport:smokeTestShiftAndReport(),persistence:smokeTestPersistence(),katexFallback:smokeTestKatexFallback(),texSources:smokeTestTexSourceEscapes(),studentCopy:smokeTestStudentCopy()};

async function runHeightAudit(iterations=50) {
  const saved=snapshotState();
  const app=document.getElementById('game');
  const savedStyle=app.getAttribute('style')||'';
  const bodyStyle=document.body.getAttribute('style')||'';
  const failures=[];
  let totalCells=0;
  let atLeast80=0;
  try {
    state.mode='play';
    state.history=[];
    state.attempted=0;
    state.convictions=0;
    state.shiftExtras=0;
    for (const [width,height] of [[1280,720],[1440,800]]) {
      document.body.style.width=width+'px';
      document.body.style.height=height+'px';
      app.style.width=(width-16)+'px';
      app.style.height=(height-16)+'px';
      app.style.maxHeight=(height-16)+'px';
      for (let i=0;i<iterations;i++) {
        for (const gen of ACTIVE_CASE_GENERATORS) {
          const c=gen();
          const p=makePlayState(c);
          p.revealed=new Set(c.questions.map((_q,idx)=>idx));
          p.activeClueIndex=0;
          state.current=p;
          app.className='game playFrame';
          document.body.classList.add('playing');
          app.innerHTML=renderCase();
          void app.offsetHeight;
          fitResultRows();
          const board=app.querySelector('.board.desktopBoard');
          const cells=Array.from(app.querySelectorAll('.resultCell.revealed'));
          totalCells+=cells.length;
          atLeast80+=cells.filter(cell=>/fit(?:125|110|095|080)/.test(cell.className)).length;
          const badCells=cells.filter(cell=>cell.classList.contains('scrolling')||cell.scrollHeight>cell.clientHeight+1||cell.scrollWidth>cell.clientWidth+1);
          const heads=Array.from(app.querySelectorAll('.boardHeader'));
          const headHeights=heads.map(el=>Math.round(el.getBoundingClientRect().height));
          const unequalHeads=headHeights.length===3&&new Set(headHeights).size>1;
          const rowParity=[1,2,3].some(row=>{
            const pair=Array.from(app.querySelectorAll(`.resultCell.revealed[data-row="${row}"]`));
            if (pair.length!==2) return false;
            const a=RESULT_SIZE_CLASSES.find(cls=>pair[0].classList.contains(cls));
            const b=RESULT_SIZE_CLASSES.find(cls=>pair[1].classList.contains(cls));
            return a!==b;
          });
          if (!board||board.scrollHeight>board.clientHeight+1||badCells.length||unequalHeads||rowParity) {
            failures.push({width,height,generator:gen.name,boardOverflow:board?board.scrollHeight-board.clientHeight:'missing',badCells:badCells.length,headHeights:headHeights.join('/'),rowParity});
          }
        }
        if ((i+1)%5===0) {
          app.innerHTML='';
          await new Promise(resolve=>setTimeout(resolve,0));
        }
      }
    }
  } finally {
    app.setAttribute('style',savedStyle);
    document.body.setAttribute('style',bodyStyle);
    restoreState(saved);
  }
  const rate=totalCells?atLeast80/totalCells:1;
  if (rate<.95) failures.push({type:'size-rate',rate});
  const summary={iterations,casesChecked:iterations*ACTIVE_CASE_GENERATORS.length*2,totalCells,atLeast80,sizeAtLeast80Rate:rate,failures};
  window.NULL_ORDER_HEIGHT_AUDIT=summary;
  if (failures.length) console.table(failures); else console.info('Null & Order v6 height audit passed.',summary);
  return summary;
}
